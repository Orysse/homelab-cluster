# tools/crowdsec-cilium-bouncer: tests on every change, image on a bouncer-v* tag.
name: bouncer

on:
  pull_request:
    paths: [tools/crowdsec-cilium-bouncer/**]
  push:
    branches: [main, v3]
    paths: [tools/crowdsec-cilium-bouncer/**]
    tags: [bouncer-v*]

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/crowdsec-cilium-bouncer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/crowdsec-cilium-bouncer/go.mod
          cache-dependency-path: tools/crowdsec-cilium-bouncer/go.sum
      - run: go vet ./...
      - run: go test ./...

  image:
    if: startsWith(github.ref, 'refs/tags/bouncer-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#bouncer-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/crowdsec-cilium-bouncer
          push: true
          tags: ghcr.io/orysse/crowdsec-cilium-bouncer:${{ steps.version.outputs.version }}
