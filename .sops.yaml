# Secrets du cluster. Seules les valeurs (data / stringData) sont chiffrées : le reste du
# manifest reste lisible et diffable. Fichiers concernés : *.sops.yaml.
# Destinataires : l'admin (clé age logicielle + YubiKey) et kube-1 (clé SSH d'hôte
# convertie en age ; Flux la reçoit via le Secret flux-system/sops-age, posé par le socle).
keys:
  - &abel_age age1uzjc82ya0szkyht2txxjsk03csk7cpap524lz9v8gjxsaqxlaejsr3tkcc
  - &abel_yubikey age1yubikey1q23p5ysmjm8ukvad9xefunvaq7fz06zsf72jr0vj20z2j48sjjh2jm256cs
  - &kube-1 age1vheyl8p09efd0080vhar893dud22hktq4wst0uhd66x96xng6pqqr8rdep
creation_rules:
  - path_regex: .*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age: [*abel_age, *abel_yubikey, *kube-1]
