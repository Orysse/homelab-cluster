# Actual Budget at budget.int.${DOMAIN} (LAN/VPN only): personal budget, envelopes and
# reports. Login: Pocket-ID only (group admins on the client side). Bank sync through
# Enable Banking (PSD2, read-only), set up in Actual's UI: Actual keeps that key in its own
# database (it cannot read it from a file or the environment).
# State: SQLite files on the NFS volume (single user, low write rate, one replica). Back
# the volume up: it holds the budget and the bank key.
---
apiVersion: v1
kind: Namespace
metadata:
  name: actual
  labels:
    gateway-access: internal
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: actual
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: actual
spec:
  replicas: 1
  strategy:
    type: Recreate                # one writer on the SQLite files
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: actual
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actual
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000           # "node" in the image (it defaults to root)
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: actual
          image: ghcr.io/actualbudget/actual:26.10.0
          env:
            - { name: ACTUAL_DATA_DIR, value: /data }
            - { name: ACTUAL_LOGIN_METHOD, value: openid }
            - { name: ACTUAL_ALLOWED_LOGIN_METHODS, value: openid }
            - { name: ACTUAL_OPENID_ENFORCE, value: "true" }
            - { name: ACTUAL_OPENID_PROVIDER_NAME, value: Pocket-ID }
            - { name: ACTUAL_OPENID_DISCOVERY_URL, value: "https://auth.${DOMAIN}/.well-known/openid-configuration" }
            - { name: ACTUAL_OPENID_SERVER_HOSTNAME, value: "https://budget.int.${DOMAIN}" }
            - { name: ACTUAL_OPENID_CLIENT_SECRET_FILE, value: /secrets/client_secret }
            # Pocket-ID decides who gets in (admins); the first login becomes the owner.
            - { name: ACTUAL_USER_CREATION_MODE, value: login }
            - { name: ACTUAL_TOKEN_EXPIRATION, value: openid-provider }
          envFrom:
            - secretRef:
                name: actual-oidc-id   # ACTUAL_OPENID_CLIENT_ID
          ports:
            - { name: http, containerPort: 5006 }
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: secrets
          secret:
            secretName: actual-oidc
            items: [{ key: client_secret, path: client_secret }]
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: actual
  namespace: actual
spec:
  selector:
    app.kubernetes.io/name: actual
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual
  namespace: actual
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - budget.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: actual
          port: 80
