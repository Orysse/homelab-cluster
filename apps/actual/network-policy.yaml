# Actual: reached by Traefik only; reaches DNS, Pocket-ID (auth.${DOMAIN}, through the public
# address) and Enable Banking's API (bank sync).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: actual
  namespace: actual
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "5006", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toFQDNs:
        - matchName: auth.${DOMAIN}
        - matchName: api.enablebanking.com
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
