# Actual's Pocket-ID client, from OpenBao (only this namespace can read kv/apps/actual/*):
#   oidc  client_id client_secret   client "actual", written by hand in the OpenBao UI
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-oidc
  namespace: actual
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: actual-oidc }
  data:
    - secretKey: client_secret
      remoteRef: { key: actual/oidc, property: client_secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-oidc-id
  namespace: actual
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: actual-oidc-id }
  data:
    - secretKey: ACTUAL_OPENID_CLIENT_ID
      remoteRef: { key: actual/oidc, property: client_id }
