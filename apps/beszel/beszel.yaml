# Beszel's UI at beszel.int.${DOMAIN}. The hub is not in the cluster: it runs on the monitoring
# host (homelab-nix modules/host/beszel.nix, D35), so it still works when the cluster does not.
# Login: Pocket-ID through an oauth2-proxy (admins only, same image and settings as the Hubble
# one). The hub has one admin account; the route stamps its email on every request
# (X-Beszel-Email) and the hub trusts that header only from the k3s VMs (TRUSTED_PROXY_IPS),
# the one address its firewall lets in. So everyone Pocket-ID lets through is that admin. The
# route sets the header before the proxy and the proxy only lets authenticated requests on.
---
apiVersion: v1
kind: Namespace
metadata:
  name: beszel
  labels:
    gateway-access: internal
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-beszel-cookie
  namespace: beszel
spec:
  refreshInterval: "0"
  target:
    name: oauth2-proxy-beszel-cookie
    template:
      data:
        secret: "{{ .password | trunc 32 }}"    # 32 bytes: an AES-256 key
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: oauth2-proxy-beszel
  namespace: beszel
spec:
  callbackUrls: ["https://beszel.int.${DOMAIN}/oauth2/callback"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
  launchUrl: https://beszel.int.${DOMAIN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-beszel
  namespace: beszel
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-beszel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-beszel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.${DOMAIN}
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admins
            - --email-domain=*
            # Pocket-ID marks emails unverified; access is decided by the group, not the email.
            - --insecure-oidc-allow-unverified-email=true
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true             # behind the Gateway: trusts X-Forwarded-*
            - --upstream=http://${MONITORING_ADDRESS}:8090   # the hub, on the monitoring host
            - --redirect-url=https://beszel.int.${DOMAIN}/oauth2/callback
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-secret-file=/secrets/cookie/secret
            - --client-secret-file=/secrets/oidc/client_secret
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: oauth2-proxy-beszel-oidc-credentials, key: client_id }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: oidc, mountPath: /secrets/oidc, readOnly: true }
            - { name: cookie, mountPath: /secrets/cookie, readOnly: true }
      volumes:
        - name: oidc
          secret: { secretName: oauth2-proxy-beszel-oidc-credentials }
        - name: cookie
          secret: { secretName: oauth2-proxy-beszel-cookie }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-beszel
  namespace: beszel
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-beszel
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Reached through the internal Gateway; reaches DNS, Pocket-ID (auth.${DOMAIN}) and the hub.
# This namespace is exempt from no-lan-egress (network/policies/lan-egress.yaml) for the hub's address.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy-beszel
  namespace: beszel
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "4180", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toFQDNs:
        - matchName: auth.${DOMAIN}
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEntities: [ingress]             # the same, once Cilium hands the connection to Envoy
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toCIDR: ["${MONITORING_ADDRESS}/32"]
      toPorts: [{ ports: [{ port: "8090", protocol: TCP }] }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beszel
  namespace: beszel
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - beszel.int.${DOMAIN}
  rules:
    - filters:
        # Set, not added: a client's own X-Beszel-Email is overwritten.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - { name: X-Beszel-Email, value: "homelab@${DOMAIN}" }
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: oauth2-proxy-beszel
          port: 80
