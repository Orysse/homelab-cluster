# Pocket-ID in front of Kibana: an oauth2-proxy (same image and settings as in music/auth.yaml),
# admins and users. The Gateway routes to the proxy; the proxy is the only thing allowed to reach
# Kibana (network-policy.yaml). No path is skipped: shippers talk to Elasticsearch (elasticsearch.yaml).
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: oauth2-proxy-kibana
  namespace: elk
spec:
  callbackUrls: ["https://kibana.${DOMAIN}/oauth2/callback"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
    - { name: users, namespace: pocket-id }
  launchUrl: https://kibana.${DOMAIN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-kibana
  namespace: elk
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-kibana
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.${DOMAIN}
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admins
            - --allowed-group=users
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true             # behind the Gateway: trusts X-Forwarded-*
            - --upstream=http://kibana.elk.svc.cluster.local:5601
            - --redirect-url=https://kibana.${DOMAIN}/oauth2/callback
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-secret-file=/secrets/cookie/secret
            - --client-secret-file=/secrets/oidc/client_secret
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: oauth2-proxy-kibana-oidc-credentials, key: client_id }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: oidc, mountPath: /secrets/oidc, readOnly: true }
            - { name: cookie, mountPath: /secrets/cookie, readOnly: true }
      volumes:
        - name: oidc
          secret: { secretName: oauth2-proxy-kibana-oidc-credentials }
        - name: cookie
          secret: { secretName: oauth2-proxy-cookie }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-kibana
  namespace: elk
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-kibana
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: elk
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: kibana
  hostnames:
    - kibana.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: oauth2-proxy-kibana
          port: 80
