# Elasticsearch 9, one node, Basic license (security, API and roles are free in it). Plain HTTP
# inside the cluster: TLS ends at the Gateway. Image pinned to the release tag.
# The route elk.${DOMAIN} is the ingest endpoint for outside shippers (Filebeat, Fluent Bit,
# Vector, Logstash...): only `/` (their version check) and `/_bulk` pass; search, index and
# security APIs are not routed. They log in as `ingest` and write to `logs-*` (data streams or
# indices): a shipper must name its target, e.g. `logs-myhost-default`, and use `create` for a
# data stream. Data streams are deleted after 14 days (elk-setup); plain indices are not.
# shortcut: the container's root filesystem is writable (the image writes its keystore and logs
# under config/ and logs/), vm.max_map_count not checked (single-node skips that bootstrap check).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch
  namespace: elk
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: elk
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
          envFrom:
            - secretRef: { name: keys }      # ELASTIC_PASSWORD becomes the bootstrap password
          env:
            - { name: cluster.name, value: elk }
            - { name: discovery.type, value: single-node }
            - { name: ES_JAVA_OPTS, value: "-Xms768m -Xmx768m" }
            - { name: xpack.security.enabled, value: "true" }
            - { name: xpack.security.http.ssl.enabled, value: "false" }
            - { name: xpack.security.transport.ssl.enabled, value: "false" }
            - { name: xpack.ml.enabled, value: "false" }
            - { name: ingest.geoip.downloader.enabled, value: "false" }   # no Internet
          ports:
            - { name: http, containerPort: 9200 }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { cpu: "2", memory: 1536Mi }   # 768m heap + off-heap; the node has little room; a CPU cap, the node also runs k3s
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elk
spec:
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - { name: http, port: 9200, targetPort: http }
---
# Roles and users, through the API as `elastic`. Idempotent: PUT replaces. Cluster state lives in
# the data volume, so if the volume is ever recreated, delete this Job and Flux runs it again.
#   logs-writer  create/write on logs-* only (user `ingest`)
#   logs-reader  read on logs-* only; with kibana_admin it is what the Kibana visitors get
apiVersion: batch/v1
kind: Job
metadata:
  name: elk-setup
  namespace: elk
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled    # a Job's spec is immutable: recreate on change
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elk-setup
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6    # curl is in it, already pulled
          envFrom:
            - secretRef: { name: keys }
          command:
            - sh
            - -ec
            - |
              H=http://elasticsearch.elk.svc.cluster.local:9200
              c() { curl -fsS -u "elastic:$ELASTIC_PASSWORD" -H 'Content-Type: application/json' "$@"; echo; }
              until c "$H/_cluster/health?wait_for_status=yellow&timeout=30s" >/dev/null 2>&1; do sleep 5; done
              c -X PUT "$H/_security/role/logs-writer" -d '{"indices":[{"names":["logs-*"],"privileges":["create_doc","create_index","index","auto_configure"]}]}'
              c -X PUT "$H/_security/role/logs-reader" -d '{"indices":[{"names":["logs-*"],"privileges":["read","view_index_metadata"]}]}'
              c -X PUT "$H/_security/user/ingest" -d "{\"password\":\"$INGEST_PASSWORD\",\"roles\":[\"logs-writer\"]}"
              c -X PUT "$H/_security/user/kibana-users" -d "{\"password\":\"$KIBANA_USERS_PASSWORD\",\"roles\":[\"kibana_admin\",\"logs-reader\"]}"
              c -X POST "$H/_security/user/kibana_system/_password" -d "{\"password\":\"$KIBANA_SYSTEM_PASSWORD\"}"
              c -X PUT "$H/_cluster/settings" -d '{"persistent":{"data_streams.lifecycle.retention.default":"14d"}}'
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: elasticsearch
  namespace: elk
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: elk
  hostnames:
    - elk.${DOMAIN}
  rules:
    - matches:
        - path: { type: Exact, value: / }
        - path: { type: PathPrefix, value: /_bulk }
      backendRefs:
        - name: elasticsearch
          port: 9200
