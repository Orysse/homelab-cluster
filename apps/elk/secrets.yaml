# Passwords generated once, kept in OpenBao at kv/apps/elk/keys, never in git. An admin reads
# them there (bao.int.${DOMAIN}):
#   elastic        superuser: admin work by hand, and the setup Job
#   kibana_system  Kibana's own connection to Elasticsearch
#   kibana_users   the account every Kibana visitor lands on (kibana.yml, anonymous provider)
#   ingest         what the outside shippers use (user `ingest`, write-only on logs-*)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keys-generated
  namespace: elk
spec:
  refreshInterval: "0"
  target:
    name: keys-generated
  # Four independent draws from the generator, renamed so they do not collide.
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: password }
      rewrite: [{ regexp: { source: "password", target: "elastic" } }]
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: password }
      rewrite: [{ regexp: { source: "password", target: "kibana_system" } }]
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: password }
      rewrite: [{ regexp: { source: "password", target: "kibana_users" } }]
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: password }
      rewrite: [{ regexp: { source: "password", target: "ingest" } }]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keys
  namespace: elk
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists       # a new password would no longer match what Elasticsearch stores
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: keys-generated }
  data:
    - match:
        remoteRef: { remoteKey: elk/keys }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keys
  namespace: elk
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: keys
    template:
      data:
        ELASTIC_PASSWORD: "{{ .elastic }}"
        KIBANA_SYSTEM_PASSWORD: "{{ .kibana_system }}"
        KIBANA_USERS_PASSWORD: "{{ .kibana_users }}"
        INGEST_PASSWORD: "{{ .ingest }}"
  dataFrom:
    - extract: { key: elk/keys }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie
  namespace: elk
spec:
  refreshInterval: "0"
  target:
    name: oauth2-proxy-cookie
    template:
      data:
        secret: "{{ .password | trunc 32 }}"    # 32 bytes: an AES-256 key
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: ClusterGenerator, name: password }
