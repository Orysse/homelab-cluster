# Gatus configuration: https://github.com/TwiN/gatus#configuration
# Groups Plateforme, Observabilité and Sites are the ones the front page (Glance) shows; it reads
# this API, so a name here is what visitors see, and the hostname is the link they follow.
# Flux substitutes ${DOMAIN}; [STATUS] etc. are Gatus placeholders.
# Results are kept in memory: history resets when the pod restarts.
metrics: true
storage:
  type: memory
ui:
  title: ${DOMAIN} status
  header: ${DOMAIN}

endpoints:
  - name: abe.lc
    group: Sites
    url: https://${DOMAIN}
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 336h"   # cert-manager renews 30 days before expiry

  - name: Vitrine
    group: Sites
    url: https://vitrine.${DOMAIN}
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"

  - name: holive.fr
    group: Sites
    url: https://www.holive.fr
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
      - "[CERTIFICATE_EXPIRATION] > 336h"   # its own certificate (holive-tls)

  - name: Headscale
    group: Plateforme
    url: https://hs.${DOMAIN}/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"

  - name: holive.fr to www redirect
    group: Technique
    url: https://holive.fr
    interval: 5m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 301"

  - name: HTTP to HTTPS redirect
    group: Technique
    url: http://${DOMAIN}
    interval: 5m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 301"

  - name: DNS
    group: Technique
    url: 1.1.1.1
    interval: 5m
    dns:
      query-name: ${DOMAIN}
      query-type: A
    conditions:
      - "[DNS_RCODE] == NOERROR"

  - name: Traefik
    group: Observabilité
    url: https://traefik.int.${DOMAIN}/dashboard/
    interval: 5m
    conditions:
      - "[STATUS] == any(200, 302)"   # 302: Pocket-ID login (oauth2-proxy)

  - name: Glance
    group: Observabilité
    url: https://home.int.${DOMAIN}/api/healthz
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: Pocket-ID
    group: Plateforme
    url: https://auth.${DOMAIN}/healthz
    interval: 1m
    conditions:
      - "[STATUS] == 204"   # Pocket-ID answers 204 No Content

  - name: Headlamp
    group: Plateforme
    url: https://k8s.${DOMAIN}/
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: Umami
    group: Technique
    url: https://pulse.${DOMAIN}/script.js
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  # Internal tools, checked through the internal gateway like Traefik. A login redirect counts as up.
  - name: OpenBao
    group: Plateforme
    url: https://bao.int.${DOMAIN}/
    interval: 5m
    conditions:
      - "[STATUS] < 400"

  - name: Headplane
    group: Plateforme
    url: https://headplane.int.${DOMAIN}/admin/healthz
    interval: 5m
    conditions:
      - "[STATUS] < 400"

  - name: Grafana
    group: Observabilité
    url: https://grafana.int.${DOMAIN}/api/health
    interval: 5m
    conditions:
      - "[STATUS] < 400"

  - name: Hubble
    group: Observabilité
    url: https://hubble.int.${DOMAIN}/
    interval: 5m
    conditions:
      - "[STATUS] < 400"

  - name: Open WebUI
    group: Observabilité
    url: https://chat.int.${DOMAIN}/health
    interval: 5m
    conditions:
      - "[STATUS] < 400"
