apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - gatus.yaml
configMapGenerator:
  - name: gatus-config
    namespace: gatus
    files:
      - config.yaml
# app.kubernetes.io/version = the image tag (follows Renovate bumps).
replacements:
  - source:
      kind: Deployment
      name: gatus
      fieldPath: spec.template.spec.containers.[name=gatus].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: gatus }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
