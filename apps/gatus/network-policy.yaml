# Gatus checks the sites from outside (public IP, through the box) and the internal ones
# through Traefik; it is reached by Traefik and scraped by Alloy.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus
  namespace: gatus
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: alloy }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
  egress:
    # Cluster DNS (names visible in Hubble).
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "80", protocol: TCP }, { port: "443", protocol: TCP }]
        - ports: [{ port: "53", protocol: UDP }]       # DNS check against 1.1.1.1
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "8443", protocol: TCP }, { port: "9443", protocol: TCP }] }]
