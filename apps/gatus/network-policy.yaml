# Gatus checks the sites from outside (public IP, through the box) and the internal ones
# through the internal Gateway; it is reached by the Gateway, Glance (state) and the
# metrics collector.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus
  namespace: gatus
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]          # the Gateway (status.${DOMAIN})
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: otel-collector }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: glance, app.kubernetes.io/name: glance }   # the front page reads the state
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
  egress:
    # Cluster DNS (names visible in Hubble).
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "80", protocol: TCP }, { port: "443", protocol: TCP }]
        - ports: [{ port: "53", protocol: UDP }]       # DNS check against 1.1.1.1
    # The Gateways (status checks of every site): Cilium hands the connection to Envoy.
    - toEntities: [ingress]
      toPorts: [{ ports: [{ port: "80", protocol: TCP }, { port: "443", protocol: TCP }] }]
