apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - glance.yaml
# A new name (hash suffix) on every change: the pod restarts with it.
configMapGenerator:
  - name: glance-config
    namespace: glance
    files:
      - config/glance.yml
  - name: glance-assets
    namespace: glance
    files:
      - assets/user.css
      - assets/favicon.svg
      - assets/hanken-400.woff2
      - assets/hanken-800.woff2
      - assets/plex-mono-400.woff2
      - assets/plex-mono-500.woff2
# app.kubernetes.io/version = the image tag (follows Renovate bumps).
replacements:
  - source:
      kind: Deployment
      name: glance
      fieldPath: spec.template.spec.containers.[name=glance].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: glance }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
