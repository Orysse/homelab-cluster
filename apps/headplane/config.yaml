server:
  host: 0.0.0.0
  port: 3000
  base_url: https://headplane.int.${DOMAIN}
  cookie_secret_path: /etc/headplane/secrets/cookie_secret
  cookie_secure: true
  data_path: /var/lib/headplane
headscale:
  url: http://headscale.headscale.svc.cluster.local   # Service port 80
  public_url: https://hs.${DOMAIN}
  api_key_path: /etc/headplane/secrets/headscale_api_key
  # No config_path: Headscale's config lives in its own namespace, so the DNS and settings pages stay off.
oidc:
  enabled: true
  issuer: https://auth.${DOMAIN}
  # client_id: HEADPLANE_OIDC__CLIENT_ID (headplane-env)
  client_secret_path: /etc/headplane/secrets/oidc_client_secret
  use_pkce: true
  disable_api_key_login: false     # break-glass when Pocket-ID is down
  scope: openid email profile
  default_role: viewer
