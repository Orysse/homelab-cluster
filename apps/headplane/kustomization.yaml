apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - headplane.yaml
  - secrets.yaml
# A new name (hash suffix) on every change: the pod restarts with it.
configMapGenerator:
  - name: headplane
    namespace: headplane
    files:
      - config.yaml
# app.kubernetes.io/version = the image tag (follows Renovate bumps).
replacements:
  - source:
      kind: Deployment
      name: headplane
      fieldPath: spec.template.spec.containers.[name=headplane].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: headplane }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
