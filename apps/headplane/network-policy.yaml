# Headplane: reached by Traefik only; reaches DNS, Headscale's API (headscale namespace) and
# Pocket-ID (auth.${DOMAIN}, through the public address).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headplane
  namespace: headplane
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "3000", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: headscale, app.kubernetes.io/name: headscale }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    - toFQDNs:
        - matchName: auth.${DOMAIN}
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
