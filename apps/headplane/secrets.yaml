# Headplane's secrets, from OpenBao (only this namespace can read kv/apps/headplane/*):
#   cookie  secret                       session key (exactly 32 characters), generated by
#                                        vault-config-operator
#   oidc    client_id client_secret      Pocket-ID client "headplane", written by hand
#   headscale  api_key                   written by hand:
#     kubectl -n headscale exec deploy/headscale -- headscale apikeys create --expiration 90d
#     (expires: renew and rewrite it; the key is only read when the pod starts or the Secret refreshes)
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: cookie
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/headplane
  isKVSecretsEngineV2: true
  secretKey: secret
  kvSecretRetainPolicy: Retain
  secretFormat:
    inlinePasswordPolicy: |
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
# Environment: Headplane reads any setting from HEADPLANE_<SECTION>__<KEY>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headplane-env
  namespace: headplane
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: headplane-env
    template:
      engineVersion: v2
      data:
        HEADPLANE_OIDC__CLIENT_ID: "{{ .client_id }}"
  data:
    - secretKey: client_id
      remoteRef: { key: headplane/oidc, property: client_id }
---
# Files: Headplane reads these three from paths (config.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headplane-files
  namespace: headplane
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: headplane-files
    template:
      engineVersion: v2
      data:
        cookie_secret: "{{ .cookie }}"
        oidc_client_secret: "{{ .client_secret }}"
        headscale_api_key: "{{ .api_key }}"
  data:
    - secretKey: cookie
      remoteRef: { key: headplane/cookie, property: secret }   # RandomSecret above (path + its name)
    - secretKey: client_secret
      remoteRef: { key: headplane/oidc, property: client_secret }
    - secretKey: api_key
      remoteRef: { key: headplane/headscale, property: api_key }
