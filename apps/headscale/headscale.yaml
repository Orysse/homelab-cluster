# Headscale at hs.${DOMAIN}: self-hosted Tailscale control server, the everyday VPN.
#   login    Pocket-ID, groups "admins" (the homelab) and "visitors" (read-only views, policy.json)
#   entry    TLS passthrough on the public Gateway (TLSRoute), own certificate: the Tailscale
#            control protocol (/ts2021) upgrades the connection to a Noise stream, which
#            Cilium's Envoy refuses on HTTP routes (websocket upgrades only)
#   relays   Tailscale's public DERP servers (traffic stays end-to-end WireGuard-encrypted);
#            clients connect directly when they can (router UDP 41641 -> the subnet router)
#   routes   the subnet router is Tailscale on the database host (homelab-nix: tailscale.nix),
#            not a pod: the route to the homelab does not depend on the cluster
# State (nodes, keys, users) in PostgreSQL on the database host; the Noise key from OpenBao.
# When the cluster is down, connected devices keep their tunnels but nothing new can log in:
# the admin's laptop keeps WireGuard (wg0, homelab-nix) for that.
# CLI: kubectl -n headscale exec deploy/headscale -- headscale nodes list
---
apiVersion: v1
kind: Namespace
metadata:
  name: headscale
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: headscale
automountServiceAccountToken: false
---
# Served by Headscale itself (passthrough). It reads the certificate at start: after a
# renewal (every ~60 days), kubectl -n headscale rollout restart deploy/headscale.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-tls
  namespace: headscale
spec:
  secretName: headscale-tls
  dnsNames:
    - hs.${DOMAIN}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  strategy:
    type: Recreate                # one control server at a time
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: headscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headscale
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headscale
          image: docker.io/headscale/headscale:v0.29.5
          args: [serve]
          env:   # Headscale reads any setting from HEADSCALE_<SECTION>_<KEY>
            - name: HEADSCALE_DATABASE_POSTGRES_USER
              valueFrom: { secretKeyRef: { name: headscale-db, key: username } }
            - name: HEADSCALE_DATABASE_POSTGRES_PASS
              valueFrom: { secretKeyRef: { name: headscale-db, key: password } }
            - name: HEADSCALE_OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: headscale-oidc, key: client_id } }
          ports:
            - { name: https, containerPort: 8443 }
            - { name: metrics, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /health, port: https, scheme: HTTPS }
          livenessProbe:
            httpGet: { path: /health, port: https, scheme: HTTPS }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/headscale/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: config, mountPath: /etc/headscale/policy.json, subPath: policy.json, readOnly: true }
            - { name: secrets, mountPath: /etc/headscale/secrets, readOnly: true }
            - { name: tls, mountPath: /etc/headscale/tls, readOnly: true }
            - { name: run, mountPath: /var/run/headscale }   # CLI socket
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: headscale
        - name: secrets
          projected:
            sources:
              - secret: { name: noise }
              - secret:
                  name: headscale-oidc
                  items: [{ key: client_secret, path: oidc_client_secret }]
        - name: tls
          secret:
            secretName: headscale-tls
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
spec:
  selector:
    app.kubernetes.io/name: headscale
  ports:
    - { name: https, port: 443, targetPort: https }
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: headscale
  namespace: headscale
spec:
  parentRefs:
    - { name: public, namespace: gateway, sectionName: headscale }
  hostnames:
    - hs.${DOMAIN}
  rules:
    - backendRefs:
        - name: headscale
          port: 443
