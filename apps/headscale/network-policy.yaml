# Headscale: reached through the public Gateway (clients, hs.${DOMAIN}) and by the metrics
# collector; reaches DNS, its PostgreSQL, Pocket-ID (auth.${DOMAIN}, through the public
# Gateway) and Tailscale's DERP map.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headscale
  namespace: headscale
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]          # the Gateway (Cilium's Envoy)
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: otel-collector }
      toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: postgres, cnpg.io/cluster: main }
      toPorts: [{ ports: [{ port: "5432", protocol: TCP }] }]
    - toFQDNs:
        - matchName: auth.${DOMAIN}
        - matchName: controlplane.tailscale.com
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEntities: [ingress]            # auth.${DOMAIN}, once Cilium hands it to Envoy
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
