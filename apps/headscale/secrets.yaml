# Headscale's secrets, from OpenBao (only this namespace can read kv/apps/headscale/*):
#   noise  key                     the control server's identity (Noise protocol): clients
#                                  pin it, so it must survive restarts. Generated here by
#                                  vault-config-operator, never seen by anyone
#   oidc   client_id client_secret Pocket-ID client "headscale", written by hand in the
#                                  OpenBao UI
# and its PostgreSQL credentials (static role "headscale", openbao/database.yaml).
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: noise
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/headscale
  isKVSecretsEngineV2: true
  secretKey: key
  kvSecretRetainPolicy: Retain    # a new key disconnects every client until it logs in again
  secretFormat:
    # 32 random bytes in hex: a Curve25519 private key (clamped when used).
    inlinePasswordPolicy: |
      length = 64
      rule "charset" {
        charset = "0123456789abcdef"
        min-chars = 1
      }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres
  namespace: headscale
spec:
  method: GET
  path: database/postgres/static-creds/headscale
  provider:
    server: http://openbao.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: namespace-secrets
        serviceAccountRef:
          name: default
---
# Environment: Headscale reads any setting from HEADSCALE_<SECTION>_<KEY>.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-env
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: headscale-env
    template:
      engineVersion: v2
      data:
        HEADSCALE_DATABASE_POSTGRES_USER: "{{ .username }}"
        HEADSCALE_DATABASE_POSTGRES_PASS: "{{ .password }}"
        HEADSCALE_OIDC_CLIENT_ID: "{{ .client_id }}"
  data:
    - secretKey: client_id
      remoteRef: { key: headscale/oidc, property: client_id }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
---
# Files: Headscale reads these two from paths (config.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-files
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: headscale-files
    template:
      engineVersion: v2
      data:
        noise_private.key: "privkey:{{ .noise }}"
        oidc_client_secret: "{{ .client_secret }}"
  data:
    - secretKey: noise
      remoteRef: { key: headscale/noise, property: key }   # RandomSecret above (path + its name)
    - secretKey: client_secret
      remoteRef: { key: headscale/oidc, property: client_secret }
