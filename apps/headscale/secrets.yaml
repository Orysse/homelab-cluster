# Headscale's secrets:
#   noise   the control server's identity (Noise protocol): clients pin it, so it must
#           survive restarts and rebuilds. Generated once, kept in OpenBao at
#           kv/apps/headscale/noise (key: 64 hex characters), never seen by anyone
#   oidc    its Pocket-ID client, written next to it by the Pocket-ID operator
#   db      its PostgreSQL credentials, kv/apps/headscale/db (postgres/databases/headscale.yaml)
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headscale
  namespace: headscale
spec:
  callbackUrls: ["https://hs.${DOMAIN}/oidc/callback"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
    - { name: visitors, namespace: pocket-id }
  secret:
    name: headscale-oidc
---
# A 32-byte Curve25519 private key in hex: the SHA-256 of a random password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: noise-generated
  namespace: headscale
spec:
  refreshInterval: "0"
  target:
    name: noise-generated
    template:
      data:
        key: "{{ .password | sha256sum }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: noise
  namespace: headscale
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists       # a new key disconnects every client until it logs in again
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: noise-generated }
  data:
    - match:
        remoteRef: { remoteKey: headscale/noise }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: noise
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: noise
    template:
      data:
        noise_private.key: "privkey:{{ .key }}"
  data:
    - secretKey: key
      remoteRef: { key: headscale/noise, property: key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-db
  namespace: headscale
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: headscale-db }
  dataFrom:
    - extract: { key: headscale/db }
