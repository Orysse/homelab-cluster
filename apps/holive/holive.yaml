# holive.fr: Olivier Chartier's portfolio (static site, repository Orysse/holive, private;
# the image on ghcr.io is public). Each vX.Y.Z tag pushes ghcr.io/orysse/holive:X.Y.Z;
# Renovate bumps the version. Served at www.holive.fr; holive.fr redirects there.
# Certificate and listeners: infrastructure/configs (certificate.yaml, gateway.yaml).
---
apiVersion: v1
kind: Namespace
metadata:
  name: holive
  labels:
    gateway-access: public
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holive
  namespace: holive
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: holive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: holive
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/orysse/holive:0.1.1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: holive
---
apiVersion: v1
kind: Service
metadata:
  name: holive
  namespace: holive
spec:
  selector:
    app.kubernetes.io/name: holive
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: holive
  namespace: holive
spec:
  parentRefs:
    - name: public
      namespace: kube-system
      sectionName: holive-www
  hostnames:
    - www.holive.fr
  rules:
    - backendRefs:
        - name: holive
          port: 80
---
# holive.fr -> www.holive.fr (same path).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: holive-apex
  namespace: holive
spec:
  parentRefs:
    - name: public
      namespace: kube-system
      sectionName: holive
  hostnames:
    - holive.fr
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: www.holive.fr
            statusCode: 301
