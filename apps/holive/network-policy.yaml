# Static site: reached only by Traefik, reaches nothing (not even DNS). Kubelet probes
# (host) are always allowed by Cilium.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: holive
  namespace: holive
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  egress: [{}]                 # no egress rule = Cilium would not deny; an empty rule allows nothing
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
