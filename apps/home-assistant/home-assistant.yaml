# Home Assistant's UI at ha.int.${DOMAIN}. Home Assistant itself is not in the cluster: it is
# a LAN guest of nuc1 (homelab-nix D34, container `home`, 192.168.1.221), as it needs mDNS
# and the LAN. Here: the route (a Service without selector, its endpoint written by hand)
# and its Pocket-ID client. The client is public with PKCE (auth_oidc needs no secret) and
# its ID is fixed, so homelab-nix names it without a round trip.
---
apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    gateway-access: internal
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  clientID: home-assistant   # homelab-nix topology guests.home, auth_oidc.client_id
  isPublic: true
  pkceEnabled: true
  callbackUrls: ["https://ha.int.${DOMAIN}/auth/oidc/callback"]
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
  launchUrl: https://ha.int.${DOMAIN}
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  ports:
    - { name: http, port: 80, targetPort: 8123 }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    kubernetes.io/service-name: home-assistant
addressType: IPv4
ports:
  - { name: http, port: 8123, protocol: TCP }
endpoints:
  - addresses: ["192.168.1.221"]   # homelab-nix topology guests.home.address
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - ha.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: home-assistant
          port: 80
