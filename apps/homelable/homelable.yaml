# Homelable: map and live status of the homelab, with a network scanner.
#   homelable.int.${DOMAIN}   LAN/VPN only. Login through Pocket-ID (OIDC client "homelable"):
#                             Homelable has no user list, so the client must be limited to a
#                             group in Pocket-ID.
# One pod, two containers: the nginx frontend proxies /api to the backend on localhost.
# Data (SQLite + uploads) on the NFS StorageClass. The pod network is NATed, so the scanner
# sees no MAC addresses (ARP does not cross the node).
---
apiVersion: v1
kind: Namespace
metadata:
  name: homelable
  labels:
    gateway-access: internal
    # privileged, not restricted: baseline refuses NET_RAW. The backend runs as root with it (ping, nmap) and the
    # nginx image starts as root.
    pod-security.kubernetes.io/enforce: privileged
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: homelable
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelable-data
  namespace: homelable
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable
  namespace: homelable
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate                # SQLite: one writer at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: homelable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelable
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/pouzor/homelable-backend:3.6.0
          envFrom:
            - secretRef:
                name: homelable    # SECRET_KEY, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET (from OpenBao)
          env:
            - { name: SQLITE_PATH, value: /app/data/homelab.db }
            - { name: AUTH_MODE, value: oidc }
            - { name: CORS_ORIGINS, value: '["https://homelable.int.${DOMAIN}"]' }
            - { name: SCANNER_RANGES, value: '["192.168.1.0/24"]' }
            - { name: OIDC_DISCOVERY_URL, value: "https://auth.${DOMAIN}/.well-known/openid-configuration" }
            - { name: OIDC_REDIRECT_URI, value: "https://homelable.int.${DOMAIN}/api/v1/auth/oidc/callback" }
            - { name: OIDC_SCOPES, value: "openid profile email" }
            - { name: OIDC_COOKIE_SECURE, value: "true" }
          ports:
            - { name: api, containerPort: 8000 }
          startupProbe:
            tcpSocket: { port: api }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: api }
          livenessProbe:
            tcpSocket: { port: api }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 256Mi }
            limits: { memory: 768Mi }   # OOMKilled at 384Mi: one nmap per host during a scan
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]    # ping and nmap raw sockets
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
        - name: frontend
          image: ghcr.io/pouzor/homelable-frontend:3.6.0
          env:
            - { name: BACKEND_UPSTREAM, value: "127.0.0.1:8000" }
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]   # nginx master, port 80
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelable-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homelable
  namespace: homelable
spec:
  selector:
    app.kubernetes.io/name: homelable
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homelable
  namespace: homelable
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - homelable.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: homelable
          port: 80
