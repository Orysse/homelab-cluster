# Homelable: reached by Traefik only; reaches DNS, Pocket-ID (auth.${DOMAIN}, through the
# public address) and the LAN it scans.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homelable
  namespace: homelable
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "80", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    # The scanner and the status checks: any port, ping included.
    - toCIDR: ["192.168.1.0/24"]
