# Homelable's secrets, from OpenBao (only this namespace can read kv/apps/homelable/*):
#   homelable-app  SECRET_KEY, generated by vault-config-operator
#   oidc           client_id and client_secret of the Pocket-ID client "homelable",
#                  written by hand at kv/apps/homelable/oidc
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: homelable-app
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/homelable
  isKVSecretsEngineV2: true
  secretKey: secret
  kvSecretRetainPolicy: Retain
  secretFormat:
    inlinePasswordPolicy: |
      length = 48
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelable
  namespace: homelable
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: homelable
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret }}"
        OIDC_CLIENT_ID: "{{ .client_id }}"
        OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  data:
    - secretKey: secret
      remoteRef: { key: homelable/homelable-app, property: secret }   # RandomSecret above (path + its name)
    - secretKey: client_id
      remoteRef: { key: homelable/oidc, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: homelable/oidc, property: client_secret }
