# siteMonitor: Homepage requests the URL itself (green dot = it answered). The public sites
# through the box like any visitor, the *.int ones through the internal gateway.
- Plateforme:
    - Pocket-ID:
        icon: pocket-id.png
        href: https://auth.${DOMAIN}
        description: Identité, passkeys, OIDC
        siteMonitor: https://auth.${DOMAIN}/healthz
    - Headlamp:
        icon: headlamp.png
        href: https://k8s.${DOMAIN}
        description: Console Kubernetes
        siteMonitor: https://k8s.${DOMAIN}
    - OpenBao:
        icon: openbao.png
        href: https://bao.int.${DOMAIN}
        description: Secrets des apps
        siteMonitor: https://bao.int.${DOMAIN}/v1/sys/health
    - Headscale:
        icon: headscale.png
        href: https://hs.${DOMAIN}/apple
        description: VPN (Tailscale), login Pocket-ID
        siteMonitor: https://hs.${DOMAIN}/health
- Observabilité:
    - Grafana:
        icon: grafana.png
        href: https://grafana.int.${DOMAIN}
        description: Métriques et logs (VictoriaMetrics, VictoriaLogs)
        siteMonitor: https://grafana.int.${DOMAIN}/api/health
    - Hubble:
        icon: cilium.png
        href: https://hubble.int.${DOMAIN}
        description: Flux réseau entre les pods (Cilium)
        siteMonitor: https://hubble.int.${DOMAIN}
    - Traefik:
        icon: traefik.png
        href: https://traefik.int.${DOMAIN}/dashboard/
        description: Routes HTTP, CrowdSec en entrée
        siteMonitor: https://traefik.int.${DOMAIN}/dashboard/
    - Gatus:
        icon: gatus.png
        href: https://status.${DOMAIN}
        description: Checks vus de l'extérieur
        widget:
          type: gatus
          url: http://gatus.gatus.svc.cluster.local
- Sites:
    - abe.lc:
        icon: mdi-web
        href: https://${DOMAIN}
        siteMonitor: https://${DOMAIN}
    - Vitrine:
        icon: mdi-storefront-outline
        href: https://vitrine.${DOMAIN}
        siteMonitor: https://vitrine.${DOMAIN}
    - holive.fr:
        icon: mdi-camera-outline
        href: https://www.holive.fr
        description: Portfolio, Umami
        siteMonitor: https://www.holive.fr
# Live numbers, straight from VictoriaMetrics on the monitoring host (the same as Grafana's
# "Coût et conso" and "Vulnérabilités" dashboards). Power at the wall = RAPL psys / 0.85.
- En direct:
    - nuc1:
        icon: mdi-server
        href: https://grafana.int.${DOMAIN}/d/homelab-cost
        description: Conso et coût (estimation)
        widget:
          type: prometheusmetric
          url: http://${MONITORING_ADDRESS}:8428
          refreshInterval: 30000
          metrics:
            - label: Puissance
              query: rate(node_rapl_psys_joules_total{host="nuc1"}[5m]) / 0.85
              format: { type: number, suffix: " W", options: { maximumFractionDigits: 0 } }
            - label: Élec / mois
              query: avg_over_time((rate(node_rapl_psys_joules_total{host="nuc1"}[5m]))[7d:5m]) / 0.85 / 1000 * 730 * 0.2001
              format: { type: number, suffix: " €", options: { maximumFractionDigits: 2 } }
            - label: Uptime
              query: time() - node_boot_time_seconds{job="node", host="nuc1"}
              format: { type: duration }
    - Cluster:
        icon: kubernetes.png
        href: https://grafana.int.${DOMAIN}/d/homelab-vulnerabilities
        description: Pods, alertes, CVE
        widget:
          type: prometheusmetric
          url: http://${MONITORING_ADDRESS}:8428
          refreshInterval: 30000
          metrics:
            - label: Pods
              query: sum(kube_pod_status_phase{phase="Running"})
              format: { type: number }
            - label: Alertes
              query: count(ALERTS_FOR_STATE{alertname!="Watchdog"}) or vector(0)
              format: { type: number }
            - label: CVE critiques
              query: sum(max by (image) (trivy_image_vulnerabilities_fixable{severity="CRITICAL"}))
              format: { type: number }
# Security and infrastructure news (fetched by Homepage, cached 10 minutes).
- Veille:
    - CERT-FR:
        icon: mdi-shield-alert-outline
        href: https://www.cert.ssi.gouv.fr
        widget: { type: feed, url: "https://www.cert.ssi.gouv.fr/alerte/feed/", maxItems: 5, images: false }
    - The Hacker News:
        icon: mdi-incognito
        href: https://thehackernews.com
        widget: { type: feed, url: "https://feeds.feedburner.com/TheHackersNews", maxItems: 5, images: false }
    - Kubernetes:
        icon: kubernetes.png
        href: https://kubernetes.io/blog/
        widget: { type: feed, url: "https://kubernetes.io/feed.xml", maxItems: 5, images: false }
    - selfh.st:
        icon: mdi-home-group
        href: https://selfh.st
        widget: { type: feed, url: "https://selfh.st/rss/", maxItems: 5, images: false }
