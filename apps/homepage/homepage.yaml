# Homepage at home.int.${DOMAIN}: the homelab's front page (LAN/VPN, so visitors on
# Tailscale see it too). Every service with its status, cluster and node usage from the API
# server (metrics-server). Configuration: config/ (configMapGenerator, kustomization.yaml).
---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  labels:
    gateway-access: internal
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
# Read-only, and only what the cluster and node widgets need.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.5.0
          env:
            - { name: HOMEPAGE_ALLOWED_HOSTS, value: "home.int.${DOMAIN}" }
          ports:
            - { name: http, containerPort: 3000 }
          # It answers 400 to any Host not in HOMEPAGE_ALLOWED_HOSTS, the probes included.
          readinessProbe:
            httpGet: { path: /api/healthcheck, port: http, httpHeaders: [{ name: Host, value: "home.int.${DOMAIN}" }] }
          livenessProbe:
            httpGet: { path: /api/healthcheck, port: http, httpHeaders: [{ name: Host, value: "home.int.${DOMAIN}" }] }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Writable: Homepage adds its default files (custom.css...) and logs/ next to ours.
            - { name: config-dir, mountPath: /app/config }
            - { name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml }
            - { name: config, mountPath: /app/config/services.yaml, subPath: services.yaml }
            - { name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml }
            - { name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
            - { name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml }
            - { name: config, mountPath: /app/config/custom.css, subPath: custom.css }
            - { name: cache, mountPath: /app/.next/cache }
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: config-dir
          emptyDir:
            sizeLimit: 32Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - home.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: homepage
          port: 80
