apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - homepage.yaml
# A new name (hash suffix) on every change: the pod restarts with it.
configMapGenerator:
  - name: homepage
    namespace: homepage
    files:
      - config/settings.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/kubernetes.yaml
      - config/bookmarks.yaml
# app.kubernetes.io/version = the image tag (follows Renovate bumps).
replacements:
  - source:
      kind: Deployment
      name: homepage
      fieldPath: spec.template.spec.containers.[name=homepage].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: homepage }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
