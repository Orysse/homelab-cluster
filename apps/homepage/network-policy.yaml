# Homepage: reached by Traefik only; reaches DNS, the API server (cluster and node usage),
# VictoriaMetrics (live numbers), news feeds (HTTPS),
# Gatus, and every site it monitors: public ones through the box like a visitor, *.int
# ones through the internal gateway.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage
  namespace: homepage
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "3000", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: gatus, app.kubernetes.io/name: gatus }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    # VictoriaMetrics on the monitoring host ("En direct" widgets).
    - toCIDR: ["${MONITORING_ADDRESS}/32"]
      toPorts: [{ ports: [{ port: "8428", protocol: TCP }] }]
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "8443", protocol: TCP }, { port: "9443", protocol: TCP }] }]
