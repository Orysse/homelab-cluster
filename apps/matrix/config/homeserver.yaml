# Synapse. Secrets (database password, OIDC client) are in a second file, secrets.yaml,
# built by External Secrets (secrets.yaml next to matrix.yaml). Synapse merges both.
server_name: "${DOMAIN}"                 # user IDs: @abel:abe.lc
public_baseurl: "https://matrix.${DOMAIN}/"
serve_server_wellknown: false            # abe.lc/.well-known/matrix/* is served by apps/site
pid_file: /tmp/homeserver.pid
listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true                    # behind Traefik
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client, federation]
        compress: false
  - port: 9000
    type: metrics
    bind_addresses: ["0.0.0.0"]
enable_metrics: true
log_config: /config/log.yaml
report_stats: false

# State on the NFS volume: signing key (federation identity, generated at first start) and
# uploaded media. Everything else is in PostgreSQL.
signing_key_path: /data/signing.key
media_store_path: /data/media_store
max_upload_size: 50M
media_retention:
  remote_media_lifetime: 30d             # other servers' media is re-fetched when needed
trusted_key_servers:
  - server_name: matrix.org
suppress_key_server_warning: true

# Accounts: the owner only, through Pocket-ID (secrets.yaml). Friends keep their own server
# and join rooms over federation.
enable_registration: false
password_config:
  enabled: false
user_directory:
  search_all_users: false
presence:
  enabled: false                         # costly over federation, little use here
url_preview_enabled: false               # would fetch arbitrary URLs from inside the cluster
