apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - matrix.yaml
  - secrets.yaml
# A new name (hash suffix) on every change: the pod restarts with it.
configMapGenerator:
  - name: synapse
    namespace: matrix
    files:
      - config/homeserver.yaml
      - config/log.yaml
# app.kubernetes.io/version = the image tag (follows Renovate bumps).
replacements:
  - source:
      kind: Deployment
      name: synapse
      fieldPath: spec.template.spec.containers.[name=synapse].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: synapse }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
