# Matrix homeserver (Synapse) for ${DOMAIN}: user IDs @<name>:${DOMAIN}, served at
# matrix.${DOMAIN} (delegation: apps/site serves ${DOMAIN}/.well-known/matrix/*).
#   accounts    the owner only, Pocket-ID login (group admins). Friends stay on their own
#               servers and join rooms over federation.
#   clients     Element Web/Desktop, Element Classic, FluffyChat, Cinny... (not Element X:
#               it needs Matrix Authentication Service for SSO)
#   state       PostgreSQL "matrix" on the database host (C collation); signing key and
#               media on the NFS volume
#   public      only /_matrix (client + federation) and /_synapse/client (SSO pages); the
#               admin API is not routed
---
apiVersion: v1
kind: Namespace
metadata:
  name: matrix
  labels:
    gateway-access: public
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
spec:
  replicas: 1
  strategy:
    type: Recreate                # one Synapse on the database at a time
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /_synapse/metrics
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Creates the signing key on the volume if it is missing, then exits.
        - name: keys
          image: ghcr.io/element-hq/synapse:v1.162.0
          command: [python, -m, synapse.app.homeserver, --config-path, /config/homeserver.yaml,
            --config-path, /secrets/secrets.yaml, --generate-keys]
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts: &mounts
            - { name: config, mountPath: /config, readOnly: true }
            - { name: secrets, mountPath: /secrets, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:v1.162.0
          command: [python, -m, synapse.app.homeserver, --config-path, /config/homeserver.yaml,
            --config-path, /secrets/secrets.yaml]
          ports:
            - { name: http, containerPort: 8008 }
            - { name: metrics, containerPort: 9000 }
          startupProbe:               # first start runs the database migrations
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          # Joining a big room over federation keeps the (single-threaded) main loop busy for
          # minutes: /health answers late. A restart would only start the join over again.
          readinessProbe:
            httpGet: { path: /health, port: http }
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 20     # 10 minutes unresponsive before a restart
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 1Gi }
          securityContext: *container-security
          volumeMounts: *mounts
      volumes:
        - name: config
          configMap:
            name: synapse
        - name: secrets
          secret:
            secretName: synapse
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: synapse
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
  namespace: matrix
spec:
  parentRefs:
    - name: public
      namespace: kube-system
      sectionName: https
  hostnames:
    - matrix.${DOMAIN}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /_matrix }
        - path: { type: PathPrefix, value: /_synapse/client }
      backendRefs:
        - name: synapse
          port: 80
