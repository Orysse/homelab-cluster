# Synapse: reached by Traefik (clients and other servers) and Alloy (metrics); reaches DNS,
# its PostgreSQL, and the world on 443 and 8448: other homeservers (federation), matrix.org
# (key server), Pocket-ID (auth.${DOMAIN}, through the public address).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: synapse
  namespace: matrix
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "8008", protocol: TCP }] }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: alloy }
      toPorts: [{ ports: [{ port: "9000", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toCIDR: ["${DATABASE_ADDRESS}/32"]
      toPorts: [{ ports: [{ port: "5432", protocol: TCP }] }]
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }, { port: "8448", protocol: TCP }] }]
