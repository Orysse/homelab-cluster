# Synapse's secrets, from OpenBao (only this namespace can read kv/apps/matrix/*):
#   oidc  client_id client_secret   Pocket-ID client "matrix", written by hand in the UI
# and its PostgreSQL credentials (static role "matrix", openbao/database.yaml). Synapse
# reads them as a second config file; the "{{ "{{ ... }}" }}" are Synapse's own templates.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres
  namespace: matrix
spec:
  method: GET
  path: database/postgres/static-creds/matrix
  provider:
    server: http://openbao.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: namespace-secrets
        serviceAccountRef:
          name: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: synapse
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          database:
            name: psycopg2
            args:
              user: "{{ .username }}"
              password: "{{ .password }}"
              dbname: matrix
              host: ${DATABASE_ADDRESS}
              port: 5432
              cp_min: 2
              cp_max: 5
          oidc_providers:
            - idp_id: pocketid
              idp_name: Pocket-ID
              issuer: "https://auth.${DOMAIN}"
              client_id: "{{ .client_id }}"
              client_secret: "{{ .client_secret }}"
              scopes: [openid, profile, email, groups]
              pkce_method: always
              attribute_requirements:
                - { attribute: groups, value: admins }
              user_mapping_provider:
                config:
                  localpart_template: '{{ "{{ user.preferred_username }}" }}'
                  display_name_template: '{{ "{{ user.name }}" }}'
  data:
    - secretKey: client_id
      remoteRef: { key: matrix/oidc, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: matrix/oidc, property: client_secret }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
