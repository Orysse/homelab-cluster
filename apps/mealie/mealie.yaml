# Mealie v3.30.0 (2026-10-31), SQLite in /app/data on a `local` volume (never NFS: SQLite locks),
# without snapshot. Started directly as uid 1000: no root, so the image's PUID/PGID step is skipped.
# `family` and `admins` reach the Pocket-ID client; `admins` become Mealie admins.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: mealie
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 2Gi
---
# Pocket-ID client, created by the operator; the Secret mealie-oidc-credentials appears next to the pod.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: mealie
  namespace: mealie
spec:
  callbackUrls: ["https://mealie.int.${DOMAIN}/login"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: family, namespace: pocket-id }
    - { name: admins, namespace: pocket-id }
  launchUrl: https://mealie.int.${DOMAIN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.30.0
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: BASE_URL, value: "https://mealie.int.${DOMAIN}" }
            - { name: ALLOW_SIGNUP, value: "false" }
            - { name: OIDC_AUTH_ENABLED, value: "true" }
            - { name: OIDC_CONFIGURATION_URL, value: "https://auth.${DOMAIN}/.well-known/openid-configuration" }
            - { name: OIDC_PROVIDER_NAME, value: Pocket-ID }
            - { name: OIDC_ADMIN_GROUP, value: admins }
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: mealie-oidc-credentials, key: client_id }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: mealie-oidc-credentials, key: client_secret }
          ports:
            - { name: http, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /api/app/about, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/app/about, port: http }
          livenessProbe:
            httpGet: { path: /api/app/about, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 256Mi }      # guess, not measured: adjust after a week
            limits: { memory: 768Mi }                  # Python pre-allocates: 512Mi is tight
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
spec:
  selector:
    app.kubernetes.io/name: mealie
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie
  namespace: mealie
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - mealie.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: mealie
          port: 80
