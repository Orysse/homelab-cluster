# Mealie (recipes, meal plans) at mealie.int.${DOMAIN}. Internal host (LAN and VPN). Sign-in is
# the app's own OIDC (not oauth2-proxy), so API tokens still reach /api: they are what an MCP
# server on the owner's machine uses.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mealie
  labels:
    gateway-access: internal
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mealie
automountServiceAccountToken: false
