# FlareSolverr (new dependency, v3.5.2): headless Chrome that solves the Cloudflare challenge of
# some indexers for Prowlarr. Internal only (no route): Prowlarr reaches it at
# http://flaresolverr.media.svc.cluster.local (port 80), set once in Prowlarr: Settings >
# Indexers > Add proxy > FlareSolverr, with the tag `flaresolverr`, then the same tag on the
# indexers that need it. Chrome is the heaviest thing in this namespace; it keeps nothing on disk.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flaresolverr
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: LOG_LEVEL, value: info }
          ports:
            - { name: http, containerPort: 8191 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 20m, memory: 256Mi }
            limits: { memory: 1Gi }   # Chrome; estimate, not measured
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: shm, mountPath: /dev/shm }   # Chrome crashes on the default 64 MB
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: flaresolverr
  ports:
    - { name: http, port: 80, targetPort: http }
