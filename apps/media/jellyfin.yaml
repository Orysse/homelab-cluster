# Jellyfin: watching, jellyfin.${DOMAIN}, public. No oauth2-proxy in front: the native apps (TV,
# phone) call the API and cannot do a browser login. Pocket-ID goes through the SSO plugin
# (9p4/jellyfin-plugin-sso, installed by hand once, pinned by commit); local passwords stay for the
# native apps. Registration and anonymous access off. Library: /data read-only (films/, series/).
# No iGPU in the microVM: every transcode is on the CPU, so direct play is the goal and the
# transcodes are capped in Jellyfin's settings. Config and metadata on `local`.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:12.4
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: JELLYFIN_PublishedServerUrl, value: "https://jellyfin.${DOMAIN}" }
          ports:
            - { name: http, containerPort: 8096 }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 1536Mi }   # ffmpeg bursts; estimate, not measured
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: cache, mountPath: /cache }
            - { name: data, mountPath: /data, readOnly: true }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir: { sizeLimit: 5Gi }   # transcodes and image cache: on the VM disk, gone at restart
        - name: data
          persistentVolumeClaim:
            claimName: abel-nas
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: jellyfin
  hostnames:
    - jellyfin.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: jellyfin
          port: 80
