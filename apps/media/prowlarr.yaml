# Prowlarr: the indexers, pushed to Radarr and Sonarr. No library mount. Its searches go
# through gluetun's HTTP proxy (qbittorrent.music:8888): the VPN does the DNS (the cluster's
# is filtered in France) and the indexers do not see the home IP. By hand once: Settings >
# Indexers > add an HTTP proxy "vpn" (host qbittorrent.music.svc.cluster.local, port 8888, no
# login), then give the tag "vpn" to the proxy and to every indexer. An untagged indexer goes
# out directly (the policy still allows 443/80: definitions, updates).
# prowlarr.int.${DOMAIN}, admins only.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prowlarr
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prowlarr
          image: ghcr.io/linuxserver/prowlarr:version-3.1.0.5799
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: PUID, value: "1000" }       # the image starts as root, then drops to this user
            - { name: PGID, value: "1000" }
            # Login is Pocket-ID in front (auth.yaml); the network policy lets only that proxy
            # (and the apps that call the API with its key) reach this pod.
            - { name: Prowlarr__Auth__Method, value: External }
          ports:
            - { name: http, containerPort: 9696 }
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]   # s6-overlay setup
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  selector:
    app.kubernetes.io/name: prowlarr
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - prowlarr.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: oauth2-proxy-prowlarr
          port: 80
