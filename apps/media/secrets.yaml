# Secrets of Radarr, Sonarr and Prowlarr, all from OpenBao (kv/apps/media/*):
# - arr-db: the PostgreSQL role media (written by infrastructure/configs/postgres/databases/media.yaml).
# - arr-keys: the three API keys. Generated once here (32 hex characters, the *arr format, each
#   derived from one random value), pushed to kv/apps/media/arr-keys without ever replacing what
#   OpenBao holds, then read back. The apps take them as <App>__Auth__ApiKey, so a rebuilt pod
#   keeps the key Prowlarr, Seerr and Jellyfin know. To rotate: change the entry in OpenBao.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arr-db
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: arr-db
    template:
      data:
        Radarr__Postgres__User: "{{ .username }}"
        Radarr__Postgres__Password: "{{ .password }}"
        Sonarr__Postgres__User: "{{ .username }}"
        Sonarr__Postgres__Password: "{{ .password }}"
        Prowlarr__Postgres__User: "{{ .username }}"
        Prowlarr__Postgres__Password: "{{ .password }}"
  dataFrom:
    - extract: { key: media/db }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arr-keys-generated
  namespace: media
spec:
  refreshInterval: "0"            # generated once
  target:
    name: arr-keys-generated
    template:
      data:
        radarr: '{{ printf "radarr%s" .password | sha256sum | trunc 32 }}'
        sonarr: '{{ printf "sonarr%s" .password | sha256sum | trunc 32 }}'
        prowlarr: '{{ printf "prowlarr%s" .password | sha256sum | trunc 32 }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: arr-keys
  namespace: media
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists       # a new key would break every app that calls these APIs
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: arr-keys-generated }
  data:
    - match:
        remoteRef: { remoteKey: media/arr-keys }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arr-keys
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: arr-keys
    template:
      data:
        Radarr__Auth__ApiKey: "{{ .radarr }}"
        Sonarr__Auth__ApiKey: "{{ .sonarr }}"
        Prowlarr__Auth__ApiKey: "{{ .prowlarr }}"
  dataFrom:
    - extract: { key: media/arr-keys }
