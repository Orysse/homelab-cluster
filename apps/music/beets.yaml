# beets: the only writer into library/. Every 5 minutes, and at once when Aurral (Settings >
# Notifications > webhook, event "Request available") or slskd (qbittorrent.yaml) calls
# http://beets.music.svc:8080, it imports, without asking, the albums it matches with certainty (MusicBrainz), with cover and lyrics; anything else is
# skipped and left in place for a manual pass. Sources, one folder per album:
#   inbox/                          the owner (CD rips, purchases)       moved
#   inbox/asis/                     the owner, albums not on MusicBrainz  moved, tags kept as they are
#   inbox/singles/                  the owner, loose tracks (remixes...)  moved as singletons, tags kept
#   downloads/slskd/                slskd, downloads made in its UI     moved
#   inbox/aurral/<artist>/          Aurral (its Library folder)          hardlinked: Aurral keeps its
#                                   files where it put them; library/ holds full files all the same
#   downloads/torrents/complete/    qBittorrent, category `music`        copied: a hardlink would
#                                   share the file, and beets' tag writes would break the seed
# A folder is imported once nothing in it changed for 10 minutes (a download or a copy still
# in progress), or at once when slskd reports it complete. The incremental state (/config/state.pickle) remembers every folder imported;
# a skipped one is retried every run (one MusicBrainz lookup each).
# shortcut: retried skips cost a lookup per run, move them to a skipped/ folder if they pile up.
# A skipped folder MusicBrainz will never know: fix its tags (artist, album, title), then move
# it into inbox/asis/ (an album) or inbox/singles/ (loose tracks, still inside a folder).
# Manual pass on what was skipped ("skip" lines in /config/import.log), the loop paused:
#   kubectl -n music exec deploy/beets -- touch /config/pause      # after its current run
#   kubectl -n music exec deploy/beets -- sh -c 'printf "import:\n  quiet: no\n" > /config/manual.yaml'
#   kubectl -n music exec -it deploy/beets -- /lsiopy/bin/beet -c /config/manual.yaml import -I --move "/data/inbox/<album>"
#     (--copy for downloads/torrents/complete/; without -c manual.yaml it stays quiet and skips silently)
#   kubectl -n music exec deploy/beets -- rm /config/pause
# The library database is on a `local` PVC: SQLite does not belong on the SeaweedFS FUSE mount.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-config
  namespace: music
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled   # beets path templates ($albumartist)
data:
  config.yaml: |
    directory: /data/library
    library: /config/library.db
    plugins: musicbrainz fetchart embedart lyrics mbsync lastgenre
    import:
      write: yes
      incremental: yes
      quiet: yes             # never ask: certain matches only...
      quiet_fallback: skip   # ...the rest stays where it is
      log: /config/import.log
      incremental_skip_later: yes   # retry skipped folders every run (after a config fix, or a better copy)
      duplicate_action: remove      # a complete download replaces the partial album (btrbk snapshots keep the old one 14 days)
      # no `languages`: with fr, beets took MusicBrainz's fr alias ("Le Wanski" -> his legal name)
    match:
      # 0.04 by default, strict: an exact release with one small difference (0.04, 2026-11-24)
      # was only a medium match, skipped in quiet mode at every run.
      strong_rec_thresh: 0.10
      distance_weights:   # Soulseek rips often number tracks per disc or vinyl side: titles and lengths still match
        track_index: 0.1
        mediums: 0.1
    # Left behind by a moved album: deleted with its folder.
    clutter: ["*.jpg", "*.jpeg", "*.png", "*.nfo", "*.cue", "*.log", "*.m3u", "*.m3u8", "*.txt", "*.sfv", "Thumbs.db", ".DS_Store"]
    paths:
      default: $albumartist/($year) $album%aunique{}/$track $title
      # compilations by label, not one "Various Artists" heap; no label -> Compilations/
      comp: "%if{$label,Labels/$label,Compilations}/($year) $album%aunique{}/$track $title"
      singleton: Singles/$artist/$title
    fetchart:
      auto: yes
      sources: [filesystem, coverart, itunes]
      maxwidth: 1200         # Cover Art Archive scans can exceed 16 MB, the FLAC block limit
    embedart:
      maxwidth: 1200
      auto: yes
    lastgenre:             # Last.fm genres (the first is the main one): Navidrome, the DAP
      count: 3
      force: yes           # replaces the files' own genres: one vocabulary for the whole library
      whitelist: /config/genres.txt   # beets' list + genres-extra.yaml, written by the CronJob each run
    lyrics:
      auto: yes
      synced: yes            # LRCLIB timed lyrics when they exist
      sources: [lrclib]
  # Genres beets' whitelist lacks (Last.fm tags of this library, 2026-11-12), each with the genre
  # of lastgenre's tree it belongs to (only the keys feed the whitelist).
  # `~`: a top-level genre. A genre added here applies to an album on its next lastgenre run.
  genres-extra.yaml: |
    hardcore: hardcore techno        # here always Angerfist & co, never the punk one
    j-core: hardcore techno
    jcore: hardcore techno
    artcore: hardcore techno
    uptempo: hardcore techno
    uptempo hardcore: hardcore techno
    frapcore: hardcore techno
    mainstream hardcore: hardcore techno
    early hardcore: hardcore techno
    dutch hardcore: gabber
    nu gabber: gabber
    nu style gabber: gabber
    uk hardcore: happy hardcore
    acidcore: tekno
    tribecore: tekno
    tribe: tekno
    melodic tekno: tekno
    mentalcore: tekno
    outre-acid: tekno
    hardtek: tekno
    hardtekk: tekno
    harshcore: speedcore
    noisecore: speedcore
    melodic speedcore: speedcore
    extratone: speedcore
    rawstyle: hardstyle
    early hardstyle: hardstyle
    melodic hardstyle: hardstyle
    hard techno: techno
    hypertechno: techno
    hard acid techno: techno
    vocal trance: trance
    future bass: electronic
    kawaii future bass: electronic
    jersey club: electronic
    french house: house
    euro house: house
    jazz hop: hip hop
    instrumental hip hop: hip hop
    boom bap: hip hop
    conscious hip hop: hip hop
    french rap: hip hop
    west coast rap: hip hop
    drill: hip hop
    chipmunk soul: hip hop
    chanson francaise: chanson
    soundtrack: ~
    video game music: soundtrack
    progressive metalcore: metalcore
    drumstep: drum and bass
    dancefloor drum n bass: drum and bass
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beets-config
  namespace: music
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beets
  namespace: music
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled   # shell ${...} in the script
spec:
  replicas: 1
  strategy: { type: Recreate }   # one writer of library.db
  selector:
    matchLabels: { app.kubernetes.io/name: beets }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beets
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beets
          image: ghcr.io/linuxserver/beets:2.14.1-ls359
          # The image's s6 init is skipped: beets runs directly as 1000.
          ports: [{ name: hook, containerPort: 8080 }]
          command:
            - /bin/sh
            - -ec
            - |
              # lastgenre's whitelist: the image's list and ours (genres-extra.yaml keys)
              lg=$(/lsiopy/bin/python -c 'import importlib.util as u; print(u.find_spec("beetsplug.lastgenre").submodule_search_locations[0])')
              { cat "$lg/genres.txt"; sed -n 's/^\([^#: ][^:]*\):.*/\1/p' /config/genres-extra.yaml; } > /config/genres.txt
              # $1: beet arguments up to the import flags, then the source trees; imports their settled album folders.
              import_settled() {
                flags=$1; shift
                srcs=$*
                set --
                for src in $srcs; do
                  mkdir -p "$src"
                  for d in "$src"/*/; do
                    [ -d "$d" ] || continue
                    case "$d" in /data/inbox/asis/|/data/inbox/singles/|/data/inbox/aurral/|*/_*/) continue ;; esac   # aurral/: per artist below; _*/: Aurral's playlists and Flows
                    # a folder slskd reported complete needs no settling
                    awk -v d="${d%/}" '$0 == d || index($0, d "/") == 1 { f = 1 } END { exit !f }' /tmp/ready-run ||
                      [ -z "$(find "$d" -mmin -"$settle" | head -n 1)" ] || continue
                    set -- "$@" "${d%/}"
                  done
                done
                [ $# -eq 0 ] || { /lsiopy/bin/beet $flags "$@"; ran=1; }
              }
              # One run of every source; the loop below calls it.
              run() {
                ran=; settle=10
                import_settled "import --move" /data/inbox /data/downloads/slskd
                # Aurral checks the files it downloaded stay where it put them (it downloads them again
                # otherwise): hardlinked, the same files are in library/ and in its folder.
                printf "import:\n  hardlink: yes\n" > /config/hardlink.yaml
                # Aurral calls once a request is complete: its folders need no settling then.
                settle=$aurral_settle
                import_settled "-c /config/hardlink.yaml import" /data/inbox/aurral
                settle=10
                import_settled "import --move -A" /data/inbox/asis
                import_settled "import --move -A -s" /data/inbox/singles
                import_settled "import --copy" /data/downloads/torrents/complete
                # Lidarr sees an arrival only on a rescan (no inotify on FUSE); until then the
                # album stays "missing" in Lidarr.
                [ -z "${ran:-}" ] || curl -fsS -o /dev/null -X POST -H "X-Api-Key: $LIDARR_API_KEY" \
                  -H "Content-Type: application/json" -d '{"name":"RescanFolders"}' \
                  http://lidarr.music.svc.cluster.local/api/v1/command || echo "Lidarr rescan request failed"
              }
              # The webhook (any method, any path) asks for a run now: Aurral (a request is complete,
              # no body) and slskd (DownloadDirectoryComplete, its localDirectoryName is ready).
              /lsiopy/bin/python -c '
              import http.server, json
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      n = int(self.headers.get("Content-Length") or 0)
                      try:
                          d = json.loads(self.rfile.read(n) or b"{}").get("localDirectoryName")
                      except Exception:
                          d = None
                      if isinstance(d, str) and d.startswith("/data/"):
                          with open("/tmp/ready-dirs", "a") as f:
                              f.write(d.rstrip("/") + "\n")
                      open("/tmp/import-now", "w").close(); self.send_response(204); self.end_headers()
                  do_POST = do_GET
                  def log_message(self, *a): pass
              http.server.HTTPServer(("", 8080), H).serve_forever()' &
              while :; do
                aurral_settle=10
                [ ! -e /tmp/import-now ] || { rm -f /tmp/import-now; aurral_settle=0; }
                mv /tmp/ready-dirs /tmp/ready-run 2>/dev/null || : > /tmp/ready-run
                [ -e /config/pause ] || run || echo "run failed, next one in 5 minutes"
                # 5 minutes, or less when the webhook calls
                i=0; while [ $i -lt 60 ] && [ ! -e /tmp/import-now ]; do sleep 5; i=$((i+1)); done
              done
          env:
            - { name: BEETSDIR, value: /config }
            - { name: HOME, value: /config }
            - name: LIDARR_API_KEY
              valueFrom: { secretKeyRef: { name: beets-lidarr, key: api_key } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: music, mountPath: /data }
            - { name: config, mountPath: /config }
            - { name: beets-config, mountPath: /config/config.yaml, subPath: config.yaml }
            - { name: beets-config, mountPath: /config/genres-extra.yaml, subPath: genres-extra.yaml }
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: music-nas   # the family NAS (nas.yaml, D35); `music` (SeaweedFS) kept read-only as a fallback until removed
        - name: config
          persistentVolumeClaim:
            claimName: beets-config
        - name: beets-config
          configMap:
            name: beets-config
---
apiVersion: v1
kind: Service
metadata:
  name: beets
  namespace: music
spec:
  selector: { app.kubernetes.io/name: beets }
  ports: [{ name: hook, port: 8080, targetPort: hook }]
