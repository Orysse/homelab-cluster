# Lidarr: wanted albums, import into library/. Database in the cluster PostgreSQL (two
# databases: lidarr and lidarr-log), so the offsite copy holds the list of what to re-fetch;
# the rest of its configuration is on a `local` volume. lidarr.int.${DOMAIN}.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: music
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: music
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lidarr
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lidarr
          image: ghcr.io/linuxserver/lidarr:version-3.1.6.5079
          envFrom:
            - secretRef:
                name: lidarr-db
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: PUID, value: "1000" }       # the image starts as root, then drops to this user
            - { name: PGID, value: "1000" }
            - { name: Lidarr__Postgres__Host, value: main-rw.postgres.svc.cluster.local }
            - { name: Lidarr__Postgres__Port, value: "5432" }
            - { name: Lidarr__Postgres__MainDb, value: lidarr }
            - { name: Lidarr__Postgres__LogDb, value: lidarr-log }
          ports:
            - { name: http, containerPort: 8686 }
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ping, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 20m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]   # s6-overlay setup
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: music, mountPath: /data }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lidarr-config
        - name: music
          persistentVolumeClaim:
            claimName: music
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: music
spec:
  selector:
    app.kubernetes.io/name: lidarr
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  namespace: music
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - lidarr.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: oauth2-proxy-lidarr
          port: 80
