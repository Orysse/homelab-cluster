# Music Assistant's UI at music.int.${DOMAIN}. Music Assistant itself is not in the cluster:
# it is a LAN guest of nuc1 (homelab-nix D34, container `music`, 192.168.1.220) because it
# needs mDNS and AirPlay's random ports. Only the route is here: a Service without selector,
# its endpoint written by hand. Login: Music Assistant's own screen, "Home Assistant" button,
# which goes through Home Assistant's Pocket-ID login (homelab-nix topology guests.music).
---
apiVersion: v1
kind: Service
metadata:
  name: music-assistant
  namespace: music
spec:
  ports:
    - { name: http, port: 80, targetPort: 8095 }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: music-assistant
  namespace: music
  labels:
    kubernetes.io/service-name: music-assistant
addressType: IPv4
ports:
  - { name: http, port: 8095, protocol: TCP }
endpoints:
  - addresses: ["192.168.1.220"]   # homelab-nix topology guests.music.address
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant
  namespace: music
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - music.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: music-assistant
          port: 80
