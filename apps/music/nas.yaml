# The music volume on the family NAS (Synology, 192.168.1.151, RAID): shared folder
# Music-Abel (quota 500 GB), NFSv4.1, exported read-write to kube-0 only, all users squashed
# to the NAS admin (files show as 1024:100, mode 777: the apps write as 1000).
# Draft: docs/superpowers/specs/2026-11-24-music-on-nas.md (D35). Same layout as `music`
# (library/, downloads/, inbox/, aurral/); copied from SeaweedFS on 2026-11-24 (one-off Job
# music-to-nas, 47 min, identical file lists), every app mounts this claim since.
# The mount is made by kubelet on kube-0, not from the pods' network: no-lan-egress does not
# apply to it. A NAS that is off or rebooting hangs reads (hard mount) until it is back.
# Nothing SQLite here (D32): databases stay on class `local`.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-nas
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain   # deleting the claim never touches the NAS
  storageClassName: ""
  mountOptions: [nfsvers=4.1, hard, timeo=600, noatime]
  nfs:
    server: 192.168.1.151
    path: /volume1/Music-Abel
  claimRef:
    namespace: music
    name: music-nas
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-nas
  namespace: music
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: music-nas
  resources:
    requests:
      storage: 500Gi
