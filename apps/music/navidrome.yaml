# Navidrome: listening at home, on the library (read-only). Its database (users, play
# counts, playlists) is on a `local` volume: lost, a rescan rebuilds the library, not the
# users. It rescans hourly (new albums arrive from Lidarr). navidrome.${DOMAIN}: public, the UI
# (Pocket-ID) and /rest/ for Subsonic apps; navidrome-api.int.${DOMAIN}: clients that sign in with their own
# Navidrome password (Feishin, Music Assistant), LAN and VPN only, at the end of this file.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: music
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: music
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          image: ghcr.io/navidrome/navidrome:0.64.2
          env:
            - { name: ND_MUSICFOLDER, value: /music }
            - { name: ND_DATAFOLDER, value: /data }
            - { name: ND_SCANSCHEDULE, value: "@every 1h" }
            - { name: ND_LOGLEVEL, value: info }
            - { name: ND_ENABLEGRAVATAR, value: "false" }
            - { name: ND_ENABLEINSIGHTSCOLLECTOR, value: "false" }
            # Transcoding is the one thing that can eat kube-0: a few at a time, and stop ffmpeg when the client leaves.
            - { name: ND_TRANSCODING_MAXCONCURRENT, value: "3" }
            - { name: ND_TRANSCODING_MAXCONCURRENTPERUSER, value: "2" }
            - { name: ND_TRANSCODING_ENABLECANCELLATION, value: "true" }
            # Logged in by its oauth2-proxy (auth.yaml): the Pocket-ID username, which must match a
            # Navidrome user. Any pod address is trusted because only that proxy may connect
            # (network-policy.yaml), and it strips this header from what clients send.
            - { name: ND_EXTAUTH_TRUSTEDSOURCES, value: "10.42.0.0/16" }
            - { name: ND_EXTAUTH_USERHEADER, value: X-Forwarded-Preferred-Username }
          envFrom:
            - secretRef:
                name: navidrome-lastfm   # ND_LASTFM_APIKEY, ND_LASTFM_SECRET: bios, similar artists (no scrobbling unless a user links an account)
          ports:
            - { name: http, containerPort: 4533 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 768Mi }   # 384Mi: OOMKilled during scans of the full library (2026-11-07)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }          # SQLite temporary files; the root is read-only
            - { name: music, mountPath: /music, subPath: library, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: music
          persistentVolumeClaim:
            claimName: music
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: music
spec:
  selector:
    app.kubernetes.io/name: navidrome
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome
  namespace: music
spec:
  # Public: listening away from home (Pocket-ID for the UI; Subsonic apps on /rest/ with their
  # own Navidrome password). No internal name any more: the LAN uses navidrome-api.int.
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: navidrome
  hostnames:
    - navidrome.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: oauth2-proxy-navidrome
          port: 80
---
# Clients that cannot do OIDC (Feishin, Symfonium...): straight to Navidrome, which authenticates them
# itself (its own user and password, then its JWT on the native API). INTERNAL Gateway only, LAN and VPN.
# The Gateway's Envoy reaches the pod from the pod network, which ND_EXTAUTH_TRUSTEDSOURCES trusts, so a
# client could send X-Forwarded-Preferred-Username and become anyone, admin included: this route REMOVES
# that header. Test it after any change (a request with the header must get 401 on /api/).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome-api
  namespace: music
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - navidrome-api.int.${DOMAIN}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - X-Forwarded-Preferred-Username
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: navidrome
          port: 80
