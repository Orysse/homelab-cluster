# Music: each pod gets what it needs and nothing else.
#   Lidarr       from its oauth2-proxy (auth.yaml) and beets; to PostgreSQL, qBittorrent and slskd, DNS, the Internet
#                (metadata and indexers, 80/443)
#   Navidrome    from its oauth2-proxy; DNS, 443 (cover art, artist info)
#   qBittorrent  (and slskd, same pod) from their oauth2-proxies and Lidarr; the tunnel (any UDP: gluetun's
#                firewall already drops all else), DNS
#   Syncthing    its sync port (22000) from the LAN, the tailnet and the DAP: the sources
#                are outside the cluster; 443 and 22000 out (discovery, relays, the DAP)
#   beets        DNS, Lidarr (rescan), 443 (MusicBrainz, Cover Art Archive, iTunes, LRCLIB)
#   essentia     DNS and 443, only to pypi.org and files.pythonhosted.org (its wheels, installed once)
# SeaweedFS is not listed: the FUSE mount lives in the CSI mount service, not in these pods.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lidarr
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: lidarr }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: oauth2-proxy-lidarr }
      toPorts: [{ ports: [{ port: "8686", protocol: TCP }] }]
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: beets }
      toPorts: [{ ports: [{ port: "8686", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: postgres, cnpg.io/cluster: main }
      toPorts: [{ ports: [{ port: "5432", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: qbittorrent }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }, { port: "5030", protocol: TCP }] }]   # qBittorrent, slskd (Tubifarry)
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }, { port: "80", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: navidrome
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: navidrome }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: oauth2-proxy-navidrome }
      toPorts: [{ ports: [{ port: "4533", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: qbittorrent }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: oauth2-proxy-qbittorrent }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: oauth2-proxy-slskd }
      toPorts: [{ ports: [{ port: "5030", protocol: TCP }] }]
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: lidarr }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }, { port: "5030", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [world]       # the tunnel (WireGuard, UDP) and what goes through it
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: syncthing }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [world, remote-node, host]
      toPorts:
        - ports:
            - { port: "22000", protocol: TCP }
            - { port: "22000", protocol: UDP }
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "22000", protocol: TCP }
            - { port: "22000", protocol: UDP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy-lidarr
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: oauth2-proxy-lidarr }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "4180", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toFQDNs:
        - matchName: auth.${DOMAIN}
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEntities: [ingress]             # auth.${DOMAIN}, once Cilium hands it to Envoy
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: lidarr }
      toPorts: [{ ports: [{ port: "8686", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy-navidrome
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: oauth2-proxy-navidrome }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "4180", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toFQDNs:
        - matchName: auth.${DOMAIN}
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEntities: [ingress]             # auth.${DOMAIN}, once Cilium hands it to Envoy
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: navidrome }
      toPorts: [{ ports: [{ port: "4533", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: beets
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: beets }
  enableDefaultDeny: { ingress: true, egress: true }
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: lidarr }
      toPorts: [{ ports: [{ port: "8686", protocol: TCP }] }]
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: essentia
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: essentia }
  enableDefaultDeny: { ingress: true, egress: true }
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchName: pypi.org }, { matchName: files.pythonhosted.org }] }
    - toFQDNs: [{ matchName: pypi.org }, { matchName: files.pythonhosted.org }]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy-qbittorrent
  namespace: music
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: oauth2-proxy-qbittorrent }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "4180", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toFQDNs:
        - matchName: auth.${DOMAIN}
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEntities: [ingress]             # auth.${DOMAIN}, once Cilium hands it to Envoy
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: qbittorrent }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
