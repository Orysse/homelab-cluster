# qBittorrent and slskd (Soulseek) behind one gluetun: the containers share the pod's network,
# and gluetun's firewall drops everything that is not the WireGuard tunnel (kill switch). One
# pod, one tunnel: a second tunnel would need a second AirVPN key. Both download into
# downloads/ of the `music` volume; beets (beets.yaml) is the only writer into library/.
# VPN: AirVPN, WireGuard keys in OpenBao kv/apps/music/vpn (ExternalSecret qbittorrent-vpn).
# Ports AirVPN forwards to us (the same on every AirVPN server): 2417 TCP+UDP qBittorrent,
# 54429 TCP slskd. UIs internal only, each with its own login: qbittorrent.int.${DOMAIN},
# slskd.int.${DOMAIN} (slskd: account and keys in kv/apps/music/slskd).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: music
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  namespace: music
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: music
spec:
  replicas: 1   # slskd's first share scan (once, then cached in /app) with Syncthing and Navidrome scanning took k3s down on 2026-11-07
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        # slskd refuses to start on a missing directory; qBittorrent's category paths too.
        - name: dirs
          image: docker.io/library/busybox:1.37
          command: [sh, -ec, "mkdir -p /data/downloads/slskd /data/downloads/.slskd-incomplete /data/downloads/torrents/complete /data/downloads/torrents/incomplete"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: music, mountPath: /data/downloads, subPath: downloads }
      containers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.3
          env:
            - { name: VPN_SERVICE_PROVIDER, value: airvpn }
            - { name: VPN_TYPE, value: wireguard }
            - { name: SERVER_COUNTRIES, value: Netherlands }   # gluetun picks a server, fails over
            - { name: FIREWALL_VPN_INPUT_PORTS, value: "2417,54429" }   # the forwarded ports, through the tunnel only
            # The UIs, and the cluster's pod and service ranges (DNS, Lidarr), stay reachable.
            - { name: FIREWALL_INPUT_PORTS, value: "8080,5030" }
            - { name: FIREWALL_OUTBOUND_SUBNETS, value: "10.42.0.0/16,10.43.0.0/16" }
          envFrom:
            - secretRef:
                name: qbittorrent-vpn      # WIREGUARD_PRIVATE_KEY, _PRESHARED_KEY, _ADDRESSES
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          volumeMounts:
            - { name: tun, mountPath: /dev/net/tun }
            - { name: gluetun-tmp, mountPath: /tmp/gluetun }   # its state files (public IP); the image dir is not writable without DAC_OVERRIDE
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:version-5.1.4-r3
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: WEBUI_PORT, value: "8080" }
            - { name: TORRENTING_PORT, value: "2417" }   # first start only; then the WebUI setting
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 768Mi }
          securityContext:      # starts as root (s6-overlay), then drops to PUID
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: music, mountPath: /data }
        - name: slskd
          image: ghcr.io/slskd/slskd:0.26.2
          env:
            - { name: SLSKD_SLSK_LISTEN_PORT, value: "54429" }
            - { name: SLSKD_HTTP_PORT, value: "5030" }
            - { name: SLSKD_NO_HTTPS, value: "true" }         # TLS ends at the gateway
            - { name: SLSKD_NO_VERSION_CHECK, value: "true" }
            - { name: SLSKD_USERNAME, value: admin }          # web UI; password from the secret
            - { name: SLSKD_SHARED_DIR, value: /data/library }   # sharing is the norm on Soulseek
            - { name: SLSKD_DOWNLOADS_DIR, value: /data/downloads/slskd }
            - { name: SLSKD_INCOMPLETE_DIR, value: /data/downloads/.slskd-incomplete }   # outside what beets reads
          envFrom:
            - secretRef:
                name: slskd      # SLSKD_SLSK_USERNAME, SLSKD_SLSK_PASSWORD, SLSKD_PASSWORD
          ports:
            - { name: slskd, containerPort: 5030 }
          readinessProbe:
            tcpSocket: { port: slskd }
          resources:
            requests: { cpu: 20m, memory: 160Mi }
            limits: { memory: 1Gi }   # 512Mi: OOMKilled with 4 albums downloading (2026-11-07)
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: slskd-config, mountPath: /app }
            - { name: music, mountPath: /data/library, subPath: library, readOnly: true }
            - { name: music, mountPath: /data/downloads, subPath: downloads }
      volumes:
        - name: slskd-config
          persistentVolumeClaim:
            claimName: slskd-config
        - name: gluetun-tmp
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: music
          persistentVolumeClaim:
            claimName: music
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: music
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: music
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - qbittorrent.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: qbittorrent
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: music
spec:
  selector:
    app.kubernetes.io/name: qbittorrent
  ports:
    - { name: http, port: 5030, targetPort: slskd }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskd
  namespace: music
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - slskd.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: slskd
          port: 5030
