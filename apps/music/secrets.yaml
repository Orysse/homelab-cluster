# Lidarr's database credentials: the role `lidarr` (infrastructure/configs/postgres/databases/
# lidarr.yaml), kept in OpenBao at kv/apps/lidarr/db. Lidarr reads its settings from
# environment variables named like its config.xml (Lidarr__Postgres__*).
# The VPN entry (kv/apps/music/vpn) is added with qbittorrent.yaml's replicas, when the
# provider's WireGuard configuration exists.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-db
  namespace: music
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: lidarr-db
    template:
      data:
        Lidarr__Postgres__User: "{{ .username }}"
        Lidarr__Postgres__Password: "{{ .password }}"
  dataFrom:
    - extract: { key: lidarr/db }
