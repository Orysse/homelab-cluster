# Lidarr's database credentials: the role `lidarr` (infrastructure/configs/postgres/databases/
# lidarr.yaml), kept in OpenBao at kv/apps/music/db. Lidarr reads its settings from
# environment variables named like its config.xml (Lidarr__Postgres__*).
# The VPN keys for gluetun (qbittorrent.yaml): AirVPN WireGuard, kv/apps/music/vpn.
# slskd: Soulseek account, web UI password, API key (Soularr), kv/apps/music/slskd.
# Soularr: its config.ini, with the Lidarr (kv/apps/music/lidarr) and slskd API keys.
# Navidrome: the Last.fm API key (artist bios, similar artists), kv/apps/music/lastfm.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-db
  namespace: music
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: lidarr-db
    template:
      data:
        Lidarr__Postgres__User: "{{ .username }}"
        Lidarr__Postgres__Password: "{{ .password }}"
  dataFrom:
    - extract: { key: music/db }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
  namespace: music
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: qbittorrent-vpn
    template:
      data:
        WIREGUARD_PRIVATE_KEY: "{{ .private_key }}"
        WIREGUARD_PRESHARED_KEY: "{{ .preshared_key }}"
        WIREGUARD_ADDRESSES: "{{ .addresses }}"
  dataFrom:
    - extract: { key: music/vpn }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd
  namespace: music
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: slskd
    template:
      data:
        SLSKD_SLSK_USERNAME: "{{ .slsk_username }}"
        SLSKD_SLSK_PASSWORD: "{{ .slsk_password }}"
        SLSKD_PASSWORD: "{{ .web_password }}"
        # The key only works from pod addresses (Soularr); the API is plain HTTP inside the cluster.
        SLSKD_API_KEY: "cidr=10.42.0.0/16;{{ .api_key }}"
  dataFrom:
    - extract: { key: music/slskd }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: soularr-config
  namespace: music
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: soularr-config
    template:
      data:
        config.ini: |
          [Lidarr]
          api_key = {{ .lidarr_api_key }}
          host_url = http://lidarr.music.svc.cluster.local
          download_dir = /data/downloads/slskd
          # beets imports, not Lidarr (docs/superpowers/specs/2026-11-07-music-automation.md)
          disable_sync = True

          [Slskd]
          api_key = {{ .slskd_api_key }}
          host_url = http://slskd.music.svc.cluster.local:5030
          url_base = /
          download_dir = /data/downloads/slskd
          delete_searches = True
          stalled_timeout = 3600
          remote_queue_timeout = 300

          [Release Settings]
          use_selected_lidarr_release = False
          use_most_common_tracknum = True
          allow_multi_disc = True
          accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
          skip_region_check = False
          accepted_formats = CD,Digital Media,Vinyl

          [Search Settings]
          search_timeout = 5000
          maximum_peer_queue = 50
          minimum_peer_upload_speed = 0
          minimum_filename_match_ratio = 0.8
          minimum_search_interval = 5
          search_retry_wait_hours = 0
          # FLAC first; MP3 320 only when nothing else exists (owner's rule)
          allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320
          album_prepend_artist = False
          search_type = incrementing_page
          number_of_albums_to_grab = 3
          search_source = missing
          failed_import_denylist = True
          ignore_failed_users = False
          failed_user_ignore_hours = 168

          [Download Settings]
          download_filtering = True
          use_extension_whitelist = False
          rename_download_folders = True

          [Logging]
          level = INFO
          log_to_file = False
  data:
    - secretKey: lidarr_api_key
      remoteRef: { key: music/lidarr, property: api_key }
    - secretKey: slskd_api_key
      remoteRef: { key: music/slskd, property: api_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-lastfm
  namespace: music
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: navidrome-lastfm
    template:
      data:
        ND_LASTFM_APIKEY: "{{ .api_key }}"
        ND_LASTFM_SECRET: "{{ .secret }}"
  dataFrom:
    - extract: { key: music/lastfm }
---
# beets asks Lidarr to rescan library/ after an import (beets.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beets-lidarr
  namespace: music
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: beets-lidarr
  data:
    - secretKey: api_key
      remoteRef: { key: music/lidarr, property: api_key }
