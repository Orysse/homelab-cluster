apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - open-webui.yaml
  - secrets.yaml
# app.kubernetes.io/version = the image tag (follows Renovate bumps).
replacements:
  - source:
      kind: Deployment
      name: open-webui
      fieldPath: spec.template.spec.containers.[name=open-webui].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: open-webui }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
