# Open WebUI: chat for the team, on a shared DeepSeek account.
#   chat.int.${DOMAIN}   LAN/VPN only. Login through Pocket-ID (OIDC client "open-webui");
#                        a new account waits for an admin's approval ("pending").
# Chats, prompts, skills and users in PostgreSQL on the database host (database "open-webui",
# credentials from OpenBao). Uploads and the vector store (Chroma) on the NFS StorageClass.
# Local embeddings are off (RAG_EMBEDDING_ENGINE=openai without a provider): the model would
# cost ~500 Mi of RAM, and DeepSeek has no embeddings API. Chats work; document search does not.
---
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  labels:
    gateway-access: internal
    # baseline, not restricted: the image runs as root (its files belong to root).
    pod-security.kubernetes.io/enforce: baseline
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: open-webui
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate                # one pod owns the data directory
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.3
          envFrom:
            - secretRef:
                name: open-webui   # DATABASE_URL, WEBUI_SECRET_KEY, OAUTH_CLIENT_*, OPENAI_API_KEY (from OpenBao)
          env:
            - { name: WEBUI_URL, value: "https://chat.int.${DOMAIN}" }
            - { name: ENABLE_SIGNUP, value: "false" }
            - { name: DEFAULT_USER_ROLE, value: pending }
            # Pocket-ID. Keep the password form until an SSO login has been checked.
            - { name: ENABLE_OAUTH_SIGNUP, value: "true" }
            - { name: OAUTH_PROVIDER_NAME, value: Pocket-ID }
            - { name: OPENID_PROVIDER_URL, value: "https://auth.${DOMAIN}/.well-known/openid-configuration" }
            - { name: OAUTH_SCOPES, value: "openid email profile groups" }
            - { name: OPENID_REDIRECT_URI, value: "https://chat.int.${DOMAIN}/oauth/oidc/callback" }
            # The model: DeepSeek, through its OpenAI-compatible API. No Ollama.
            - { name: ENABLE_OLLAMA_API, value: "false" }
            - { name: OPENAI_API_BASE_URL, value: "https://api.deepseek.com/v1" }
            # Memory and privacy: no local embedding model, no telemetry.
            - { name: RAG_EMBEDDING_ENGINE, value: openai }
            - { name: SCARF_NO_ANALYTICS, value: "true" }
            - { name: DO_NOT_TRACK, value: "true" }
            - { name: ANONYMIZED_TELEMETRY, value: "false" }
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:             # first start runs the database migrations
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /app/backend/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
spec:
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - chat.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
