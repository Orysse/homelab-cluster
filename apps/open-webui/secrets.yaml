# Open WebUI's secrets:
#   open-webui-app  secret     WEBUI_SECRET_KEY (signs sessions): generated once, kept in
#                              OpenBao at kv/apps/open-webui/open-webui-app, never seen
#   deepseek        api_key    the shared DeepSeek account, written by hand in OpenBao at
#                              kv/apps/open-webui/deepseek
#   db              username, password   kv/apps/open-webui/db (postgres/databases/open-webui.yaml)
# and its Pocket-ID client, written next to it by the Pocket-ID operator.
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: open-webui
  namespace: open-webui
spec:
  callbackUrls: ["https://chat.${DOMAIN}/oauth/oidc/callback"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
    - { name: visitors, namespace: pocket-id }
  launchUrl: https://chat.${DOMAIN}
  secret:
    name: open-webui-oidc
    keys:
      clientID: OAUTH_CLIENT_ID
      clientSecret: OAUTH_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-app-generated
  namespace: open-webui
spec:
  refreshInterval: "0"
  target:
    name: open-webui-app-generated
    template:
      data:
        secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: open-webui-app
  namespace: open-webui
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: open-webui-app-generated }
  data:
    - match:
        remoteRef: { remoteKey: open-webui/open-webui-app }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: open-webui
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password | urlquery }}@main-rw.postgres.svc.cluster.local:5432/open-webui?sslmode=require"
        WEBUI_SECRET_KEY: "{{ .secret }}"
        OPENAI_API_KEY: "{{ .api_key }}"
  data:
    - secretKey: secret
      remoteRef: { key: open-webui/open-webui-app, property: secret }
    - secretKey: api_key
      remoteRef: { key: open-webui/deepseek, property: api_key }
  dataFrom:
    - extract: { key: open-webui/db }
