# Open WebUI's secrets, from OpenBao (only this namespace can read kv/apps/open-webui/*):
#   open-webui-app  WEBUI_SECRET_KEY (signs sessions), generated by vault-config-operator
#   oidc            client_id and client_secret of the Pocket-ID client "open-webui",
#                   written by hand at kv/apps/open-webui/oidc
#   deepseek        api_key of the shared DeepSeek account, written by hand at
#                   kv/apps/open-webui/deepseek
# and its PostgreSQL credentials (static role "open-webui", openbao/database.yaml).
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: open-webui-app
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/open-webui
  isKVSecretsEngineV2: true
  secretKey: secret
  kvSecretRetainPolicy: Retain
  secretFormat:
    inlinePasswordPolicy: |
      length = 48
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres
  namespace: open-webui
spec:
  method: GET
  path: database/postgres/static-creds/open-webui
  provider:
    server: http://openbao.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: namespace-secrets
        serviceAccountRef:
          name: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
  namespace: open-webui
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: open-webui
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password | urlquery }}@${DATABASE_ADDRESS}:5432/open-webui?sslmode=disable"
        WEBUI_SECRET_KEY: "{{ .secret }}"
        OAUTH_CLIENT_ID: "{{ .client_id }}"
        OAUTH_CLIENT_SECRET: "{{ .client_secret }}"
        OPENAI_API_KEY: "{{ .api_key }}"
  data:
    - secretKey: secret
      remoteRef: { key: open-webui/open-webui-app, property: secret }   # RandomSecret above (path + its name)
    - secretKey: client_id
      remoteRef: { key: open-webui/oidc, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: open-webui/oidc, property: client_secret }
    - secretKey: api_key
      remoteRef: { key: open-webui/deepseek, property: api_key }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
