# OpenCost: its UI reached by Traefik, its metrics by Alloy; reaches DNS, the API server
# (pods, nodes, volumes) and VictoriaMetrics on the monitoring host.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opencost
  namespace: opencost
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }]
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: alloy }
      toPorts: [{ ports: [{ port: "9003", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
    - toCIDR: ["${MONITORING_ADDRESS}/32"]
      toPorts: [{ ports: [{ port: "8428", protocol: TCP }] }]
