# OpenCost (CNCF) at cost.int.${DOMAIN}: what each namespace costs, from its CPU, RAM and
# storage use. No cloud bill here: the prices below are derived from nuc1's real costs.
#   PROVISIONAL (2026-10-12), per hour:
#     electricity  ~25 W at the wall (21 W RAPL psys, homelab-nix monitoring.nix, plus ~85 %
#                  PSU efficiency) x 0.2001 EUR/kWh (EDF Tarif Bleu, Base, 6 kVA, Aug 2026;
#                  no subscription: the home pays it anyway)                0.00500 EUR
#     OVH          27.58 EUR/year: abe.lc and the homelab@ mailbox (2027 renewal)
#                                                                             0.00315 EUR
#     total        0.00815 EUR/h ~ 5.95 EUR/month, split half CPU (6 vCPU), half RAM (11 GB
#                  of VMs). Still missing: hardware amortisation; a smart plug would replace
#                  the 25 W estimate.
#   Units: EUR per vCPU-hour, per GB-hour (shown with a "$" in the UI).
# Reads metrics from VictoriaMetrics on the monitoring host; its own cost metrics are
# scraped back by Alloy (pod annotations).
---
apiVersion: v1
kind: Namespace
metadata:
  name: opencost
  labels:
    gateway-access: internal
    pod-security.kubernetes.io/enforce: restricted
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: opencost
automountServiceAccountToken: false
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opencost
  namespace: opencost
spec:
  interval: 24h
  url: https://opencost.github.io/opencost-helm-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
  namespace: opencost
spec:
  interval: 1h
  chart:
    spec:
      chart: opencost
      version: "2.5.32"
      sourceRef:
        kind: HelmRepository
        name: opencost
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9003"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    opencost:
      exporter:
        defaultClusterId: ${CLUSTER_NAME}
        resources:
          requests: { cpu: 10m, memory: 128Mi }
          limits: { memory: 384Mi }
        securityContext: &container-security
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      ui:
        resources:
          requests: { cpu: 5m, memory: 32Mi }
          limits: { memory: 96Mi }
        # Its entrypoint rewrites the bundled JS (base URL) in place: /var/www must be writable.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
      prometheus:
        internal:
          enabled: false
        external:
          enabled: true
          url: http://${MONITORING_ADDRESS}:8428
      customPricing:
        enabled: true
        provider: custom
        costModel:
          description: "nuc1: electricity (~25 W, EDF Tarif Bleu 0.2001 EUR/kWh) + OVH domain and mail (27.58 EUR/year); no amortisation yet"
          CPU: 0.000679
          spotCPU: 0.000679
          RAM: 0.000370
          spotRAM: 0.000370
          GPU: 0
          storage: 0.00001
          zoneNetworkEgress: 0
          regionNetworkEgress: 0
          internetNetworkEgress: 0
---
# In the oauth2-proxy namespace, next to the Pocket-ID middleware (Traefik reads
# middlewares there only); the ReferenceGrant below lets it reach the Service here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencost
  namespace: oauth2-proxy
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - cost.int.${DOMAIN}
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: pocket-id }
      backendRefs:
        - name: opencost
          namespace: opencost
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: opencost-from-oauth2-proxy
  namespace: opencost
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: oauth2-proxy
  to:
    - group: ""
      kind: Service
      name: opencost
