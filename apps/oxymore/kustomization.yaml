apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - oxymore.yaml
configMapGenerator:
  - name: oxymore-files
    namespace: oxymore
    files:
      - nginx.conf
      - html/test.html
      - html/images/atelier1.jpg
      - html/images/atelier2.jpg
      - html/images/carnet.jpg
      - html/images/coffret.jpg
      - html/images/echantillons.jpg
      - html/images/etuis.jpg
      - html/images/logo.png
      - html/images/touches.jpg
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
replacements:
  - source:
      kind: Deployment
      name: oxymore
      fieldPath: spec.template.spec.containers.[name=nginx].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: oxymore }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
