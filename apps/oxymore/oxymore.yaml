# oxymore-files (configMapGenerator) gets a hash suffix: editing a file in html/ or nginx.conf redeploys the pods.
---
apiVersion: v1
kind: Namespace
metadata:
  name: oxymore
  labels:
    gateway-access: public
    pod-security.kubernetes.io/enforce: restricted
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: oxymore
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxymore
  namespace: oxymore
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oxymore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxymore
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # "nginx" in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: files, mountPath: /usr/share/nginx/html }
            - {
                name: files,
                mountPath: /etc/nginx/conf.d/default.conf,
                subPath: nginx.conf,
              }
            - { name: tmp, mountPath: /tmp } # nginx's pid file and temp paths
      volumes:
        - name: files
          configMap:
            name: oxymore-files
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: oxymore
---
apiVersion: v1
kind: Service
metadata:
  name: oxymore
  namespace: oxymore
spec:
  selector:
    app.kubernetes.io/name: oxymore
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oxymore
  namespace: oxymore
spec:
  parentRefs:
    - name: public
      namespace: kube-system
      sectionName: https
  hostnames:
    - oxymore.holive.fr
  rules:
    - backendRefs:
        - name: oxymore
          port: 80
