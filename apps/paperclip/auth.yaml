# Pocket-ID in front of Paperclip: an oauth2-proxy (same image and settings as in music/auth.yaml),
# admins only. The Gateway routes to the proxy; the proxy is the only thing allowed to reach
# Paperclip (network-policy.yaml). Paperclip keeps its own login behind it. No path is skipped:
# no agent calls Paperclip's API from outside yet. When one does, add --skip-auth-route for it.
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: oauth2-proxy-paperclip
  namespace: paperclip
spec:
  callbackUrls: ["https://paperclip.int.${DOMAIN}/oauth2/callback"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
  launchUrl: https://paperclip.int.${DOMAIN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-paperclip
  namespace: paperclip
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-paperclip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-paperclip
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.${DOMAIN}
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admins
            - --email-domain=*
            - --insecure-oidc-allow-unverified-email=true
            - --code-challenge-method=S256
            - --skip-provider-button=true
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true             # behind the Gateway: trusts X-Forwarded-*
            - --upstream=http://paperclip.paperclip.svc.cluster.local
            - --redirect-url=https://paperclip.int.${DOMAIN}/oauth2/callback
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-secret-file=/secrets/cookie/secret
            - --client-secret-file=/secrets/oidc/client_secret
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: oauth2-proxy-paperclip-oidc-credentials, key: client_id }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: oidc, mountPath: /secrets/oidc, readOnly: true }
            - { name: cookie, mountPath: /secrets/cookie, readOnly: true }
      volumes:
        - name: oidc
          secret: { secretName: oauth2-proxy-paperclip-oidc-credentials }
        - name: cookie
          secret: { secretName: oauth2-proxy-cookie }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-paperclip
  namespace: paperclip
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-paperclip
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip
  namespace: paperclip
spec:
  parentRefs:
    - name: internal
      namespace: gateway
      sectionName: https
  hostnames:
    - paperclip.int.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: oauth2-proxy-paperclip
          port: 80
