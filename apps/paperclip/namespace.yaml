# Paperclip: a control plane for AI agents. Internal host (LAN and VPN), and behind the Pocket-ID
# oauth2-proxy (auth.yaml, admins only); Paperclip then asks for its own login as well.
---
apiVersion: v1
kind: Namespace
metadata:
  name: paperclip
  labels:
    gateway-access: internal
    pod-security.kubernetes.io/enforce: restricted
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: paperclip
automountServiceAccountToken: false
