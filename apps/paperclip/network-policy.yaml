# Paperclip: from its oauth2-proxy only; to DNS, PostgreSQL and Anthropic (Claude sign-in and API,
# 443). Another agent adapter means another toFQDNs entry here and its key in kv/apps/paperclip/.
# oauth2-proxy: from the Gateway; to DNS, Pocket-ID (through the public Gateway) and Paperclip.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperclip
  namespace: paperclip
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: paperclip }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: oauth2-proxy-paperclip }
      toPorts: [{ ports: [{ port: "3100", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: postgres, cnpg.io/cluster: main }
      toPorts: [{ ports: [{ port: "5432", protocol: TCP }] }]
    # Claude: subscription sign-in (OAuth) and API. Hostnames from Anthropic's login flow,
    # to confirm in Hubble if a sign-in step still fails. Each further adapter: its own entry.
    - toFQDNs:
        - matchName: claude.ai
        - matchName: platform.claude.com
        - matchName: console.anthropic.com
        - matchName: api.anthropic.com
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: oauth2-proxy-paperclip
  namespace: paperclip
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: oauth2-proxy-paperclip }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "4180", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toFQDNs:
        - matchName: auth.${DOMAIN}
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEntities: [ingress]             # the same, once Cilium hands the connection to Envoy
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: paperclip }
      toPorts: [{ ports: [{ port: "3100", protocol: TCP }] }]
