# Paperclip at paperclip.int.${DOMAIN}: control plane for AI agent teams. Database in the cluster
# PostgreSQL; /paperclip (assets, agent workspaces) on a `local` volume, without snapshot.
# Pinned by commit tag: upstream publishes sha-<commit> only; sha-1b4c803 = release v2026.1023.0.
# Starts as uid 1000 (the image's `node`): its entrypoint then skips the chown/gosu step.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: paperclip
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  namespace: paperclip
spec:
  replicas: 0   # down while elk runs: the node has no room for both (set back to 1)
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip:sha-1b4c803
          envFrom:
            - secretRef: { name: paperclip-db }
            - secretRef: { name: keys }
            - secretRef: { name: agent-jwt }
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: PAPERCLIP_DEPLOYMENT_MODE, value: authenticated }
            - { name: PAPERCLIP_DEPLOYMENT_EXPOSURE, value: private }
            - { name: PAPERCLIP_PUBLIC_URL, value: "https://paperclip.int.${DOMAIN}" }
            - { name: PAPERCLIP_ALLOWED_HOSTNAMES, value: "paperclip.int.${DOMAIN}" }
            - { name: PAPERCLIP_TELEMETRY_DISABLED, value: "1" }
            # Agents and the GitHub broker must call Paperclip inside the pod: its public address goes
            # through the Gateway and the SSO proxy, which answer 403 to an agent. An explicit value wins.
            - { name: PAPERCLIP_API_URL, value: "http://localhost:3100" }
          ports:
            - { name: http, containerPort: 3100 }
          startupProbe:
            httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: "paperclip.int.${DOMAIN}" }] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: "paperclip.int.${DOMAIN}" }] }
          livenessProbe:
            httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: "paperclip.int.${DOMAIN}" }] }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /paperclip }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip
  namespace: paperclip
spec:
  selector:
    app.kubernetes.io/name: paperclip
  ports:
    - { name: http, port: 80, targetPort: http }
