# Paperclip's secrets:
#   db     its PostgreSQL credentials, kv/apps/paperclip/db (postgres/databases/paperclip.yaml),
#          assembled into DATABASE_URL
#   keys   generated once, kept in OpenBao at kv/apps/paperclip/keys, never seen by anyone:
#            auth     BETTER_AUTH_SECRET, signs sessions (losing it only logs people out)
#            master   PAPERCLIP_SECRETS_MASTER_KEY, encrypts the secrets Paperclip stores
#                     (losing it makes them unreadable: hence OpenBao, which is backed up)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-db
  namespace: paperclip
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: paperclip-db
    template:
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@main-rw.postgres.svc.cluster.local:5432/paperclip"
  dataFrom:
    - extract: { key: paperclip/db }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keys-generated
  namespace: paperclip
spec:
  refreshInterval: "0"
  target:
    name: keys-generated
    template:
      data:
        auth: "{{ .auth }}"
        master: "{{ .master | sha256sum }}"    # 64 hex characters = 32 bytes
  # Two independent draws from the generator, renamed so they do not collide.
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
      rewrite:
        - regexp: { source: "password", target: "auth" }
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
      rewrite:
        - regexp: { source: "password", target: "master" }
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keys
  namespace: paperclip
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists       # a new master key would orphan everything already encrypted
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: keys-generated }
  data:
    - match:
        remoteRef: { remoteKey: paperclip/keys }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keys
  namespace: paperclip
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: keys
    template:
      data:
        BETTER_AUTH_SECRET: "{{ .auth }}"
        PAPERCLIP_SECRETS_MASTER_KEY: "{{ .master }}"
  dataFrom:
    - extract: { key: paperclip/keys }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie
  namespace: paperclip
spec:
  refreshInterval: "0"
  target:
    name: oauth2-proxy-cookie
    template:
      data:
        secret: "{{ .password | trunc 32 }}"    # 32 bytes: an AES-256 key
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
