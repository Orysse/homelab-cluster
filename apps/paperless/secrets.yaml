# Paperless' secrets, from OpenBao (only this namespace can read kv/apps/paperless/*):
#   paperless-app  secret_key               Django's secret key, generated by vault-config-operator
#   oidc           client_id client_secret  Pocket-ID client "paperless", written by hand in the
#                                           OpenBao UI
# and its PostgreSQL credentials (static role "paperless", openbao/database.yaml).
# All handed to Paperless as files (PAPERLESS_<VAR>_FILE), not in the pod's environment.
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: paperless-app
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/paperless
  isKVSecretsEngineV2: true
  secretKey: secret_key
  kvSecretRetainPolicy: Retain    # a new key logs everyone out
  secretFormat:
    inlinePasswordPolicy: |
      length = 64
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres
  namespace: paperless
spec:
  method: GET
  path: database/postgres/static-creds/paperless
  provider:
    server: http://openbao.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: namespace-secrets
        serviceAccountRef:
          name: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
  namespace: paperless
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: paperless
    template:
      engineVersion: v2
      data:
        dbuser: "{{ .username }}"
        dbpass: "{{ .password }}"
        secret_key: "{{ .secret_key }}"
        # Login with Pocket-ID (django-allauth). "groups" in the scope: Pocket-ID's admins
        # are Paperless superusers (PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP).
        socialaccount_providers: |
          {"openid_connect": {
            "SCOPE": ["openid", "profile", "email", "groups"],
            "OAUTH_PKCE_ENABLED": true,
            "APPS": [{
              "provider_id": "pocket-id",
              "name": "Pocket-ID",
              "client_id": {{ .client_id | toJson }},
              "secret": {{ .client_secret | toJson }},
              "settings": {"server_url": "https://auth.${DOMAIN}"}
            }]
          }}
  data:
    - secretKey: secret_key
      remoteRef: { key: paperless/paperless-app, property: secret_key }   # RandomSecret above (path + its name)
    - secretKey: client_id
      remoteRef: { key: paperless/oidc, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: paperless/oidc, property: client_secret }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
