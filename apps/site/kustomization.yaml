apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - site.yaml
configMapGenerator:
  - name: site-files
    namespace: site
    files:
      - index.txt
      - nginx.conf
    options:
      annotations:
        # Free text: Flux must not substitute ${variables} in it.
        kustomize.toolkit.fluxcd.io/substitute: disabled
