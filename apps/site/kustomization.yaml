apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - site.yaml
configMapGenerator:
  - name: site-files
    namespace: site
    files:
      - index.txt
      - nginx.conf
    options:
      annotations:
        # Free text: Flux must not substitute ${variables} in it.
        kustomize.toolkit.fluxcd.io/substitute: disabled
# app.kubernetes.io/version = the image tag (follows Renovate bumps).
replacements:
  - source:
      kind: Deployment
      name: site
      fieldPath: spec.template.spec.containers.[name=nginx].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: site }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
