server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  default_type text/plain;
  charset utf-8;
  add_header X-Served-By $hostname always;

  location = /        { try_files /index.txt =404; }
  location = /healthz { return 200 "ok\n"; }

  # Matrix delegation (apps/matrix): user IDs @name:abe.lc, server at matrix.abe.lc.
  location = /.well-known/matrix/server {
    default_type application/json;
    return 200 '{"m.server": "matrix.abe.lc:443"}';
  }
  location = /.well-known/matrix/client {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;   # web clients read it cross-origin
    return 200 '{"m.homeserver": {"base_url": "https://matrix.abe.lc"}}';
  }
  location /          { return 404 "404\n"; }
}
