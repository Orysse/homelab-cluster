# site-files (configMapGenerator) est suffixée d'un hash : modifier index.txt redéploie.
---
apiVersion: v1
kind: Namespace
metadata:
  name: site
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: files, mountPath: /usr/share/nginx/html/index.txt, subPath: index.txt }
            - { name: files, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf }
      volumes:
        - name: files
          configMap:
            name: site-files
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: site
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: site
spec:
  selector:
    app.kubernetes.io/name: site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: site
spec:
  ingressClassName: traefik
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  name: http
