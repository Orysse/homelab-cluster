# Plain-text page at the domain apex, served by static-web-server (one static binary).
# site-files (configMapGenerator) gets a hash suffix: editing index.txt redeploys the pods.
---
apiVersion: v1
kind: Namespace
metadata:
  name: site
  labels:
    gateway-access: public
    pod-security.kubernetes.io/enforce: restricted
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: site
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: site
          image: ghcr.io/static-web-server/static-web-server:2.44.1
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: SERVER_ROOT, value: /public }
            - { name: SERVER_INDEX_FILES, value: index.txt }
            - { name: SERVER_HEALTH, value: "true" }      # GET /health
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: files, mountPath: /public }
      volumes:
        - name: files
          configMap:
            name: site-files
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: site
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: site
spec:
  selector:
    app.kubernetes.io/name: site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
  namespace: site
spec:
  parentRefs:
    - { name: public, namespace: gateway, sectionName: https }
  hostnames:
    - ${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: X-Frame-Options, value: DENY }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: site
          port: 80
