# site-files (configMapGenerator) gets a hash suffix: editing index.txt redeploys the pods.
---
apiVersion: v1
kind: Namespace
metadata:
  name: site
  labels:
    gateway-access: public
    pod-security.kubernetes.io/enforce: restricted
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: site
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101            # "nginx" in nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: files, mountPath: /usr/share/nginx/html/index.txt, subPath: index.txt }
            - { name: files, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf }
            - { name: tmp, mountPath: /tmp }   # nginx's pid file and temp paths
      volumes:
        - name: files
          configMap:
            name: site-files
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: site
---
apiVersion: v1
kind: Service
metadata:
  name: site
  namespace: site
spec:
  selector:
    app.kubernetes.io/name: site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
  namespace: site
spec:
  parentRefs:
    - name: public
      namespace: kube-system
      sectionName: https
  hostnames:
    - ${DOMAIN}
  rules:
    - backendRefs:
        - name: site
          port: 80
