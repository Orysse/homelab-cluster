# SUB/WAVE: from the Gateway only; to DNS, Navidrome (Subsonic API, its policy lets this pod in) and the
# Internet on 80/443 (LLM provider, weather, news feeds, cloud voices).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: subwave
  namespace: subwave
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]   # the Gateway (Cilium's Envoy)
      toPorts: [{ ports: [{ port: "80", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:   # Navidrome, straight. Going through the Gateway (navidrome-api.int) does not help: the Gateway checks
        - matchLabels: { k8s:io.kubernetes.pod.namespace: music, app.kubernetes.io/name: navidrome }   # this egress rule too
      toPorts: [{ ports: [{ port: "4533", protocol: TCP }] }]
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }, { port: "80", protocol: TCP }] }]
