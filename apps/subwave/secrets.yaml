# ADMIN_PASS for the admin console, generated once in-cluster. Read it when you need it:
#   kubectl -n subwave get secret admin -o jsonpath='{.data.ADMIN_PASS}' | base64 -d
# Nothing irreplaceable here (state lives in the PVC), so no copy in OpenBao.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin
  namespace: subwave
spec:
  refreshInterval: "0"
  target:
    name: admin
    template:
      data:
        ADMIN_PASS: "{{ .password | trunc 32 }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
# The password of the `subwave` user in Navidrome (NAVIDROME_USER / NAVIDROME_PASS in subwave.yaml). Navidrome
# has no passwords of its own for people (Pocket-ID logs them in through the proxy), so this user exists only
# for SUB/WAVE's Subsonic calls; it was created through Navidrome's API with this value, never typed by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome
  namespace: subwave
spec:
  refreshInterval: "0"
  target:
    name: navidrome
    template:
      data:
        NAVIDROME_PASS: "{{ .password | trunc 32 }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
