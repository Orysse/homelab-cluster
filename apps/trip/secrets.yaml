# ENCRYPTION_KEY: encrypts what TREK stores at rest (API keys, tokens). Generated once and kept in
# OpenBao at kv/apps/trip/keys, never seen by anyone; losing it makes that data unreadable.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keys-generated
  namespace: trip
spec:
  refreshInterval: "0"
  target:
    name: keys-generated
    template:
      data:
        ENCRYPTION_KEY: "{{ .password | sha256sum }}"    # 64 hex characters = 32 bytes
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keys
  namespace: trip
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists       # a new key would orphan everything already encrypted
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: keys-generated }
  data:
    - match:
        remoteRef: { remoteKey: trip/keys }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keys
  namespace: trip
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: keys
  dataFrom:
    - extract: { key: trip/keys }
