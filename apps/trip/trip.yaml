# TREK: collaborative trip planner (SQLite). /app/data and /app/uploads on one `local` volume,
# without snapshot. Starts as uid 1000 (the image's `node`): its entrypoint then skips chown/gosu.
# Image pinned to the release tag, v5.1.1 (2026-11-08).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: trip
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local
  resources:
    requests:
      storage: 5Gi
---
# Pocket-ID client, created by the operator; the Secret trip-oidc-credentials appears next to the pod.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: trip
  namespace: trip
spec:
  callbackUrls: ["https://trip.${DOMAIN}/api/auth/oidc/callback"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: family, namespace: pocket-id }
    - { name: admins, namespace: pocket-id }
  launchUrl: https://trip.${DOMAIN}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip
  namespace: trip
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trip
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trek
          image: mauriceboe/trek:5.1.4
          envFrom:
            - secretRef: { name: keys }
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: APP_URL, value: "https://trip.${DOMAIN}" }
            - { name: OIDC_ISSUER, value: "https://auth.${DOMAIN}" }
            - { name: OIDC_DISPLAY_NAME, value: Famille }
            - { name: OIDC_ONLY, value: "true" }       # no password login or registration
            - { name: OIDC_SCOPE, value: "openid email profile groups" }
            - { name: OIDC_ADMIN_CLAIM, value: groups }
            - { name: OIDC_ADMIN_VALUE, value: admins }
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: trip-oidc-credentials, key: client_id }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: trip-oidc-credentials, key: client_secret }
            - { name: TRUST_PROXY, value: "1" }        # the Gateway
            - { name: FORCE_HTTPS, value: "true" }
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 128Mi }      # guess, not measured: adjust after a week
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /app/data, subPath: data }
            - { name: data, mountPath: /app/uploads, subPath: uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trip
  namespace: trip
spec:
  selector:
    app.kubernetes.io/name: trip
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trip
  namespace: trip
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: trip
  hostnames:
    - trip.${DOMAIN}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
              - { name: X-Content-Type-Options, value: nosniff }
              - { name: Referrer-Policy, value: strict-origin-when-cross-origin }
      backendRefs:
        - name: trip
          port: 80
