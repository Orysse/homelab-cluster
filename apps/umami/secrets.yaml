# Umami's secrets, from OpenBao (only this namespace can read kv/apps/umami/*):
#   app  secret  signs dashboard sessions, generated by vault-config-operator
# and its PostgreSQL credentials (static role "umami", openbao/database.yaml).
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: umami-app
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/umami
  isKVSecretsEngineV2: true
  secretKey: secret
  kvSecretRetainPolicy: Retain
  secretFormat:
    inlinePasswordPolicy: |
      length = 48
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres
  namespace: umami
spec:
  method: GET
  path: database/postgres/static-creds/umami
  provider:
    server: http://openbao.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: namespace-secrets
        serviceAccountRef:
          name: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami
  namespace: umami
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: umami
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password | urlquery }}@${DATABASE_ADDRESS}:5432/umami?sslmode=disable"
        APP_SECRET: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef: { key: umami/app, property: secret }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
