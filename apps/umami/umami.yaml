# Umami: privacy-friendly web analytics (no cookies, no personal data) for vitrine.
#   pulse.${DOMAIN}       public, ONLY what visitors' browsers need: the tracking script
#                         and the endpoint that receives page views
#   umami.int.${DOMAIN}   the dashboard (LAN/VPN). Own login (no OIDC in Umami); the first
#                         account is admin / umami: change it at first login.
# Data in PostgreSQL on the database host (database "umami", credentials from OpenBao).
---
apiVersion: v1
kind: Namespace
metadata:
  name: umami
  labels:
    gateway-access: both
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: umami
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: umami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:3.4.0
          envFrom:
            - secretRef:
                name: umami        # DATABASE_URL, APP_SECRET (from OpenBao)
          env:
            - { name: DISABLE_TELEMETRY, value: "1" }
            - { name: DISABLE_UPDATES, value: "1" }   # Renovate handles updates
            - { name: CHECKPOINT_DISABLE, value: "1" } # Prisma telemetry (seen in Hubble, blocked anyway)
          ports:
            - { name: http, containerPort: 3000 }
          startupProbe:               # first start runs the database migrations
            httpGet: { path: /api/heartbeat, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/heartbeat, port: http }
          livenessProbe:
            httpGet: { path: /api/heartbeat, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: umami
  namespace: umami
spec:
  selector:
    app.kubernetes.io/name: umami
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-public
  namespace: umami
spec:
  parentRefs:
    - name: public
      namespace: kube-system
      sectionName: https
  hostnames:
    - pulse.${DOMAIN}
  rules:
    - matches:
        - path: { type: Exact, value: /script.js }
        - path: { type: Exact, value: /api/send }
      backendRefs:
        - name: umami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami
  namespace: umami
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - umami.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: umami
          port: 80
