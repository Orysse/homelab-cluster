# Static site: reached only through the public Gateway, reaches nothing (not even DNS).
# Kubelet probes (host) are always allowed by Cilium.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vitrine
  namespace: vitrine
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  egress: [{}]                 # no egress rule = Cilium would not deny; an empty rule allows nothing
  ingress:
    - fromEntities: [ingress]          # the Gateway (Cilium's Envoy)
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }] }]
