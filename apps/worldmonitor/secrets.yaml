# The four secrets upstream asks for (openssl rand -hex 32 each), derived from one random value
# generated once in-cluster: 64 hex characters, distinct per purpose, never seen by anyone.
# Nothing here is irreplaceable (Redis is a cache, sessions just restart), so no copy in OpenBao.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keys
  namespace: worldmonitor
spec:
  refreshInterval: "0"
  target:
    name: keys
    template:
      data:
        REDIS_PASSWORD: '{{ printf "%s-redis-password" .password | sha256sum }}'
        REDIS_TOKEN: '{{ printf "%s-redis-token" .password | sha256sum }}'
        WM_SESSION_SECRET: '{{ printf "%s-session" .password | sha256sum }}'
        RELAY_SHARED_SECRET: '{{ printf "%s-relay" .password | sha256sum }}'
        SRH_CONNECTION_STRING: 'redis://:{{ printf "%s-redis-password" .password | sha256sum }}@redis:6379'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie
  namespace: worldmonitor
spec:
  refreshInterval: "0"
  target:
    name: oauth2-proxy-cookie
    template:
      data:
        secret: "{{ .password | trunc 32 }}"    # 32 bytes: an AES-256 key
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
