---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs   # point d'entrée (MetalLB + Traefik) prêt
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  path: ./apps
  prune: true
  wait: true
  decryption:                 # fichiers *.sops.yaml (voir .sops.yaml)
    provider: sops
    secretRef:
      name: sops-age          # posé par le socle (clé age dérivée de kube-1)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
