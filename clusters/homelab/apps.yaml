---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs   # point d'entrée (MetalLB + Traefik) prêt
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  path: ./apps
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
