---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system       # created by the FluxInstance (homelab-nix: k3s/flux.nix)
  path: ./apps
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age          # created by the base (homelab-nix: k3s/flux-sops.nix)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
