# ${VARIABLES} : ConfigMap flux-system/cluster-vars, générée depuis la topologie du socle.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers   # CRD de MetalLB, cert-manager, Datadog
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  path: ./infrastructure/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age          # posé par le socle (homelab-nix : k3s/flux-sops.nix)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
