# ${VARIABLES}: the flux-system/cluster-vars ConfigMap, generated from the base's topology.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  path: ./infrastructure/controllers
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers   # CRDs: MetalLB, cert-manager, CSI driver
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  path: ./infrastructure/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age          # created by the base (homelab-nix: k3s/flux-sops.nix)
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
