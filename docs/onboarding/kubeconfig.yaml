# Homelab abe.lc, login through Pocket-ID (OIDC). No credentials in this file: the token
# comes from `kubectl oidc-login` (browser + passkey), cached in ~/.kube/cache/oidc-login.
# Your rights come from your Pocket-ID group (admins: everything; visitors: read-only).
# Needs the VPN (Tailscale, hs.abe.lc): the API is not on the Internet.
#   curl -fsSLo ~/.kube/configs/homelab.yaml https://raw.githubusercontent.com/Orysse/homelab-cluster/main/docs/onboarding/kubeconfig.yaml
#   KUBECONFIG=~/.kube/configs/homelab.yaml kubectl get nodes
# The CA changes only if the cluster is rebuilt from scratch.
apiVersion: v1
kind: Config
clusters:
  - name: homelab
    cluster:
      server: https://192.168.1.211:6443
      certificate-authority-data: 
users:
  - name: homelab
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: kubectl
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://auth.abe.lc
          - --oidc-client-id=46031658-1b1a-4d3b-8bfa-82dfaf67d4c4   # Pocket-ID client "kubernetes" (public, PKCE)
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=email
          - --oidc-extra-scope=groups
        interactiveMode: IfAvailable
contexts:
  - name: homelab
    context: { cluster: homelab, user: homelab }
current-context: homelab
