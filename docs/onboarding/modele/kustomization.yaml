apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - app.yaml
# Label app.kubernetes.io/version = le tag de l'image (suit les mises à jour Renovate).
replacements:
  - source:
      kind: Deployment
      name: monapp
      fieldPath: spec.template.spec.containers.[name=app].image
      options: { delimiter: ":", index: 1 }
    targets:
      - select: { kind: Deployment, name: monapp }
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/version]
          - spec.template.metadata.labels.[app.kubernetes.io/version]
        options: { create: true }
