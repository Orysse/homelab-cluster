# Rush2 logs -> logs-<dataset>-<site> on the homelab ELK (ingest route: only "/" and "/_bulk").
# Mount: ./logs:/logs:ro  (layout /logs/<site>/*.log). Env: ES_URL, ES_PASSWORD (user `ingest`).
# DRY_RUN=1 prints events (rubydebug) instead of sending. UNTESTED: dry-run on a few lines first.
# A real run twice duplicates every event (random _id, data streams cannot be cleaned with `ingest`).

input {
  file {
    path => "/logs/**/*.log"
    mode => "read"
    file_completed_action => "log"            # the default is "delete": never leave it
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    sincedb_path => "/dev/null"
    codec => plain { charset => "UTF-8" }
    # shortcut: assumes the Windows files are UTF-8; if accents show as garbage, split them with charset CP1252
  }
}

filter {
  # the file input adds [host][name] = the Logstash machine: wrong for us
  mutate { remove_field => ["[host]"] }
  grok { match => { "[log][file][path]" => "^/logs/(?<site>[^/]+)/" } tag_on_failure => [] }
  if ![site] { mutate { add_field => { "site" => "default" } } }
  mutate { copy => { "message" => "[event][original]" } replace => { "[event][module]" => "unparsed" } }

  grok {
    match => { "message" => [
      # rsyslog + Windows event: "<recv ts> <ip>  <event ts> <FQDN> EvntSLog - - - <event>..."
      "^%{TIMESTAMP_ISO8601:log_ts}\s+%{IPORHOST:syslog_host}\s+%{TIMESTAMP_ISO8601}\s+%{HOSTNAME:win_host}\s+EvntSLog\s+(?:-\s+)*%{GREEDYDATA:log_message}",
      # rsyslog RFC3339: "<ts> <host> <program>[pid]: <message>"
      "^%{TIMESTAMP_ISO8601:log_ts}\s+%{SYSLOGHOST:syslog_host}\s+%{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?:?\s+%{GREEDYDATA:log_message}"
    ] }
    tag_on_failure => ["_unparsed"]
  }
  # header time carries its own offset (SNS +02:00, others UTC); nginx and Windows override it below
  date { match => ["log_ts", "ISO8601"] remove_field => ["log_ts"] }

  # ---- Windows event (XML in the syslog message)
  if [win_host] {
    grok { match => { "log_message" => "(?<win_xml><event>.*</event>)" } tag_on_failure => ["_win_unparsed"] }
    if [win_xml] {
      xml { source => "win_xml" target => "win" force_array => false remove_field => ["win_xml"] }
      # rsyslog escapes CR/LF/TAB as #015#012 / #011
      mutate { gsub => [
        "[win][msg]", "#015#012", "
",
        "[win][msg]", "#011", " "
      ] }
      # event time = <timereported>; shortcut: assumed UTC (matches the rsyslog header), check with a min/max per source
      date { match => ["[win][timereported]", "yyyy-MM-dd HH:mm:ss"] timezone => "UTC" }
      mutate {
        replace => { "[event][module]" => "windows" }
        rename => { "[win][id]" => "[event][code]" "[win][localhostname]" => "[host][name]" "[win][msg]" => "message" }
        copy => { "syslog_host" => "[host][ip]" }
      }
      if [win][TargetUserName] and [win][TargetUserName] != "-" {
        mutate { copy => { "[win][TargetUserName]" => "[user][name]" } }
      } else if [win][SubjectUserName] and [win][SubjectUserName] != "-" {
        mutate { copy => { "[win][SubjectUserName]" => "[user][name]" } }
      }
      # [source][ip] is typed ip: only copy real addresses ("-" would reject the document)
      if [win][IpAddress] =~ /^[0-9a-fA-F:.]+$/ { mutate { copy => { "[win][IpAddress]" => "[source][ip]" } } }
      if [win][IpPort] =~ /^\d+$/ {
        mutate { copy => { "[win][IpPort]" => "[source][port]" } }
        mutate { convert => { "[source][port]" => "integer" } }
      }
    }
  }

  # ---- Stormshield SNS: key=value, quoted values may contain spaces
  else if [log_message] =~ /\bid=firewall\b/ {
    kv { source => "log_message" target => "sns" field_split_pattern => "\s+(?=[A-Za-z0-9_]+=)" value_split => "=" trim_value => "\"" }
    mutate {
      replace => { "[event][module]" => "sns" }
      rename => {
        "[sns][src]" => "[source][ip]" "[sns][dst]" => "[destination][ip]"
        "[sns][srcport]" => "[source][port]" "[sns][dstport]" => "[destination][port]"
        "[sns][ipproto]" => "[network][transport]" "[sns][proto]" => "[network][protocol]"
        "[sns][action]" => "[event][action]"
        "[sns][sent]" => "[source][bytes]" "[sns][rcvd]" => "[destination][bytes]"
        "[sns][dstcountry]" => "[destination][geo][country_iso_code]"
      }
    }
    mutate { convert => {
      "[source][port]" => "integer" "[destination][port]" => "integer"
      "[source][bytes]" => "integer" "[destination][bytes]" => "integer"
      "[sns][duration]" => "float"
    } }
  }

  # ---- nginx: the syslog header is local time labelled UTC, the real time is the nginx one (+0200)
  else if [syslog_program] == "nginx" {
    grok {
      match => { "log_message" => "^%{IP:[source][ip]} - (?:-|%{NOTSPACE:[user][name]}) \[%{HTTPDATE:nginx_ts}\] \"%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}\" %{INT:[http][response][status_code]:int} %{INT:[http][response][body][bytes]:int} \"%{DATA:[http][request][referrer]}\" \"%{DATA:[user_agent][original]}\"" }
      tag_on_failure => ["_nginx_unparsed"]
    }
    date { match => ["nginx_ts", "dd/MMM/yyyy:HH:mm:ss Z"] locale => "en" remove_field => ["nginx_ts"] }
    mutate { replace => { "[event][module]" => "nginx" } }
  }

  # ---- BIND query log
  else if [syslog_program] == "named" {
    grok {
      match => { "log_message" => "client @\S+ %{IP:[source][ip]}#%{INT:[source][port]:int} \(%{DATA}\): query: %{NOTSPACE:[dns][question][name]} %{WORD} %{WORD:[dns][question][type]} %{NOTSPACE:[dns][flags]} \(%{IP:[destination][ip]}\)" }
      tag_on_failure => ["_dns_unparsed"]
    }
    mutate { replace => { "[event][module]" => "dns" } }
  }

  # ---- Kea DHCP
  else if [syslog_program] =~ /^kea-/ {
    grok { match => { "log_message" => "^%{LOGLEVEL:[log][level]}\s+%{WORD:[dhcp][code]}\s+%{GREEDYDATA:[dhcp][detail]}" } tag_on_failure => [] }
    grok { match => { "log_message" => "lease %{IP:[client][ip]}" } tag_on_failure => [] }
    grok { match => { "log_message" => "hwtype=\d+ %{MAC:[client][mac]}" } tag_on_failure => [] }
    mutate { replace => { "[event][module]" => "dhcp" } }
  }

  # ---- common tail: host, process, message
  if [syslog_host] and [event][module] != "windows" { mutate { rename => { "syslog_host" => "[host][name]" } } }
  if [syslog_program] { mutate { rename => { "syslog_program" => "[process][name]" "syslog_pid" => "[process][pid]" } } }
  if [process][pid] { mutate { convert => { "[process][pid]" => "integer" } } }
  if [log_message] and [event][module] != "windows" { mutate { rename => { "log_message" => "message" } } }
  mutate { remove_field => ["log_message", "win_host", "syslog_host"] }

  # data stream routing: logs-<module>-<site> (lowercase, as Elasticsearch requires)
  mutate { add_field => { "[data_stream][type]" => "logs" "[data_stream][dataset]" => "%{[event][module]}" "[data_stream][namespace]" => "%{site}" } }
  mutate { lowercase => ["[data_stream][dataset]", "[data_stream][namespace]"] }
}

output {
  if "${DRY_RUN:0}" == "1" {
    stdout { codec => rubydebug }
  } else {
    elasticsearch {
      hosts => ["${ES_URL}"]
      user => "ingest"
      password => "${ES_PASSWORD}"
      data_stream => true
      # the route only passes "/" and "/_bulk": no /_license (ILM check) or template calls
      ilm_enabled => false
      manage_template => false
    }
  }
}
