# Authelia: https://www.authelia.com/configuration/prologue/introduction/
# Flux substitutes ${DOMAIN}. Secrets are read from files (AUTHELIA_*_FILE in
# authelia.yaml); the OIDC signing key through the template filter below.

theme: auto

server:
  address: tcp://:9091/

log:
  level: info
  format: json

telemetry:
  metrics:
    enabled: true
    address: tcp://:9959/

totp:
  issuer: ${DOMAIN}

webauthn:
  display_name: ${DOMAIN}

authentication_backend:
  password_reset:
    disable: true               # no mail server: hashes are changed in git
  file:
    path: /users/users.yml
    watch: true
    password:
      algorithm: argon2

# Who may reach what through the ForwardAuth middleware (kube-system/authelia).
access_control:
  default_policy: deny
  rules:
    - domain: traefik.int.${DOMAIN}
      subject: group:admins
      policy: two_factor

session:
  cookies:
    - domain: ${DOMAIN}
      authelia_url: https://auth.${DOMAIN}
      default_redirection_url: https://${DOMAIN}

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 15m

storage:
  local:
    path: /data/db.sqlite3      # second factors (WebAuthn, TOTP), on the PVC

# No SMTP: identity verification codes (needed to register a security key) are written
# here. Read with: kubectl -n auth exec deploy/authelia -- tail /data/notifications.txt
notifier:
  filesystem:
    filename: /data/notifications.txt

identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc-jwks.pem" | mindent 10 "|" | msquote }}
    # The API server reads identity from the ID token only.
    claims_policies:
      kubernetes:
        id_token: [preferred_username, groups, email, email_verified, name]
    clients:
      # kubectl oidc-login (int128/kubelogin): public client, PKCE, local callback.
      - client_id: kubernetes
        client_name: Kubernetes (kubectl)
        public: true
        authorization_policy: two_factor
        claims_policy: kubernetes
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - http://localhost:8000
          - http://localhost:18000
        scopes: [openid, offline_access, profile, email, groups]
        grant_types: [authorization_code, refresh_token]
        response_types: [code]
        token_endpoint_auth_method: none
