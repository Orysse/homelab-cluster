# Traefik's default certificate: apps need nothing to be served over HTTPS.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: kube-system        # same namespace as Traefik and the TLSStore
spec:
  secretName: wildcard-tls
  dnsNames:
    - ${DOMAIN}
    - "*.${DOMAIN}"
    - "*.int.${DOMAIN}"        # internal apps (gateway.yaml)
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default                 # reserved name: Traefik's default store
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-tls
---
# holive.fr (apps/holive): a second zone in the same Cloudflare account, so the same DNS-01
# token (it must list the holive.fr zone too). Served by its own listeners (gateway.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: holive
  namespace: kube-system
spec:
  secretName: holive-tls
  dnsNames:
    - holive.fr
    - www.holive.fr
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
