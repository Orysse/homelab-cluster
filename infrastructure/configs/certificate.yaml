# Certificat par défaut de Traefik : les apps n'ont rien à déclarer pour être en HTTPS.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: kube-system        # même namespace que Traefik et le TLSStore
spec:
  secretName: wildcard-tls
  dnsNames:
    - ${DOMAIN}
    - "*.${DOMAIN}"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default                 # nom réservé : store par défaut de Traefik
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-tls
