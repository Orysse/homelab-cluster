# Traefik's default certificate: apps need nothing to be served over HTTPS.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: kube-system        # same namespace as Traefik and the TLSStore
spec:
  secretName: wildcard-tls
  dnsNames:
    - ${DOMAIN}
    - "*.${DOMAIN}"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default                 # reserved name: Traefik's default store
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-tls
