# Cloudflare API token for cert-manager (DNS-01; zone abe.lc, DNS Edit), kept in OpenBao at
# kv/apps/cert-manager/cloudflare. If OpenBao is down, issued certificates keep working;
# only renewals (30 days before expiry) wait for it.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: cloudflare-api-token }
  data:
    - secretKey: api-token
      remoteRef: { key: cert-manager/cloudflare, property: api-token }
