# Same site and cluster tag as the nuc1 host agent (cluster-vars) so both correlate.
---
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    site: ${DD_SITE}
    clusterName: ${CLUSTER_NAME}
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    tags:
      - cluster:${CLUSTER_NAME}
      - env:homelab
    # k3s: embedded containerd, self-signed kubelet certificate.
    criSocketPath: /run/k3s/containerd/containerd.sock
    kubelet:
      tlsVerify: false
  features:
    logCollection:
      enabled: true
      containerCollectAll: true
    liveContainerCollection:
      enabled: true
    liveProcessCollection:
      enabled: true
    orchestratorExplorer:
      enabled: true
    kubeStateMetricsCore:
      enabled: true
    eventCollection:
      collectKubernetesEvents: true
    clusterChecks:
      enabled: true
    # No generic prometheus.io/* scraping: every series it sends is a billed custom metric,
    # and it duplicated the Flux and cert-manager integrations. Official integrations below.
  override:
    nodeAgent:
      extraConfd:
        configDataMap:
          # Official integrations whose auto-config does not match k3s's rancher/mirrored-*
          # images (autodiscovery matches on the short image name).
          coredns.yaml: |-
            ad_identifiers:
              - mirrored-coredns-coredns
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:9153/metrics
          # Traefik proxy metrics (entry points, services, TLS certs, config reloads) as
          # traefik_mesh.*: the Traefik Mesh integration reads a plain Traefik proxy.
          traefik_mesh.yaml: |-
            ad_identifiers:
              - mirrored-library-traefik
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:9100/metrics
          # Flux controllers' Prometheus metrics -> Datadog Flux integration (fluxcd.*,
          # out-of-the-box "Flux" dashboard). Matched by image name, scraped on each node.
          fluxcd.yaml: |-
            ad_identifiers:
              - source-controller
              - kustomize-controller
              - helm-controller
              - notification-controller
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:8080/metrics
