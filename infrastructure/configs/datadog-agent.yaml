# Same site and cluster tag as the nuc1 host agent (cluster-vars) so both correlate.
---
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    site: ${DD_SITE}
    clusterName: ${CLUSTER_NAME}
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    tags:
      - cluster:${CLUSTER_NAME}
      - env:homelab
    # k3s: embedded containerd, self-signed kubelet certificate.
    criSocketPath: /run/k3s/containerd/containerd.sock
    kubelet:
      tlsVerify: false
  features:
    logCollection:
      enabled: true
      containerCollectAll: true
    liveContainerCollection:
      enabled: true
    liveProcessCollection:
      enabled: true
    orchestratorExplorer:
      enabled: true
    kubeStateMetricsCore:
      enabled: true
      # Flux 2.x controllers no longer export a ready/not-ready gauge: read it from the
      # objects' status instead (same idea as fluxcd/flux2-monitoring-example).
      # -> kubernetes_state_customresource.flux_resource_info{ready:true|false,...}
      collectCrMetrics:
        - groupVersionKind: { group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization }
          resourcePlural: kustomizations
          metricNamePrefix: flux
          metrics:
            - name: resource_info
              help: Flux object state (ready, suspended, applied revision)
              each:
                type: Info
                info:
                  path: []            # object root: label paths below are absolute
                  labelsFromPath:
                    flux_kind: [kind]
                    flux_name: [metadata, name]
                    flux_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    reason: [status, conditions, "[type=Ready]", reason]
                    suspended: [spec, suspend]
                    revision: [status, lastAppliedRevision]
        - groupVersionKind: { group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease }
          resourcePlural: helmreleases
          metricNamePrefix: flux
          metrics:
            - name: resource_info
              help: Flux object state (ready, suspended, chart version)
              each:
                type: Info
                info:
                  path: []            # object root: label paths below are absolute
                  labelsFromPath:
                    flux_kind: [kind]
                    flux_name: [metadata, name]
                    flux_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    reason: [status, conditions, "[type=Ready]", reason]
                    suspended: [spec, suspend]
                    revision: [status, lastAttemptedRevision]
        - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository }
          resourcePlural: gitrepositories
          metricNamePrefix: flux
          metrics:
            - name: resource_info
              help: Flux object state (ready, suspended, fetched revision)
              each:
                type: Info
                info:
                  path: []            # object root: label paths below are absolute
                  labelsFromPath:
                    flux_kind: [kind]
                    flux_name: [metadata, name]
                    flux_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    reason: [status, conditions, "[type=Ready]", reason]
                    suspended: [spec, suspend]
                    revision: [status, artifact, revision]
    eventCollection:
      collectKubernetesEvents: true
    clusterChecks:
      enabled: true
    oomKill:                       # OOM-killed processes, per container (system-probe, eBPF)
      enabled: true
    # Traces: APM, plus the OTLP receiver for OpenTelemetry senders (Traefik). Reached
    # through the node-local Service datadog-agent.datadog (internalTrafficPolicy: Local).
    apm:
      enabled: true
    otlp:
      receiver:
        protocols:
          grpc:
            enabled: true
            endpoint: 0.0.0.0:4317
    # No generic prometheus.io/* scraping: every series it sends is a billed custom metric,
    # and it duplicated the Flux and cert-manager integrations. Official integrations below.
  override:
    nodeAgent:
      extraConfd:
        configDataMap:
          # Official integrations whose auto-config does not match k3s's rancher/mirrored-*
          # images (autodiscovery matches on the short image name).
          coredns.yaml: |-
            ad_identifiers:
              - mirrored-coredns-coredns
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:9153/metrics
          # Traefik proxy metrics (entry points, services, TLS certs, config reloads) as
          # traefik_mesh.*: the Traefik Mesh integration reads a plain Traefik proxy.
          traefik_mesh.yaml: |-
            ad_identifiers:
              - mirrored-library-traefik
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:9100/metrics
          # Flux controllers' Prometheus metrics -> Datadog Flux integration (fluxcd.*,
          # out-of-the-box "Flux" dashboard). Matched by image name, scraped on each node.
          fluxcd.yaml: |-
            ad_identifiers:
              - source-controller
              - kustomize-controller
              - helm-controller
              - notification-controller
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:8080/metrics
# Read access to the Flux objects of the custom resource metrics above, held by the
# OPERATOR: it adds these rules to the kube-state-metrics role, and Kubernetes only lets
# it grant permissions it holds itself (otherwise its whole reconcile fails).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-ksm-flux
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-ksm-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-ksm-flux
subjects:
  - kind: ServiceAccount
    name: datadog-operator
    namespace: datadog
