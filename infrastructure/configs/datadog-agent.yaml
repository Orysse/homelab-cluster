# Same site and cluster tag as the nuc1 host agent (cluster-vars) so both correlate.
---
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    site: ${DD_SITE}
    clusterName: ${CLUSTER_NAME}
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    tags:
      - cluster:${CLUSTER_NAME}
    # k3s: embedded containerd, self-signed kubelet certificate.
    criSocketPath: /run/k3s/containerd/containerd.sock
    kubelet:
      tlsVerify: false
  features:
    logCollection:
      enabled: true
      containerCollectAll: true
    liveContainerCollection:
      enabled: true
    liveProcessCollection:
      enabled: true
    orchestratorExplorer:
      enabled: true
    kubeStateMetricsCore:
      enabled: true
    eventCollection:
      collectKubernetesEvents: true
    clusterChecks:
      enabled: true
    prometheusScrape:              # annotations prometheus.io/* (Traefik, MetalLB…)
      enabled: true
      enableServiceEndpoints: true
  override:
    nodeAgent:
      extraConfd:
        configDataMap:
          # Flux controllers' Prometheus metrics -> Datadog Flux integration (fluxcd.*,
          # out-of-the-box "Flux" dashboard). Matched by image name, scraped on each node.
          fluxcd.yaml: |-
            ad_identifiers:
              - source-controller
              - kustomize-controller
              - helm-controller
              - notification-controller
            init_config:
            instances:
              - openmetrics_endpoint: http://%%host%%:8080/metrics
