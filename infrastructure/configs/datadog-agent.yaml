# Même site et même tag cluster que l'agent du host nuc1 (cluster-vars) pour corréler.
---
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    site: ${DD_SITE}
    clusterName: ${CLUSTER_NAME}
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    tags:
      - cluster:${CLUSTER_NAME}
    # k3s : containerd embarqué, certificat kubelet auto-signé.
    criSocketPath: /run/k3s/containerd/containerd.sock
    kubelet:
      tlsVerify: false
  features:
    logCollection:
      enabled: true
      containerCollectAll: true
    liveContainerCollection:
      enabled: true
    liveProcessCollection:
      enabled: true
    orchestratorExplorer:
      enabled: true
    kubeStateMetricsCore:
      enabled: true
    eventCollection:
      collectKubernetesEvents: true
    clusterChecks:
      enabled: true
    prometheusScrape:              # annotations prometheus.io/* (Traefik, MetalLB…)
      enabled: true
      enableServiceEndpoints: true
