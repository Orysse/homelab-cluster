# Headlamp at k8s.${DOMAIN}: Kubernetes web console. People log in through Pocket-ID and
# Headlamp calls the API with THEIR token, so their RBAC applies (oidc-rbac.yaml).
# Headlamp itself has no rights. Its OIDC client is adopted from v2 by id: the API server
# trusts that id (homelab-nix topology oidc.audiences).
---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  labels:
    gateway-access: public
    pod-security.kubernetes.io/enforce: restricted
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: headlamp
automountServiceAccountToken: false
---
# The operator writes the credentials Secret with the key names the chart reads.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: headlamp
  namespace: headlamp
spec:
  clientID: da937e7f-357b-4310-831e-d09dfe89aa8c
  pkceEnabled: true
  callbackUrls: ["https://k8s.${DOMAIN}/oidc-callback"]
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
    - { name: visitors, namespace: pocket-id }
  launchUrl: https://k8s.${DOMAIN}
  secret:
    name: headlamp-oidc
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER_URL
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
  values:
    config:
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
    # Not passed by the chart in this mode: Headlamp's own environment settings.
    env:
      - { name: HEADLAMP_CONFIG_OIDC_SCOPES, value: "profile,email,groups" }
      - { name: HEADLAMP_CONFIG_OIDC_CALLBACK_URL, value: "https://k8s.${DOMAIN}/oidc-callback" }
      - { name: HEADLAMP_CONFIG_OIDC_USE_PKCE, value: "true" }
    clusterRoleBinding:
      create: false           # no rights of its own: users' tokens are used
    securityContext:          # Pod Security "restricted"
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true   # the chart then mounts an emptyDir on /tmp
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
    - { name: public, namespace: gateway, sectionName: https }
  hostnames:
    - k8s.${DOMAIN}
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
