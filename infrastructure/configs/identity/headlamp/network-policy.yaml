# Headlamp: reached through the public Gateway; reaches the API server (with the user's
# token) and Pocket-ID (auth.${DOMAIN}, through the public Gateway).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp
  namespace: headlamp
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "4466", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
    - toFQDNs:
        - matchName: auth.${DOMAIN}
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
    - toEntities: [ingress]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
