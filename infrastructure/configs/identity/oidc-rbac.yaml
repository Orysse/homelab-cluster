# Kubernetes rights of people logging in through Pocket-ID (API server config: homelab-nix
# modules/k3s/node.nix, users and groups prefixed "oidc:", audiences in its topology).
# Pocket-ID group "admins": cluster-admin; "visitors": view (below).
# The OIDC client kubectl uses (kubelogin) is declared here too; its id is pinned because the
# API server trusts it by id.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:admins
---
# Pocket-ID group "visitors": read-only ("view": no Secrets, no exec, no port-forward), for
# showing the homelab off through Headlamp or kubectl. They reach the API over Tailscale.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-visitors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:visitors
---
# "view" covers only the CRDs whose charts add themselves to it (Flux, cert-manager...): the
# network side too, the interesting part of a tour. Nothing secret in these.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: view-network
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [cilium.io, gateway.networking.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
# kubectl's client (kubelogin): public, PKCE, no secret. Adopted from v2 by its id.
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kubernetes
  namespace: pocket-id
spec:
  clientID: 46031658-1b1a-4d3b-8bfa-82dfaf67d4c4
  isPublic: true
  pkceEnabled: true
  callbackUrls:
    - http://localhost:8000
    - http://localhost:18000
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
    - { name: visitors, namespace: pocket-id }
  secret:
    enabled: false
