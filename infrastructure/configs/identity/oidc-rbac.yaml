# Kubernetes rights of people logging in through Pocket-ID (API server config: homelab-nix
# modules/k3s/node.nix, users and groups prefixed "oidc:").
# Pocket-ID group "admins": cluster-admin; "visitors": view (below).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:admins
---
# Pocket-ID group "visitors": read-only ("view": no Secrets, no exec, no port-forward), for
# showing the homelab off through Headlamp or kubectl. They reach the API over Tailscale.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-visitors
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:visitors
---
# "view" covers only the CRDs whose charts add themselves to it (Flux, cert-manager...): the
# network side too, the interesting part of a tour. Nothing secret in these.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: view-network
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: [cilium.io, gateway.networking.k8s.io, traefik.io, metallb.io]
    resources: ["*"]
    verbs: [get, list, watch]
