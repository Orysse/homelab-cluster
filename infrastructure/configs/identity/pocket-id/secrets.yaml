# Pocket-ID's secrets, in OpenBao under kv/apps/pocket-id/ (only this namespace reads them):
#   encryption  key        generated in the cluster once (secrets/password-generator.yaml),
#                          never seen by anyone; it encrypts Pocket-ID's signing keys
#   smtp        password   the Brevo SMTP key (relay for homelab@${DOMAIN}), written by hand
#   db          username, password   from CloudNativePG (postgres/databases/pocket-id.yaml)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: encryption-generated
  namespace: pocket-id
spec:
  refreshInterval: "0"
  target:
    name: encryption-generated
    template:
      data:
        key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: encryption
  namespace: pocket-id
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: encryption-generated }
  data:
    - match:
        remoteRef: { remoteKey: pocket-id/encryption }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: pocket-id }
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef: { key: pocket-id/encryption, property: key }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: pocket-id/smtp, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-db
  namespace: pocket-id
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: pocket-id-db
    template:
      data:
        url: "postgres://{{ .username }}:{{ .password | urlquery }}@main-rw.postgres.svc.cluster.local:5432/pocket-id?sslmode=require"
  dataFrom:
    - extract: { key: pocket-id/db }
