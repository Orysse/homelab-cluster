apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - metallb-pool.yaml
  - traefik.yaml
  # HTTPS : token Cloudflare (sops) -> émetteurs Let's Encrypt -> certificat wildcard
  - cloudflare-api-token.sops.yaml
  - cluster-issuers.yaml
  - certificate.yaml
  # Observabilité : clé API (sops) -> agent Datadog (operator)
  - datadog-secret.sops.yaml
  - datadog-agent.yaml
