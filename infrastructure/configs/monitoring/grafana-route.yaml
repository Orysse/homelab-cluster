# grafana.int.${DOMAIN}, LAN and VPN only.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - grafana.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: grafana
          port: 80
