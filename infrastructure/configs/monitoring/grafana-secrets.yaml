# Grafana's PostgreSQL credentials: OpenBao static role "monitoring" (namespace name),
# read with this namespace's own ServiceAccount (openbao/database.yaml).
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres
  namespace: monitoring
spec:
  method: GET
  path: database/postgres/static-creds/monitoring
  provider:
    server: http://openbao.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: namespace-secrets
        serviceAccountRef:
          name: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  refreshInterval: 1h
  target:
    name: grafana-db
    template:
      engineVersion: v2
      data:
        GF_DATABASE_TYPE: postgres
        GF_DATABASE_HOST: "${DATABASE_ADDRESS}:5432"
        GF_DATABASE_NAME: monitoring
        GF_DATABASE_USER: "{{ .username }}"
        GF_DATABASE_PASSWORD__FILE: /etc/secrets/grafana/db-password   # grafana-files below
        GF_DATABASE_SSL_MODE: disable
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
---
# Grafana's OIDC client at Pocket-ID ("grafana"), created in Pocket-ID's UI; id and secret
# in OpenBao at kv/apps/monitoring/oidc.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: grafana-oidc
    template:
      engineVersion: v2
      data:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .client_id }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /etc/secrets/grafana/oauth-client-secret
  data:
    - secretKey: client_id
      remoteRef: { key: monitoring/oidc, property: client_id }
---
# The two secret values, mounted as files (Grafana reads GF_..._FILE, the Umami data source
# $__file{...}) so that they are not in its environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-files
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: grafana-files
    template:
      engineVersion: v2
      data:
        db-password: "{{ .password }}"
        oauth-client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef: { key: monitoring/oidc, property: client_secret }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
