# Grafana: dashboards only, everything provisioned from here (datasources, dashboards), so
# it keeps nothing: SQLite on an emptyDir, rebuilt at every start.
# Metrics and logs live on the monitoring host; alerts are NOT evaluated here but by
# vmalert + Alertmanager on that host, so they still fire when the cluster is down.
# Login: Pocket-ID ("admins" = Grafana Admin, everyone else Viewer). Dashboards: ours
# (dashboards/, generated from .jq) and grafana.com ids at pinned revisions.
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
  namespace: monitoring
spec:
  callbackUrls: ["https://grafana.int.${DOMAIN}/login/generic_oauth"]
  pkceEnabled: true
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
    - { name: visitors, namespace: pocket-id }
  launchUrl: https://grafana.int.${DOMAIN}
  secret:
    name: grafana-oidc
    keys:
      clientID: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      clientSecret: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "14.2.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    testFramework:
      enabled: false
    automountServiceAccountToken: false   # no sidecar talks to the API: dashboards come from ConfigMaps
    persistence:
      enabled: false
    envFromSecrets:
      - name: grafana-oidc      # GF_AUTH_GENERIC_OAUTH_CLIENT_ID/_SECRET (Pocket-ID operator)
    # First start (plugin download) is slow on the capped CPU.
    startupProbe:
      httpGet: { path: /api/health, port: grafana }
      periodSeconds: 10
      failureThreshold: 60
    resources:
      # The request is what it really uses after start (~500 Mi), so the scheduler only puts
      # it where that fits: at 128Mi it landed on full nodes and pushed them over (2026-10-11).
      requests: { cpu: 20m, memory: 512Mi }
      limits: { memory: 768Mi }
    plugins:
      - victoriametrics-logs-datasource@0.32.0
    grafana.ini:
      server:
        root_url: https://grafana.int.${DOMAIN}/
      users:
        allow_sign_up: false
      analytics:
        reporting_enabled: false
        check_for_updates: false
      unified_alerting:
        enabled: false        # alerting lives in Alertmanager (monitoring host)
      # No local login: Pocket-ID only. Break-glass: the chart's admin password, generated in
      # the cluster: kubectl -n monitoring get secret grafana -o jsonpath='{.data.admin-password}'
      auth:
        disable_login_form: true
      auth.basic:
        enabled: false
      auth.generic_oauth:
        enabled: true
        name: Pocket-ID
        allow_sign_up: true
        auto_login: true
        use_pkce: true
        scopes: openid profile email groups
        auth_url: https://auth.${DOMAIN}/authorize
        token_url: https://auth.${DOMAIN}/api/oidc/token
        api_url: https://auth.${DOMAIN}/api/oidc/userinfo
        login_attribute_path: preferred_username
        email_attribute_path: email
        groups_attribute_path: groups
        role_attribute_path: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
        allow_assign_grafana_admin: true
        role_attribute_strict: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            url: http://${MONITORING_ADDRESS}:8428
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            url: http://${MONITORING_ADDRESS}:9428
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            url: http://${MONITORING_ADDRESS}:9093
            jsonData:
              implementation: prometheus
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          # Ours (dashboards/, one ConfigMap, Flux substitution off).
          - name: homelab
            folder: Homelab
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/homelab
          - name: community
            folder: Détails
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/community
    dashboardsConfigMaps:
      homelab: grafana-dashboards-homelab
    dashboards:
      community:
        node-exporter:
          gnetId: 1860
          revision: 45
          datasource: VictoriaMetrics
        kubernetes-global:
          gnetId: 15757
          revision: 43
          datasource: VictoriaMetrics
        kubernetes-namespaces:
          gnetId: 15758
          revision: 46
          datasource: VictoriaMetrics
        kubernetes-nodes:
          gnetId: 15759
          revision: 40
          datasource: VictoriaMetrics
        kubernetes-pods:
          gnetId: 15760
          revision: 41
          datasource: VictoriaMetrics
        cilium-agent:
          gnetId: 16611
          revision: 1
          datasource: VictoriaMetrics
        cilium-operator:
          gnetId: 16612
          revision: 1
          datasource: VictoriaMetrics
        hubble:
          gnetId: 16613
          revision: 1
          datasource: VictoriaMetrics
        cloudnative-pg:
          gnetId: 20417
          revision: 4
          datasource: VictoriaMetrics
        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/cluster.json
          datasource: VictoriaMetrics
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/control-plane.json
          datasource: VictoriaMetrics
