# Grafana: dashboards only, everything provisioned from here. Its database is PostgreSQL
# "monitoring" on the database host (credentials from OpenBao, grafana-secrets.yaml): the pod
# keeps nothing.
# Metrics and logs live on the monitoring host; alerts are NOT evaluated here but by
# vmalert + Alertmanager on that host, so they still fire when the cluster is down.
# Login: Pocket-ID (group "admins" = Grafana Admin). Dashboards: grafana.com ids at pinned revisions.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "14.0.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    testFramework:
      enabled: false
    automountServiceAccountToken: false   # no sidecar talks to the API: dashboards come from ConfigMaps
    persistence:
      enabled: false
    envFromSecrets:             # grafana-secrets.yaml (from OpenBao): settings and file paths
      - name: grafana-db        # GF_DATABASE_*
      - name: grafana-oidc      # GF_AUTH_GENERIC_OAUTH_CLIENT_ID
    extraSecretMounts:          # the secret values themselves, as files
      - name: grafana-files
        secretName: grafana-files
        mountPath: /etc/secrets/grafana
        readOnly: true
    # First start (database migrations, plugin download) is slow on the capped CPU: up to
    # 10 minutes before the liveness probe takes over.
    startupProbe:
      httpGet: { path: /api/health, port: grafana }
      periodSeconds: 10
      failureThreshold: 60
    deploymentStrategy:
      type: Recreate          # one pod at a time: no two schema migrations in parallel
    resources:
      # The request is what it really uses after start (~500 Mi), so the scheduler only puts
      # it where that fits: at 128Mi it landed on full nodes and pushed them over (2026-10-11).
      requests: { cpu: 20m, memory: 512Mi }
      limits: { memory: 768Mi }   # first start (migrations) peaks well above steady state
    plugins:
      - victoriametrics-logs-datasource@0.32.0
    grafana.ini:
      # Secret values from the mounted files (grafana-files); the rest of [database] comes
      # from the environment (grafana-db). This image ignores GF_*__FILE.
      database:
        password: $$__file{/etc/secrets/grafana/db-password}
      server:
        root_url: https://grafana.int.${DOMAIN}/
      users:
        allow_sign_up: false
      analytics:
        reporting_enabled: false
        check_for_updates: false
      unified_alerting:
        enabled: false        # alerting lives in Alertmanager (monitoring host)
      # No local login: Pocket-ID only. Break-glass: the chart's admin password, generated in
      # the cluster: kubectl -n monitoring get secret grafana -o jsonpath='{.data.admin-password}'
      auth:
        disable_login_form: true
      auth.basic:
        enabled: false
      # Login through Pocket-ID; its "admins" group is Grafana Admin, everyone else Viewer.
      auth.generic_oauth:
        enabled: true
        client_secret: $$__file{/etc/secrets/grafana/oauth-client-secret}
        name: Pocket-ID
        allow_sign_up: true
        auto_login: true
        use_pkce: true
        scopes: openid profile email groups
        auth_url: https://auth.${DOMAIN}/authorize
        token_url: https://auth.${DOMAIN}/api/oidc/token
        api_url: https://auth.${DOMAIN}/api/oidc/userinfo
        login_attribute_path: preferred_username
        email_attribute_path: email
        groups_attribute_path: groups
        role_attribute_path: "contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'"
        allow_assign_grafana_admin: true
        role_attribute_strict: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            url: http://${MONITORING_ADDRESS}:8428
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            url: http://${MONITORING_ADDRESS}:9428
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            url: http://${MONITORING_ADDRESS}:9093
            jsonData:
              implementation: prometheus
          # Umami's analytics, read straight from its database: Grafana's own PostgreSQL user
          # may SELECT website, website_event and session (homelab-nix topology:
          # database.readers), nothing else. $${...} and $$__file{...}: left for Grafana.
          - name: Umami
            uid: umami
            type: grafana-postgresql-datasource
            url: ${DATABASE_ADDRESS}:5432
            user: $${GF_DATABASE_USER}
            jsonData:
              database: umami
              sslmode: disable
              postgresVersion: 1800
            secureJsonData:
              password: $$__file{/etc/secrets/grafana/db-password}
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: homelab
            folder: Homelab
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/homelab
          # Our own dashboards (dashboards/, one ConfigMap, Flux substitution off).
          - name: sites
            folder: Sites
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/sites
          - name: sites-community
            folder: Sites
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/sites-community
          # Our own homelab dashboards (dashboards/, one ConfigMap): cost, vulnerabilities.
          - name: homelab-own
            folder: Homelab
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/homelab-own
    dashboardsConfigMaps:
      sites: grafana-dashboards-sites
      homelab-own: grafana-dashboards-homelab
    dashboards:
      sites-community:
        # Community Umami dashboard: hourly heatmap, 7-day moving averages, qualified sessions.
        umami-bi:
          gnetId: 24431
          revision: 1
          datasource:
            - { name: DS_UMAMI-POSTGRES, value: umami }
      homelab:
        node-exporter:
          gnetId: 1860
          revision: 45
          datasource: VictoriaMetrics
        kubernetes-global:
          gnetId: 15757
          revision: 43
          datasource: VictoriaMetrics
        kubernetes-namespaces:
          gnetId: 15758
          revision: 46
          datasource: VictoriaMetrics
        kubernetes-nodes:
          gnetId: 15759
          revision: 40
          datasource: VictoriaMetrics
        kubernetes-pods:
          gnetId: 15760
          revision: 41
          datasource: VictoriaMetrics
        traefik:
          gnetId: 17346
          revision: 9
          datasource: VictoriaMetrics
        cilium-agent:
          gnetId: 16611
          revision: 1
          datasource: VictoriaMetrics
        cilium-operator:
          gnetId: 16612
          revision: 1
          datasource: VictoriaMetrics
        hubble:
          gnetId: 16613
          revision: 1
          datasource: VictoriaMetrics
        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/cluster.json
          datasource: VictoriaMetrics
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/control-plane.json
          datasource: VictoriaMetrics
