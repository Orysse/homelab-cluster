# Grafana: dashboards only, nothing to keep (everything provisioned from here, no
# volume). Data on the monitoring host; alerts are NOT evaluated here but by vmalert +
# Alertmanager on that host, so they still fire when the cluster is down.
# Admin login: grafana-admin.sops.yaml. Dashboards: grafana.com ids at pinned revisions.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "13.4.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
  values:
    testFramework:
      enabled: false
    admin:
      existingSecret: grafana-admin
    persistence:
      enabled: false
    resources:
      requests: { cpu: 20m, memory: 128Mi }
      limits: { memory: 384Mi }
    plugins:
      - victoriametrics-logs-datasource@0.32.0
    grafana.ini:
      server:
        root_url: https://grafana.int.${DOMAIN}/
      users:
        allow_sign_up: false
      analytics:
        reporting_enabled: false
        check_for_updates: false
      unified_alerting:
        enabled: false        # alerting lives in Alertmanager (monitoring host)
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            url: http://${MONITORING_ADDRESS}:8428
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            url: http://${MONITORING_ADDRESS}:9428
          - name: Alertmanager
            uid: alertmanager
            type: alertmanager
            url: http://${MONITORING_ADDRESS}:9093
            jsonData:
              implementation: prometheus
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: homelab
            folder: Homelab
            type: file
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/homelab
    dashboards:
      homelab:
        node-exporter:
          gnetId: 1860
          revision: 45
          datasource: VictoriaMetrics
        kubernetes-global:
          gnetId: 15757
          revision: 43
          datasource: VictoriaMetrics
        kubernetes-namespaces:
          gnetId: 15758
          revision: 46
          datasource: VictoriaMetrics
        kubernetes-nodes:
          gnetId: 15759
          revision: 40
          datasource: VictoriaMetrics
        kubernetes-pods:
          gnetId: 15760
          revision: 41
          datasource: VictoriaMetrics
        traefik:
          gnetId: 17346
          revision: 9
          datasource: VictoriaMetrics
        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/cluster.json
          datasource: VictoriaMetrics
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/control-plane.json
          datasource: VictoriaMetrics
