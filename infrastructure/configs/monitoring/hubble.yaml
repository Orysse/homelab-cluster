# Hubble UI (Cilium's network flow viewer, installed by the base with Cilium) at
# hubble.int.${DOMAIN}, LAN/VPN only, Pocket-ID login (admins) through oauth2-proxy: it has
# none. The route lives in the oauth2-proxy namespace, next to its middlewares; a
# ReferenceGrant lets it point at the Service in kube-system.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: oauth2-proxy
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - hubble.int.${DOMAIN}
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef: { group: traefik.io, kind: Middleware, name: pocket-id }
        - type: ExtensionRef     # admins only: flows include visitors' public IPs
          extensionRef: { group: traefik.io, kind: Middleware, name: pocket-id-admins }
      backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: hubble-ui-from-oauth2-proxy
  namespace: kube-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: oauth2-proxy
  to:
    - group: ""
      kind: Service
      name: hubble-ui
