# Hubble UI (Cilium's network flow viewer, installed by the base with Cilium) at
# hubble.int.${DOMAIN}, LAN/VPN only: it has no login. The route lives here (namespace on
# the internal Gateway); a ReferenceGrant lets it point at the Service in kube-system.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: monitoring
spec:
  parentRefs:
    - name: internal
      namespace: kube-system
      sectionName: https
  hostnames:
    - hubble.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: hubble-ui-from-monitoring
  namespace: kube-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
  to:
    - group: ""
      kind: Service
      name: hubble-ui
