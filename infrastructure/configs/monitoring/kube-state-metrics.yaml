# Cluster object state (deployments, pods, nodes…) and Flux objects:
# gotk_resource_info{ready="True|False"} per Kustomization / HelmRelease / source,
# the config of fluxcd/flux2-monitoring-example (Flux 2 has no ready gauge of its own).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: "8.6.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 192Mi }
    rbac:
      extraRules:
        - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
          resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, kustomizations, helmreleases]
          verbs: [list, watch]
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind: { group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux Kustomization.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, lastAppliedRevision]
            - groupVersionKind: { group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRelease.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, history, "0", chartVersion]
            - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux GitRepository.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, artifact, revision]
            - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: The current state of a Flux HelmRepository.
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
