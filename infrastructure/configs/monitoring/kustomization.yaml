apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - namespace.yaml
  - alloy.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - grafana-secrets.yaml
  - grafana.yaml
  - grafana-route.yaml
  - hubble.yaml
# Our dashboards (Grafana: dashboardsConfigMaps). Their queries are full of $__timeFilter and
# $website: Flux must not substitute them. Fixed name: the chart refers to it.
configMapGenerator:
  - name: grafana-dashboards-sites
    namespace: monitoring
    files:
      - dashboards/umami.json
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
