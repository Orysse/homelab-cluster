apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - namespace.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - grafana-secrets.yaml
  - grafana.yaml
  - grafana-route.yaml
  - hubble.yaml
# Our dashboards (Grafana: dashboardsConfigMaps). Their queries are full of $__timeFilter:
# Flux must not substitute them. Fixed names: the chart refers to them.
# Each <name>.json is generated from <name>.jq (jq -n -f <name>.jq > <name>.json).
configMapGenerator:
  - name: grafana-dashboards-homelab
    namespace: monitoring
    files:
      - dashboards/vulnerabilities.json
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
