# The log collector; the log store (VictoriaLogs) runs on the monitoring host, below the
# cluster (homelab-nix modules/host/monitoring.nix).
# privileged: the OpenTelemetry Collector reads /var/log/pods (a hostPath).
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    gateway-access: internal
---
# The namespace's default account: pods that do not name one get no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: monitoring
automountServiceAccountToken: false
