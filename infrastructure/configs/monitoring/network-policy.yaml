# Grafana: reached through the internal Gateway; reaches DNS, the monitoring host
# (VictoriaMetrics, VictoriaLogs, Alertmanager) and HTTPS (Pocket-ID login, plugin and
# dashboard downloads at start).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "3000", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toCIDR: ["${MONITORING_ADDRESS}/32"]
      toPorts:
        - ports:
            - { port: "8428", protocol: TCP }
            - { port: "9428", protocol: TCP }
            - { port: "9093", protocol: TCP }
    - toEntities: [world, ingress]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
---
# The collector scrapes every pod and kubelet on its node and ships to the monitoring host;
# nothing reaches it but its own scrape (kubelet probes aside).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: otel-collector }
      toPorts: [{ ports: [{ port: "8888", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [cluster]
    - toCIDR: ["${MONITORING_ADDRESS}/32"]
      toPorts:
        - ports: [{ port: "8428", protocol: TCP }, { port: "9428", protocol: TCP }]
---
# kube-state-metrics: scraped by the collector, reads the API server.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: kube-state-metrics }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: otel-collector }
      toPorts: [{ ports: [{ port: "8080", protocol: TCP }, { port: "8081", protocol: TCP }] }]
  egress:
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
