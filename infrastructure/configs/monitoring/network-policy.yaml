# The collector reads its node's log files and the pod metadata (API server), and pushes the
# logs to VictoriaLogs on the monitoring host. Nothing reaches it (kubelet probes aside).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  enableDefaultDeny: { ingress: true, egress: true }
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
    - toCIDR: ["${MONITORING_ADDRESS}/32"]
      toPorts: [{ ports: [{ port: "9428", protocol: TCP }] }]
