# Each VM's own metrics (CPU, memory, disk, network), scraped by the Alloy on that node.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: "4.59.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9100"
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 64Mi }
