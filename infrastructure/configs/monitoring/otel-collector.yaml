# OpenTelemetry Collector, one per node (DaemonSet): everything on its own node only, so the
# load follows the pods. ADR 0007.
# Logs only: every container's log file, Kubernetes metadata attached -> VictoriaLogs (OTLP).
# No metrics (D35 in homelab-nix: Beszel watches the hosts).
#
# Flux does not substitute this HelmRelease; the addresses come from collector-env.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-env
  namespace: monitoring
data:
  MONITORING_ADDRESS: ${MONITORING_ADDRESS}
  CLUSTER_NAME: ${CLUSTER_NAME}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: monitoring
spec:
  interval: 24h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: monitoring
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.180.0"    # collector 0.162.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  values:
    mode: daemonset
    nameOverride: otel-collector
    fullnameOverride: otel-collector
    image:
      repository: otel/opentelemetry-collector-k8s
    command:
      name: otelcol-k8s
    extraEnvs:
      - name: K8S_NODE_NAME
        valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
    extraEnvsFrom:
      - configMapRef: { name: collector-env }
    # Reads /var/log/pods (root-owned): root, no capability, read-only mounts. Read
    # positions survive restarts in /var/lib/otel-collector on the node.
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
    extraVolumes:
      - name: pods-logs
        hostPath: { path: /var/log/pods }
      - name: state
        hostPath: { path: /var/lib/otel-collector, type: DirectoryOrCreate }
    extraVolumeMounts:
      - { name: pods-logs, mountPath: /var/log/pods, readOnly: true }
      - { name: state, mountPath: /var/lib/otel-collector }
    clusterRole:
      create: true
      rules:
        - apiGroups: [""]
          resources: [pods]
          verbs: [get, list, watch]
    ports:
      otlp: { enabled: false }
      otlp-http: { enabled: false }
      jaeger-compact: { enabled: false }
      jaeger-thrift: { enabled: false }
      jaeger-grpc: { enabled: false }
      zipkin: { enabled: false }
      metrics: { enabled: true }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
    alternateConfig:
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
        file_storage:
          directory: /var/lib/otel-collector

      receivers:
        filelog:
          include: [/var/log/pods/*/*/*.log]
          start_at: end
          include_file_path: true
          storage: file_storage
          operators:
            - type: container      # CRI format; namespace, pod, container from the path

      processors:
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch: {}
        k8sattributes:
          filter:
            node_from_env_var: K8S_NODE_NAME
          pod_association:
            - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
          extract:
            metadata: []
            labels:
              - { tag_name: app, key: app.kubernetes.io/name, from: pod }
        # Log fields as before: namespace, pod, container, app, node, cluster.
        transform/logs:
          log_statements:
            - context: resource
              statements:
                - set(attributes["namespace"], attributes["k8s.namespace.name"])
                - set(attributes["pod"], attributes["k8s.pod.name"])
                - set(attributes["container"], attributes["k8s.container.name"])
                - set(attributes["node"], "${env:K8S_NODE_NAME}")
                - set(attributes["cluster"], "${env:CLUSTER_NAME}")
                - keep_keys(attributes, ["namespace", "pod", "container", "app", "node", "cluster"])

      exporters:
        otlphttp/victorialogs:
          logs_endpoint: http://${env:MONITORING_ADDRESS}:9428/insert/opentelemetry/v1/logs
          compression: gzip
          headers:
            VL-Stream-Fields: namespace,pod,container

      service:
        extensions: [health_check, file_storage]
        telemetry:
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus: { host: 0.0.0.0, port: 8888 }
        pipelines:
          logs:
            receivers: [filelog]
            processors: [memory_limiter, k8sattributes, transform/logs, batch]
            exporters: [otlphttp/victorialogs]
