# Certificates the Gateways serve (gateways.yaml), in the Gateways' namespace: apps need
# nothing to be served over HTTPS.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: gateway
spec:
  secretName: wildcard-tls
  dnsNames:
    - ${DOMAIN}
    - "*.${DOMAIN}"
    - "*.int.${DOMAIN}"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
# holive.fr (apps/holive): a second zone in the same Cloudflare account, so the same DNS-01
# token (it must list the holive.fr zone too). Served by its own listeners.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: holive
  namespace: gateway
spec:
  secretName: holive-tls
  dnsNames:
    - holive.fr
    - "*.holive.fr"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
