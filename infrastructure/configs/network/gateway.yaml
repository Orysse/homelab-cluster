# Gateway API entry points. An app attaches an HTTPRoute to one of them and labels its
# namespace accordingly:
#   public   (gateway-access=public)    any host, Internet-facing (${INGRESS_ADDRESS})
#   internal (gateway-access=internal)  *.int.${DOMAIN}, LAN and VPN only (${INTERNAL_ADDRESS})
#   both     (gateway-access=both)      an app with a public part and an internal admin UI
# TLS: the wildcard certificate. HTTP->HTTPS redirect and security headers are applied by
# Traefik's entry points (traefik.yaml).
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: kube-system          # same namespace as Traefik and the wildcard certificate
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      protocol: HTTPS
      port: 8443                  # must match Traefik's websecure entry point
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [public, both] }
    # holive.fr: its own certificate, chosen by SNI (the wildcard covers only ${DOMAIN}).
    - name: holive
      protocol: HTTPS
      port: 8443
      hostname: holive.fr
      tls:
        mode: Terminate
        certificateRefs:
          - name: holive-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: holive }
    - name: holive-www
      protocol: HTTPS
      port: 8443
      hostname: www.holive.fr
      tls:
        mode: Terminate
        certificateRefs:
          - name: holive-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: holive }

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: kube-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      protocol: HTTPS
      port: 9443                  # must match Traefik's internal entry point
      hostname: "*.int.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [internal, both] }
