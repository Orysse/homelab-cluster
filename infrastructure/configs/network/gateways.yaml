# Entry points, served by Cilium's Envoy (no ingress controller). An app attaches an
# HTTPRoute to one of them, and labels its namespace (internal: sectionName https; public: the
# listener of its host, one per public host):
#   public   (gateway-access=public)    listed hosts, Internet-facing (${INGRESS_ADDRESS})
#   internal (gateway-access=internal)  *.int.${DOMAIN}, LAN and VPN only (${INTERNAL_ADDRESS})
#   both     (gateway-access=both)      an app with a public part and an internal admin UI
# TLS: the wildcard certificate (certificates.yaml). Plain HTTP only redirects to HTTPS.
# Security headers: each app's route sets them (Gateway API has no gateway-wide filter).
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium
    namespace: gateway
---
# Access log of every request, on the cilium-envoy pods' stdout, in nginx's "combined"
# format: CrowdSec's maintained nginx parser reads it as is (ADR 0003), and the same lines
# go to VictoriaLogs.
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium
  namespace: gateway
spec:
  telemetry:
    accessLogs:
      - format: Text
        text: |
          %DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% - - [%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %BYTES_SENT% "%REQ(REFERER)%" "%REQ(USER-AGENT)%"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
spec:
  gatewayClassName: cilium
  # Pinned: the router forwards 80/443 here.
  addresses:
    - { type: IPAddress, value: "${INGRESS_ADDRESS}" }
  listeners:
    # One HTTPS listener per public host rather than a wildcard one: Cilium rejects a TLS
    # passthrough listener (Headscale, below) whose hostname overlaps an HTTPS listener on
    # the same port (ProtocolConflict). A new public app adds its listener here.
    - name: apex
      protocol: HTTPS
      port: 443
      hostname: ${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [public, both] }
    - name: status
      protocol: HTTPS
      port: 443
      hostname: status.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [public, both] }
    - name: chat
      protocol: HTTPS
      port: 443
      hostname: chat.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [public, both] }
    - name: auth
      protocol: HTTPS
      port: 443
      hostname: auth.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [public, both] }
    - name: k8s
      protocol: HTTPS
      port: 443
      hostname: k8s.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [public, both] }
    - name: vitrine
      protocol: HTTPS
      port: 443
      hostname: vitrine.${DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [public, both] }
    # holive.fr: its own certificate, chosen by SNI (the wildcard covers only ${DOMAIN}).
    - name: holive
      protocol: HTTPS
      port: 443
      hostname: holive.fr
      tls:
        mode: Terminate
        certificateRefs:
          - name: holive-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: holive }
    - name: holive-www
      protocol: HTTPS
      port: 443
      hostname: www.holive.fr
      tls:
        mode: Terminate
        certificateRefs:
          - name: holive-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: holive }
    # Headscale: TLS passthrough, it terminates TLS itself. Envoy's HTTP upgrade config
    # refuses the Tailscale control protocol (403 on /ts2021: only websocket upgrades pass).
    # Cilium rejects it next to a wildcard HTTPS listener (hence the per-host listeners above).
    - name: headscale
      protocol: TLS
      port: 443
      hostname: hs.${DOMAIN}
      tls:
        mode: Passthrough
      allowedRoutes:
        kinds: [{ kind: TLSRoute }]
        namespaces:
          from: Selector
          selector:
            matchLabels: { kubernetes.io/metadata.name: headscale }
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - { type: IPAddress, value: "${INTERNAL_ADDRESS}" }
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.int.${DOMAIN}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - { key: gateway-access, operator: In, values: [internal, both] }
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.int.${DOMAIN}"
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - { name: public, sectionName: http }
    - { name: internal, sectionName: http }
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
