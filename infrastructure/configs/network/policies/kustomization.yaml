apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Network policies of the platform namespaces (the apps keep theirs next to them).
# Pods on the host network (Cilium, node-exporter, NFS CSI) are not Cilium endpoints:
# policies do not apply to them.
resources:
  - flux-system.yaml
  - cert-manager.yaml
  - external-secrets.yaml
  - kube-system.yaml
