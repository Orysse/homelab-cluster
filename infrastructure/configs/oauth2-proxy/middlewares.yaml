# The forward-auth middlewares. A route can only use a middleware from its own namespace,
# and Traefik reads them from kube-system and oauth2-proxy only (traefik.yaml): protected
# HTTPRoutes therefore live in this namespace (monitoring/hubble.yaml, apps/opencost).
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pocket-id
  namespace: kube-system          # the Traefik dashboard (traefik.yaml)
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pocket-id
  namespace: oauth2-proxy         # the HTTPRoutes here
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/
    trustForwardHeader: true
    authResponseHeaders: [X-Auth-Request-User, X-Auth-Request-Email]
---
# Admins only, after "pocket-id" (which handles the login redirect): Hubble shows every flow,
# including the public IPs of the sites' visitors. A visitor gets a 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pocket-id-admins
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth?allowed_groups=admins
    trustForwardHeader: true
