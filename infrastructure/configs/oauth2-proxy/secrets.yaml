# oauth2-proxy's secrets, from OpenBao (only this namespace can read kv/apps/oauth2-proxy/*):
#   oidc    client_id client_secret   Pocket-ID client "oauth2-proxy", written by hand
#   cookie  secret                    signs the session cookie, generated here, never seen
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: cookie
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/oauth2-proxy
  isKVSecretsEngineV2: true
  secretKey: secret
  kvSecretRetainPolicy: Retain
  secretFormat:
    inlinePasswordPolicy: |       # 32 bytes: an AES-256 key for the cookie
      length = 32
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: oauth2-proxy }
  data:
    - secretKey: client_id
      remoteRef: { key: oauth2-proxy/oidc, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: oauth2-proxy/oidc, property: client_secret }
    - secretKey: cookie_secret
      remoteRef: { key: oauth2-proxy/cookie, property: secret }
