# Pocket-ID: reached by Traefik only (every client, in or out of the cluster, comes through
# auth.${DOMAIN}); reaches DNS, its PostgreSQL and the SMTP server (invitations).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, app.kubernetes.io/name: traefik }
      toPorts: [{ ports: [{ port: "1411", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toCIDR: ["${DATABASE_ADDRESS}/32"]
      toPorts: [{ ports: [{ port: "5432", protocol: TCP }] }]
    - toEntities: [world]
      toPorts: [{ ports: [{ port: "465", protocol: TCP }] }]
