# Pocket-ID at auth.${DOMAIN}: the homelab's identity provider (passkeys, OIDC).
# Everything is configured here (UI_CONFIG_DISABLED): the admin UI manages users, groups
# and OIDC clients, not settings. Users get an invitation email from homelab@${DOMAIN}.
# State (users, passkeys, clients) in SQLite on an NFS volume: storage host, snapshots.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id
  labels:
    gateway-access: public
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: pocket-id
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  replicas: 1
  strategy:
    type: Recreate                # SQLite on a ReadWriteOnce volume
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.18.0-distroless
          envFrom:
            - secretRef:
                name: pocket-id   # ENCRYPTION_KEY, SMTP_PASSWORD (from OpenBao)
          env:
            - { name: APP_URL, value: "https://auth.${DOMAIN}" }
            - { name: TRUST_PROXY, value: "10.42.0.0/16" }   # Traefik, from the pod network
            - { name: UI_CONFIG_DISABLED, value: "true" }
            - { name: APP_NAME, value: "${DOMAIN}" }
            - { name: SESSION_DURATION, value: "480" }       # minutes
            - { name: ALLOW_USER_SIGNUPS, value: "disabled" } # admins create users and invite them
            - { name: ANALYTICS_DISABLED, value: "true" }
            - { name: VERSION_CHECK_DISABLED, value: "true" } # Renovate handles updates
            - { name: SMTP_HOST, value: smtp.mail.ovh.net }
            - { name: SMTP_PORT, value: "465" }
            - { name: SMTP_TLS, value: tls }
            - { name: SMTP_USER, value: "homelab@${DOMAIN}" }
            - { name: SMTP_FROM, value: "homelab@${DOMAIN}" }
            # Invitations / login links sent by an admin (new user, lost device).
            - { name: EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED, value: "true" }
            # Fallback for people without a usable passkey: a code by email. Their
            # account is then only as safe as their mailbox.
            - { name: EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED, value: "true" }
            - { name: EMAIL_LOGIN_NOTIFICATION_ENABLED, value: "true" }
          ports:
            - { name: http, containerPort: 1411 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  selector:
    app.kubernetes.io/name: pocket-id
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  parentRefs:
    - name: public
      namespace: kube-system
      sectionName: https
  hostnames:
    - auth.${DOMAIN}
  rules:
    - backendRefs:
        - name: pocket-id
          port: 80
