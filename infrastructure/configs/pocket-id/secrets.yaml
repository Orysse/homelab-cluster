# Pocket-ID's secrets live in OpenBao, under kv/apps/pocket-id/ (only this namespace
# can read them):
#   encryption  key       generated here by vault-config-operator, never seen by anyone
#   smtp        password  the homelab@${DOMAIN} mailbox password, written by hand in the
#                         OpenBao UI (the one value only a human has)
# and its PostgreSQL credentials (static role, never written anywhere else).
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: encryption
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/pocket-id
  isKVSecretsEngineV2: true
  secretKey: key
  kvSecretRetainPolicy: Retain    # deleting this object must not lose the key (it encrypts Pocket-ID's signing keys)
  secretFormat:
    inlinePasswordPolicy: |
      length = 48
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: pocket-id }
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef: { key: pocket-id/encryption, property: key }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: pocket-id/smtp, property: password }
---
# This namespace's PostgreSQL credentials (OpenBao static role "pocket-id", openbao/database.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres
  namespace: pocket-id
spec:
  method: GET
  path: database/postgres/static-creds/pocket-id
  provider:
    server: http://openbao.openbao.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: namespace-secrets
        serviceAccountRef:
          name: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-db
  namespace: pocket-id
spec:
  refreshInterval: 1h
  target:
    name: pocket-id-db
    template:
      engineVersion: v2
      data:
        DB_CONNECTION_STRING: "postgres://{{ .username }}:{{ .password | urlquery }}@${DATABASE_ADDRESS}:5432/pocket-id?sslmode=disable"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres
