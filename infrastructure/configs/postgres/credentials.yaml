# How the apps' database credentials are made (databases/<app>.yaml):
#   1. a Password generator makes a candidate, once;
#   2. a PushSecret stores it in OpenBao at kv/apps/<app>/db, only if nothing is there;
#   3. an ExternalSecret reads kv/apps/<app>/db back: the Secret CloudNativePG sets on the
#      role. OpenBao is the source of truth, so recreating these objects never changes a
#      password, and the app reads the same entry through the cluster secret store.
# Writing into other namespaces' paths needs the OpenBao role postgres-writer (policy
# db-writer: kv/apps/+/db only), hence this namespace's own store and ServiceAccount.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-writer
  namespace: postgres
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-writer
  namespace: postgres
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv/apps
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgres-writer
          serviceAccountRef:
            name: openbao-writer
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: db-password
  namespace: postgres
spec:
  length: 40
  symbols: 0              # goes into connection URLs
  noUpper: false
  allowRepeat: true
