# pocket-id: its database in the cluster main, owned by the role pocket-id (cluster.yaml).
# The password: generated once, kept in OpenBao at kv/apps/pocket-id/db, read back from there
# (credentials.yaml). The app reads the same entry: username, password.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-db-generated
  namespace: postgres
spec:
  refreshInterval: "0"            # generated once
  target:
    name: pocket-id-db-generated
    template:
      data:
        username: pocket-id
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: db-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pocket-id-db
  namespace: postgres
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists       # never replaces what OpenBao holds
  secretStoreRefs:
    - { kind: SecretStore, name: openbao-writer }
  selector:
    secret: { name: pocket-id-db-generated }
  data:
    - match:
        remoteRef: { remoteKey: pocket-id/db }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-db
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: openbao-writer }
  target:
    name: pocket-id-db
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract: { key: pocket-id/db }
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: pocket-id
  namespace: postgres
spec:
  cluster: { name: main }
  name: pocket-id
  owner: pocket-id
