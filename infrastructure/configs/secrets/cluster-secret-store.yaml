# For every namespace: an ExternalSecret reads kv/apps/<its namespace>/<key> with the
# ServiceAccount "default" of its own namespace (referent authentication).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: kv/apps
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: namespace-secrets
          serviceAccountRef:
            name: default
