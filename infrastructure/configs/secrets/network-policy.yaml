# OpenBao: reached by External Secrets (apps' secrets), the Gateway (UI at bao.int) and the
# sso-config Job. It reaches the API server (Kubernetes auth reviews ServiceAccount tokens)
# and Pocket-ID (OIDC login).
# Pocket-ID is reached at auth.${DOMAIN}, through the public Gateway: from a pod that is
# Cilium's Envoy (entity ingress); world covers the address before Envoy takes it.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao
  namespace: openbao
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: openbao }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: external-secrets, app.kubernetes.io/name: external-secrets }
        - matchLabels: { app.kubernetes.io/name: sso-config }
      toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
    - fromEntities: [ingress]
      toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
    - toEntities: [ingress, world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
---
# sso-config Job: Pocket-ID's discovery document, then OpenBao.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sso-config
  namespace: openbao
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: sso-config }
  enableDefaultDeny: { ingress: true, egress: true }
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: openbao }
      toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
    - toEntities: [ingress, world]
      toPorts: [{ ports: [{ port: "443", protocol: TCP }] }]
