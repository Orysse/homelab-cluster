# OpenBao: the cluster's application secrets. Single node, data on NFS (the storage host),
# unsealed automatically with a static key from sops (unseal.sops.yaml). ADR 0005.
#
# Its whole configuration is the `initialize` blocks below, run once, on empty storage:
#   kv/apps                     KV v2; kv/apps/<namespace>/<name> holds a namespace's secrets
#   auth/kubernetes             role namespace-secrets: a namespace's "default" ServiceAccount
#                               reads and writes its own kv/apps/<namespace>/* (templated
#                               policy), nothing else; role postgres-writer: CloudNativePG's
#                               writer drops each app's database credentials in kv/apps/<ns>/db
#   auth/sso                    people: Pocket-ID group "admins" gets the admin policy; the
#                               client settings are written by the sso-config Job (sso.yaml)
# Nothing in these blocks may depend on another app: a failed request makes OpenBao refuse
# to unseal, for good. Adding an app needs nothing here. A change made later goes in two places: these blocks
# (so a rebuild reproduces it) and the running instance, by hand, as an admin.
#
# Break-glass (Pocket-ID down): no root token survives initialization, and the static seal
# has no recovery keys to generate one. A cluster-admin logs in as the break-glass
# ServiceAccount, which has the admin policy:
#   bao write auth/kubernetes/login role=break-glass jwt=$(kubectl -n openbao create token break-glass)
#
# In-cluster clients use plain HTTP on the service: pod traffic between nodes is already
# encrypted by Cilium's WireGuard. The UI is at bao.int.${DOMAIN} (LAN/VPN).
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
  labels:
    gateway-access: internal
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 24h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  chart:
    spec:
      chart: openbao
      version: "0.30.6"
      sourceRef:
        kind: HelmRepository
        name: openbao
  values:
    injector:
      enabled: false        # secrets reach pods through External Secrets instead
    ui:
      enabled: true
    server:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 256Mi }
      dataStorage:
        enabled: true
        size: 1Gi
        storageClass: nfs
      volumes:
        - name: unseal
          secret:
            secretName: openbao-unseal
        - name: tmp               # the entrypoint renders its storage config there
          emptyDir:
            sizeLimit: 16Mi
      volumeMounts:
        - name: unseal
          mountPath: /openbao/unseal
          readOnly: true
        - name: tmp
          mountPath: /tmp
      # The chart's defaults (non-root, no privilege escalation), plus a read-only root.
      statefulSet:
        securityContext:
          container:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      standalone:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable     = 1
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            telemetry {
              unauthenticated_metrics_access = true
            }
          }

          storage "pebbledb" {
            path = "/openbao/data/pebbledb"
          }

          seal "static" {
            current_key_id = "homelab-1"
            current_key    = "file:///openbao/unseal/unseal.key"
          }

          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname          = true
          }

          initialize "kv" {
            request "mount" {
              operation = "update"
              path      = "sys/mounts/kv/apps"
              data      = { type = "kv", options = { version = "2" } }
            }
          }

          # Names without "-": the policy templates below refer to them.
          initialize "kubeauth" {
            request "enable" {
              operation = "update"
              path      = "sys/auth/kubernetes"
              data      = { type = "kubernetes" }
            }
            request "configure" {
              operation = "update"
              path      = "auth/kubernetes/config"
              data      = { kubernetes_host = "https://kubernetes.default.svc" }
            }
            # The mount accessor, for the templated policy.
            request "read" {
              operation = "read"
              path      = "sys/auth/kubernetes"
            }
          }

          initialize "policies" {
            # A namespace reads and writes its own secrets (written: generated secrets pushed
            # once by a PushSecret), never another namespace's. No delete.
            request "namespacesecrets" {
              operation = "update"
              path      = "sys/policies/acl/namespace-secrets"
              data = {
                policy = {
                  eval_source = "template"
                  eval_type   = "string"
                  # Three template layers: Helm's tpl (a raw-string action, backquotes, passes the
                  # text through), OpenBao's self-init (.responses, the mount
                  # accessor), then the policy's own identity template, its braces escaped.
                  # External Secrets writes the metadata path too (managed-by marker).
                  template    = <<-EOT
                    {{`path "kv/apps/data/{{"{{"}}identity.entity.aliases.{{ .responses.kubeauth.read.data.accessor }}.metadata.service_account_namespace{{"}}"}}/*" {
                      capabilities = ["create", "read", "update"]
                    }
                    path "kv/apps/metadata/{{"{{"}}identity.entity.aliases.{{ .responses.kubeauth.read.data.accessor }}.metadata.service_account_namespace{{"}}"}}/*" {
                      capabilities = ["create", "read", "update", "list"]
                    }`}}
                  EOT
                }
              }
            }
            # CloudNativePG's database credentials, one per app namespace: stored once, then
            # read back (postgres/credentials.yaml). The postgres namespace holds them anyway.
            request "dbwriter" {
              operation = "update"
              path      = "sys/policies/acl/db-writer"
              data = {
                policy = <<-EOT
                  path "kv/apps/data/+/db"     { capabilities = ["create", "read", "update"] }
                  path "kv/apps/metadata/+/db" { capabilities = ["create", "read", "update"] }
                EOT
              }
            }
            # People: application secrets, and the configuration this file declares, so that
            # a later change can also be applied to the running instance.
            request "admin" {
              operation = "update"
              path      = "sys/policies/acl/admin"
              data = {
                policy = <<-EOT
                  path "kv/*"                    { capabilities = ["create", "read", "update", "delete", "list"] }
                  path "sys/mounts"              { capabilities = ["read", "list"] }
                  path "sys/mounts/*"            { capabilities = ["create", "read", "update", "list"] }
                  path "sys/auth"                { capabilities = ["read", "list"] }
                  path "sys/auth/*"              { capabilities = ["create", "read", "update", "list", "sudo"] }
                  path "sys/policies/acl"        { capabilities = ["read", "list"] }
                  path "sys/policies/acl/*"      { capabilities = ["create", "read", "update", "list"] }
                  path "auth/kubernetes/role"    { capabilities = ["read", "list"] }
                  path "auth/kubernetes/role/*"  { capabilities = ["create", "read", "update", "list"] }
                  path "auth/sso/*"              { capabilities = ["create", "read", "update", "list"] }
                EOT
              }
            }
            # The sso-config Job: the OIDC client settings, nothing else.
            request "ssoconfig" {
              operation = "update"
              path      = "sys/policies/acl/sso-config"
              data      = { policy = "path \"auth/sso/config\" { capabilities = [\"update\"] }" }
            }
          }

          initialize "roles" {
            request "namespacesecrets" {
              operation = "update"
              path      = "auth/kubernetes/role/namespace-secrets"
              data = {
                bound_service_account_names      = ["default"]
                bound_service_account_namespaces = ["*"]
                token_policies                   = ["namespace-secrets"]
                token_ttl                        = "1h"
              }
            }
            request "postgreswriter" {
              operation = "update"
              path      = "auth/kubernetes/role/postgres-writer"
              data = {
                bound_service_account_names      = ["openbao-writer"]
                bound_service_account_namespaces = ["postgres"]
                token_policies                   = ["db-writer"]
                token_ttl                        = "1h"
              }
            }
            # Break-glass (header): a ServiceAccount no pod uses.
            request "breakglass" {
              operation = "update"
              path      = "auth/kubernetes/role/break-glass"
              data = {
                bound_service_account_names      = ["break-glass"]
                bound_service_account_namespaces = ["openbao"]
                token_policies                   = ["admin"]
                token_ttl                        = "1h"
              }
            }
            request "ssoconfig" {
              operation = "update"
              path      = "auth/kubernetes/role/sso-config"
              data = {
                bound_service_account_names      = ["sso-config"]
                bound_service_account_namespaces = ["openbao"]
                token_policies                   = ["sso-config"]
                token_ttl                        = "5m"
              }
            }
          }

          # Human login through Pocket-ID: the mount and its role. The client id and secret
          # come later, from the sso-config Job (sso.yaml): a failed request here makes
          # OpenBao refuse to unseal, so nothing in these blocks may depend on another app.
          initialize "sso" {
            request "enable" {
              operation = "update"
              path      = "sys/auth/sso"
              data      = { type = "oidc", config = { listing_visibility = "unauth" } }
            }
            request "role" {
              operation = "update"
              path      = "auth/sso/role/admin"
              data = {
                role_type             = "oidc"
                user_claim            = "preferred_username"
                groups_claim          = "groups"
                bound_claims          = { groups = ["admins"] }
                oidc_scopes           = ["openid", "profile", "email", "groups"]
                allowed_redirect_uris = [
                  "https://bao.int.${DOMAIN}/ui/vault/auth/sso/oidc/callback",
                  "http://localhost:8250/oidc/callback",   # bao login -method=oidc -path=sso
                ]
                token_policies = ["admin"]
                token_ttl      = "8h"
              }
            }
          }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
spec:
  parentRefs:
    - { name: internal, namespace: gateway, sectionName: https }
  hostnames:
    - bao.int.${DOMAIN}
  rules:
    - backendRefs:
        - name: openbao
          port: 8200
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: break-glass             # role break-glass (header); no pod runs as it
  namespace: openbao
automountServiceAccountToken: false
