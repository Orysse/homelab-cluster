# Secrets nobody needs to see (encryption keys, database passwords) are generated in the
# cluster, once, and kept in OpenBao (ADR 0005):
#   ExternalSecret <name>-generated   generatorRef: ClusterGenerator password, refreshInterval "0"
#   PushSecret <name>                  to kv/apps/<ns>/<name>, updatePolicy IfNotExists
#   ExternalSecret <name>              reads kv/apps/<ns>/<name> back: what the app mounts
# OpenBao holds the value, so recreating any of the three never changes it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: password
spec:
  kind: Password
  generator:
    passwordSpec:
      length: 48
      symbols: 0              # safe in URLs and environment variables
      noUpper: false
      allowRepeat: true
