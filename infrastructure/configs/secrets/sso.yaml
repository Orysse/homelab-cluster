# People log in to OpenBao through Pocket-ID (auth.${DOMAIN}, group "admins"). The mount
# and its role come from OpenBao's self-initialization; the client settings cannot: writing
# them makes OpenBao fetch Pocket-ID's discovery document, and Pocket-ID starts after
# OpenBao (its secrets live there). So this Job writes them once Pocket-ID answers.
# Pocket-ID's operator creates the client and its Secret, openbao-oidc-credentials (ADR 0004).
# To apply a new client secret: delete the Job, Flux runs it again.
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: openbao
  namespace: openbao
spec:
  callbackUrls:
    - https://bao.int.${DOMAIN}/ui/vault/auth/sso/oidc/callback
    - http://localhost:8250/oidc/callback       # bao login -method=oidc -path=sso
  allowedUserGroups:
    - { name: admins, namespace: pocket-id }
  launchUrl: https://bao.int.${DOMAIN}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sso-config                # OpenBao role sso-config: update auth/sso/config only
  namespace: openbao
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sso-config
  namespace: openbao
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled    # a Job's template is immutable
spec:
  backoffLimit: 30
  template:
    metadata:
      labels: { app.kubernetes.io/name: sso-config }
    spec:
      serviceAccountName: sso-config
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sso-config
          image: quay.io/openbao/openbao:2.7.1
          env:
            - { name: BAO_ADDR, value: http://openbao.openbao.svc:8200 }
            - { name: HOME, value: /tmp }
          command: [sh, -ec]
          args:
            - |
              until wget -q -O /dev/null https://auth.${DOMAIN}/.well-known/openid-configuration; do
                echo "waiting for Pocket-ID"; sleep 10
              done
              export BAO_TOKEN="$(bao write -field=token auth/kubernetes/login role=sso-config \
                jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)"
              bao write auth/sso/config \
                oidc_discovery_url=https://auth.${DOMAIN} \
                oidc_client_id=@/oidc/client_id \
                oidc_client_secret=@/oidc/client_secret \
                default_role=admin
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: oidc, mountPath: /oidc, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Waits here (ContainerCreating) until Pocket-ID's operator has created it.
        - name: oidc
          secret: { secretName: openbao-oidc-credentials }
        - name: tmp
          emptyDir: { sizeLimit: 1Mi }
