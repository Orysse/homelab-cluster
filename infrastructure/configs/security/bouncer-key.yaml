# The key Traefik's bouncer uses to read decisions from the LAPI. Generated in OpenBao
# (kv/apps/crowdsec/bouncer), read by the LAPI (env BOUNCER_KEY_traefik registers the
# bouncer), and copied to kube-system for Traefik: a namespace can only read its own OpenBao
# path, so kube-system reads this one Kubernetes Secret instead (ESO kubernetes provider,
# with a Role limited to it).
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: RandomSecret
metadata:
  name: bouncer
  namespace: openbao              # where the operator's ServiceAccount is
spec:
  authentication: { path: kubernetes, role: config-operator, serviceAccount: { name: config-operator } }
  path: kv/apps/data/crowdsec
  isKVSecretsEngineV2: true
  secretKey: key
  kvSecretRetainPolicy: Retain
  secretFormat:
    inlinePasswordPolicy: |
      length = 48
      rule "charset" {
        charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
        min-chars = 1
      }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bouncer
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target: { name: bouncer }
  data:
    - secretKey: key
      remoteRef: { key: crowdsec/bouncer, property: key }
---
# kube-system's copy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-bouncer-reader
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bouncer-reader
  namespace: crowdsec
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [bouncer]
    verbs: [get, list, watch]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bouncer-reader
  namespace: crowdsec
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: bouncer-reader }
subjects:
  - { kind: ServiceAccount, name: crowdsec-bouncer-reader, namespace: kube-system }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: crowdsec
  namespace: kube-system
spec:
  provider:
    kubernetes:
      remoteNamespace: crowdsec
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: crowdsec-bouncer-reader }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-bouncer
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: crowdsec }
  target: { name: crowdsec-bouncer }
  data:
    - secretKey: key
      remoteRef: { key: bouncer, property: key }
