# CrowdSec: reads the Gateway's access log, detects scans and attacks (HTTP scenarios, known
# CVE probes) and shares/receives the community blocklist. ADR 0003.
#   agents  one per node (DaemonSet), reading the cilium-envoy pod's log on that node: the
#           Gateway's access log in nginx format (network/gateways.yaml)
#   LAPI    holds the decisions (bans); no volume: decisions last 4 h and the hub data is
#           downloaded again at start (SQLite on NFS would corrupt)
# The bouncer (bouncer.yaml) turns the decisions into CiliumCIDRGroups; Cilium drops the
# traffic before Envoy (deny-policy.yaml).
# `kubectl -n crowdsec exec deploy/crowdsec-lapi -- cscli decisions list` / `cscli alerts list`
---
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 24h
  url: https://crowdsecurity.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
  annotations:
    # ${REGISTRATION_TOKEN} below is for CrowdSec itself, not for Flux.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
  values:
    container_runtime: containerd      # CRI log format
    image:
      kubectl:
        tag: "1.36.4"                  # CAPI registration job; the chart defaults to latest
    config:
      config.yaml.local: |
        api:
          server:
            auto_registration:   # agents register with the chart's token, from pod IPs only
              enabled: true
              token: "${REGISTRATION_TOKEN}"
              allowed_ranges: ["10.42.0.0/16"]
    lapi:
      persistentVolume:
        data: { enabled: false }
        config: { enabled: false }
      # Registers the bouncer with this key at start (bouncer.yaml).
      env:
        - name: BOUNCER_KEY_cilium
          valueFrom: { secretKeyRef: { name: bouncer, key: key } }
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
      resources:
        requests: { cpu: 20m, memory: 128Mi }
        limits: { memory: 384Mi }
    agent:
      acquisition:
        - namespace: kube-system
          podName: cilium-envoy-*
          program: nginx
          poll_without_inotify: true   # the log is a symlink: inotify would miss rotations
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/nginx crowdsecurity/base-http-scenarios crowdsecurity/http-cve"
        # Private ranges (LAN, VPN, pods) are never banned.
        - name: PARSERS
          value: "crowdsecurity/whitelists"
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6060"
      resources:
        requests: { cpu: 20m, memory: 96Mi }
        limits: { memory: 256Mi }
