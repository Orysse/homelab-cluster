# Traefik is installed by k3s: only its values are overridden here.
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${INGRESS_ADDRESS}
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          middlewares:
            - kube-system-security-headers@kubernetescrd
