# Traefik is installed by k3s: only its values are overridden here.
# Routing: Gateway API. GatewayClass and Gateways are declared in gateway.yaml, so the
# chart must not create its own (it would conflict with ours on the class name).
# Two LoadBalancer IPs: the default Service (${INGRESS_ADDRESS}, port-forwarded by the
# router) exposes web/websecure; the "internal" Service (${INTERNAL_ADDRESS}, LAN and VPN
# only) exposes the internal entry point and nothing else.
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    # JSON logs; the pod annotation tags them source:traefik so Datadog's Traefik log
    # pipeline parses them (status, duration, router, client). Request headers are
    # dropped by default.
    logs:
      general:
        format: json
      access:
        enabled: true
        format: json
    # One trace per request, sent over OTLP to the Datadog agent on the same node.
    tracing:
      serviceName: traefik
      resourceAttributes:
        deployment.environment: homelab     # -> env:homelab in Datadog
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: datadog-agent.datadog.svc.cluster.local:4317
          insecure: true
    deployment:
      podAnnotations:
        ad.datadoghq.com/traefik.logs: '[{"source":"traefik","service":"traefik"}]'
    providers:
      kubernetesGateway:
        enabled: true
      # Routing is Gateway API only: no Ingress objects, and Traefik CRDs (middlewares, TLS
      # store, dashboard) only from kube-system, so a namespace admin cannot route arbitrary
      # hostnames.
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        namespaces: [kube-system]
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${INGRESS_ADDRESS}
      # Local: keeps the client's real IP (no SNAT by kube-proxy). MetalLB then announces the
      # IP from the node running Traefik.
      spec:
        externalTrafficPolicy: Local
      additionalServices:
        internal:
          spec:
            type: LoadBalancer
            externalTrafficPolicy: Local
          annotations:
            metallb.io/loadBalancerIPs: ${INTERNAL_ADDRESS}
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          middlewares:
            - kube-system-security-headers@kubernetescrd
      internal:
        port: 9443
        exposedPort: 443
        protocol: TCP
        expose:
          default: false
          internal: true
        http:
          tls:
            enabled: true
          middlewares:
            - kube-system-security-headers@kubernetescrd
    # Dashboard (read-only), on the internal entry point only.
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.int.${DOMAIN}`)
        entryPoints: ["internal"]
