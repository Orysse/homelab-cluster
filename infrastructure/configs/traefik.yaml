# Traefik est installé par k3s : on n'en surcharge que les values.
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${INGRESS_ADDRESS}
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
