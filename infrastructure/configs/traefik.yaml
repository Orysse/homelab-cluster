# Traefik is installed by k3s: only its values are overridden here.
# Routing: Gateway API. GatewayClass and Gateway are declared in gateway.yaml, so the
# chart must not create its own (it would conflict with ours on the class name).
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${INGRESS_ADDRESS}
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          middlewares:
            - kube-system-security-headers@kubernetescrd
