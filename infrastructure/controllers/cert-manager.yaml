# cert-manager : émet et renouvelle les certificats TLS (Let's Encrypt).
# Les émetteurs (ClusterIssuer) sont dans infrastructure/configs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: cert-manager
spec:
  interval: 24h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  values:
    crds:
      enabled: true
    # Résolution DNS-01 via des serveurs publics, pas via le DNS du LAN (box),
    # pour vérifier ce que Let's Encrypt verra réellement.
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
