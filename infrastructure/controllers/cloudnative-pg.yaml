# CloudNativePG: the operator that runs the apps' PostgreSQL (infrastructure/configs/postgres),
# and its Barman Cloud plugin, which ships base backups and WAL to S3 (Garage on the backup
# host). The plugin must live in the operator's namespace; its certificates come from
# cert-manager.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 24h
  url: https://cloudnative-pg.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"     # CloudNativePG 1.30.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
  values:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 1h
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.8.1"      # plugin v0.15.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
  values:
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 128Mi }
---
# The operator: webhooks from the API server, reaches the API server, each instance's status
# endpoint and the plugin (gRPC). The plugin answers the operator and the instances.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: cloudnative-pg }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEntities: [kube-apiserver, remote-node, host]
      toPorts: [{ ports: [{ port: "9443", protocol: TCP }] }]
  egress:
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: postgres, cnpg.io/podRole: instance }
      toPorts: [{ ports: [{ port: "8000", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: plugin-barman-cloud }
      toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: plugin-barman-cloud }
  enableDefaultDeny: { ingress: true, egress: true }
  ingress:
    - fromEndpoints:
        - matchLabels: { app.kubernetes.io/name: cloudnative-pg }
        - matchLabels: { k8s:io.kubernetes.pod.namespace: postgres, cnpg.io/podRole: instance }
      toPorts: [{ ports: [{ port: "9090", protocol: TCP }] }]
  egress:
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
