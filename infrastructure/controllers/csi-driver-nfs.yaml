# Volumes as directories on the storage host's NFS export (homelab-nix storage.nix):
# the VMs keep no state. StorageClass: infrastructure/configs/storage.yaml.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.5"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  values:
    feature:
      enableFSGroupPolicy: true   # pods' fsGroup owns their volume
    controller:
      replicas: 1
