# Datadog Operator : gère l'agent Datadog (DaemonSet sur chaque nœud + Cluster Agent)
# à partir d'une seule ressource DatadogAgent (infrastructure/configs/datadog-agent.yaml).
---
apiVersion: v1
kind: Namespace
metadata:
  name: datadog
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: datadog
  namespace: datadog
spec:
  interval: 24h
  url: https://helm.datadoghq.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datadog-operator
  namespace: datadog
spec:
  interval: 1h
  chart:
    spec:
      chart: datadog-operator
      version: "2.27.0"   # operator 1.30.0
      sourceRef:
        kind: HelmRepository
        name: datadog
  values:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
