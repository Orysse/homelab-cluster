# External Secrets Operator: ExternalSecret objects become plain Kubernetes Secrets, read
# from OpenBao (ClusterSecretStore in infrastructure/configs/openbao/).
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: "2.12.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 192Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
    certController:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
