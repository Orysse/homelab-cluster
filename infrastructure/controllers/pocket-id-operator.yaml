# Pocket-ID operator (ADR 0004): runs Pocket-ID from a PocketIDInstance and keeps its OIDC
# clients and groups as objects. Each app declares its client (PocketIDOIDCClient) in its
# own namespace and mounts the credentials Secret the operator writes next to it.
# The instance itself is in infrastructure/configs/identity/pocket-id: it needs secrets.
# Supports Pocket-ID >=2.14 <3.0 only (renovate.json holds Pocket-ID below 3).
---
apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id-operator
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pocket-id-operator
  namespace: pocket-id-operator
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/aclerici38/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
  namespace: pocket-id-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: pocket-id-operator
      version: "0.16.2"
      sourceRef:
        kind: HelmRepository
        name: pocket-id-operator
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    instance:
      enabled: false            # declared in configs/identity/pocket-id
    operator:
      autoGenerateLogos: false  # no logo fetched from a CDN
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 128Mi }
---
# The operator: the API server, and Pocket-ID's API (clients, groups).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pocket-id-operator
  namespace: pocket-id-operator
spec:
  endpointSelector: {}
  enableDefaultDeny: { ingress: true, egress: true }
  egress:
    - toEntities: [kube-apiserver]
      toPorts: [{ ports: [{ port: "6443", protocol: TCP }] }]
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules: { dns: [{ matchPattern: "*" }] }
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: pocket-id }
      toPorts: [{ ports: [{ port: "1411", protocol: TCP }] }]
