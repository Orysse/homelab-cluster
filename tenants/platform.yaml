# What every tenant gets, bound per namespace (tenants/<name>/).
#
# tenant-admin: everything an app needs in its own namespace, but NOT
#   - NetworkPolicies (read only): allow rules add up, a tenant could reopen the LAN;
#   - ResourceQuota / LimitRange (read only);
#   - Gateways, Ingresses, Traefik CRDs: routing goes through the tenant's own listener on
#     the shared Gateway (infrastructure/configs/gateway.yaml), limited to its hostnames.
# RBAC escalation prevention means a tenant can only hand out these rights, never more.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-admin
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, pods/attach, pods/portforward, services,
      configmaps, secrets, persistentvolumeclaims, serviceaccounts]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [events, endpoints, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: ["*"]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: ["*"]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: ["*"]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, grpcroutes, referencegrants]
    verbs: ["*"]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: ["*"]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  # Their own GitOps, applied with a service account of their namespace (policy below).
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets]
    verbs: ["*"]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: ["*"]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: ["*"]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [providers, alerts]
    verbs: ["*"]
---
# Flux applies a Kustomization / HelmRelease with the controller's cluster-wide rights
# unless it names a service account. In tenant namespaces, it must: the service account
# can only hold tenant-admin.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-flux-impersonation
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: homelab.abe.lc/tenant, operator: Exists }
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: ["*"]
        resources: [kustomizations]
        operations: [CREATE, UPDATE]
      - apiGroups: [helm.toolkit.fluxcd.io]
        apiVersions: ["*"]
        resources: [helmreleases]
        operations: [CREATE, UPDATE]
  validations:
    - expression: "has(object.spec.serviceAccountName) && object.spec.serviceAccountName != ''"
      message: "In a tenant namespace, set spec.serviceAccountName (e.g. flux)."
    - expression: "!has(object.spec.kubeConfig)"
      message: "spec.kubeConfig is not allowed in a tenant namespace."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-flux-impersonation
spec:
  policyName: tenant-flux-impersonation
  validationActions: [Deny]
